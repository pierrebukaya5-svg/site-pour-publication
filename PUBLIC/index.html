<script>
// CORRECTION 1: CLAVIER SEULEMENT ENTER
document.addEventListener('keydown', function(e){
  if(e.key==='Enter'){    const activeModalMaison =!document.getElementById('modal-maison-maitre')?.classList.contains('hidden');
    const activeModalLogin =!document.getElementById('modal-login-flottant')?.classList.contains('hidden');
    const activeModalCours =!document.getElementById('modal-demande-cours')?.classList.contains('hidden');
    const activeModalFrais =!document.getElementById('modal-frais-eleve')?.classList.contains('hidden');
    if(activeModalFrais){enregistrerFraisEleve();}
    else if(activeModalCours){soumettreDemandeCours();}
    else if(activeModalMaison){
      const etapeCode =!document.getElementById('maison-etape-code-maitre')?.classList.contains('hidden');
      if(etapeCode) verifierCodeMaitreMaison();
      else {
        const ancienFocus = document.activeElement;
        if(ancienFocus && (ancienFocus.id==='maison-ancien-code-maitre-confirm' || ancienFocus.id==='maison-nouveau-code-maitre')){
          changerCodeMaitreAvecConfirmation();
        } else if(ancienFocus && (ancienFocus.id==='maison-nom-ecole' || ancienFocus.id==='maison-code-ecole')){
          creerEcoleViaMaison();
        }
      }
    }
    else if(activeModalLogin){
      if(currentLoginRole==='admin' || currentLoginRole==='prof'){validerLoginFlottant();}
      else {validerLoginFlottantPE();}
    }
    else {
      const target = e.target;
      if(target.id==='admin-whatsapp-input'){envoyerMessageAdmin();}
      else if(target.id==='parent-whatsapp-input'){envoyerMessageParent();}
      else if(target.id==='flottant-code'){validerLoginFlottant();}
      else if(target.id==='flottant-code-pe'){validerLoginFlottantPE();}
    }
  }
});

// CORRECTION 2: TABS SANS COURS-DEMANDES
function changerOngletAdmin(onglet){
  const tabs=['eleves','frais','presences','deliberation','messages','tuteurs','professeurs','communiques'];
  tabs.forEach(t=>{
    const btn=document.getElementById('tab-btn-'+(t==='professeurs'?'profs':t==='deliberation'?'delib':t==='messages'?'msgs':t==='frais'?'frais':t));
    const sec=document.getElementById('admin-sec-'+t);
    if(btn){
      if(t===onglet){btn.className='tab-active px-3 py-2 rounded-xl text-xs font-semibold';}
      else {btn.className='tab-inactive px-3 py-2 rounded-xl text-xs';}
    }
    if(sec){if(t===onglet) sec.classList.remove('hidden'); else sec.classList.add('hidden');}
  });
}

// CORRECTION 3: PROF 2-3 COURS
function ajouterProfesseurUnique(){
  const nom=document.getElementById('prof-nom').value.trim();
  const coursInput=document.getElementById('prof-cours').value.trim();
  if(!nom||!coursInput){alert('Nom et cours [Entree] - 2 ou 3 cours separes par virgule');return;}  const coursListe = coursInput.split(',').map(c=>c.trim()).filter(c=>c.length>0).slice(0,3);
  const cours = coursListe.join(', ');
  const ecoleActive=sessionActive.ecole||ECOLE_PRINCIPALE;
  const existing=obtenirTousCodesExistants();
  const code=genererCodeUnique('PROF', existing);
  const k=db.ref('professeurs').push().key;
  db.ref('professeurs/'+k).set({nom,cours,coursListe,code,ecole:ecoleActive}).then(()=>alert('Prof ajoute - '+coursListe.length+' cours: '+cours));
}
function remplirSelectCoursProf(){
  const sel=document.getElementById('prof-select-cours');if(!sel)return;
  const prof=donneesGlobales.professeurs[sessionActive.id];if(!prof)return;
  const liste=prof.coursListe|| (prof.cours? prof.cours.split(',').map(c=>c.trim()):[]);
  sel.innerHTML='<option value="">Cours ('+liste.length+')</option>';
  liste.forEach(c=>{const o=document.createElement('option');o.value=c;o.innerText=c;sel.appendChild(o);});
}
function chargerTableauDeBordProf(){remplirSelectCoursProf();
  const tb=document.getElementById('prof-liste-eleves-action'); if(!tb) return; tb.innerHTML='';
  const ecoleActive=sessionActive.ecole||ECOLE_PRINCIPALE;
  const classeFiltre=document.getElementById('prof-select-classe')?.value;
  const filtres=Object.entries(donneesGlobales.eleves||{}).filter(([k,el])=>(el.ecole||ECOLE_PRINCIPALE)===ecoleActive && (!classeFiltre||el.classe===classeFiltre) && el.statut!=='bloque_frais');
  filtres.forEach(([k,el])=>{tb.innerHTML+=`<tr><td>${el.nom}</td><td><input id="note-${k}" placeholder="Note /20"></td><td><button onclick="enregistrerNoteProf('${k}')">Save [Entree]</button></td></tr>`;});
}
function enregistrerNoteProf(eleveId){
  const trim=document.getElementById('prof-select-trimestre').value||'T1';
  const note=document.getElementById('note-'+eleveId).value;
  const prof = donneesGlobales.professeurs[sessionActive.id];
  let coursActif = prof?.cours||'Cours';
  const sel=document.getElementById('prof-select-cours');
  if(sel && sel.value){coursActif=sel.value;} else if(prof && prof.coursListe && prof.coursListe.length>0){coursActif=prof.coursListe[0];}
  const k=eleveId+'_'+trim+'_'+coursActif.replace(/\s+/g,'_');
  db.ref('notes/'+k).set({eleveId,trimestre:trim,cours:coursActif,note:parseFloat(note)||0,max:20,ecole:sessionActive.ecole||ECOLE_PRINCIPALE,date:Date.now()});
}
</script>
