// 1. TITRE DYNAMIQUE - Bobokoli / Don Bosco partout - sans modifier ton code
function mettreAJourTitresEcole_A(nomEcole){
  if(!nomEcole) return;
  try{
    let els = {
      'accueil-ecole-connectee': 'Connecté: '+nomEcole,
      'admin-titre-ecole': 'Admin - '+nomEcole,
      'frais-ecole-nom': nomEcole,
      'prof-ecole-nom': nomEcole,
      'comm-ecole-nom': '- '+nomEcole
    };
    for(let id in els){
      let e=document.getElementById(id);
      if(e) e.innerText = els[id];
    }
    document.title = nomEcole + ' - Gestion Ecole';
    let wp=document.getElementById('welcome-prof'); if(wp && window.sessionActive && sessionActive.nom) wp.innerText = sessionActive.nom + ' - ' + nomEcole;
    let we=document.getElementById('welcome-eleve'); if(we && window.sessionActive && sessionActive.nom) we.innerText = sessionActive.nom + ' - ' + nomEcole;
  }catch(e){}
}

// Wrapper qui garde ton changerVue original intact
(function(){
  let origChangerVue = window.changerVue;
  window.changerVue = function(vue,reset=false){
    if(origChangerVue) origChangerVue(vue,reset);
    setTimeout(()=>{ try{ mettreAJourTitresEcole_A(sessionActive.ecole||'Lycee Don Bosco'); }catch(e){} }, 100);
  };
})();

// 2. CLAVIER - Enter + Echap reconnus - on garde ton keydown original
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    try{
      let m1=document.getElementById('modal-frais-eleve'); if(m1 &&!m1.classList.contains('hidden')){ if(window.fermerModalFraisEleve) fermerModalFraisEleve(); }
      let m2=document.getElementById('modal-demande-cours'); if(m2 &&!m2.classList.contains('hidden')){ if(window.fermerModalDemandeCours) fermerModalDemandeCours(); }
      let m3=document.getElementById('modal-maison-maitre'); if(m3 &&!m3.classList.contains('hidden')){ if(window.fermerMaisonMaitre) fermerMaisonMaitre(); }
      let m4=document.getElementById('modal-login-flottant'); if(m4 &&!m4.classList.contains('hidden')){ if(window.fermerLoginFlottant) fermerLoginFlottant(); }
    }catch(err){}
  }
});

// 3. PROF DEMANDE AJOUT COURS + DEVOIRS PDF - UI injectée dynamiquement sans toucher ton HTML
function injecterUIProf_A(){

    let div = document.createElement('div');
    div.id='prof-sec-demande-cours-A';
    div.className='grid grid-cols-1 md:grid-cols-2 gap-4 mt-4';
    div.innerHTML=`
<div class="bg-slate-900 border border-amber-700/40 p-4 rounded-2xl space-y-3">
  <div class="flex justify-between items-center"><h4 class="font-bold text-amber-300 text-xs uppercase">📚 AJOUT A - Demander ajout cours - Admin accorde</h4><button onclick="ajouterNouvelleClasseDynamique_A()" class="bg-violet-600 text-white px-2 py-1 rounded text-[10px]">+ Ajouter Classe</button></div>
  <div class="grid grid-cols-1 gap-2">
    <input id="prof-demande-cours-nom-A" placeholder="Nom cours [Enter]" class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-xs">
    <input id="prof-demande-cours-classe-A" placeholder="Classe [Enter]" class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-xs">
    <button onclick="profDemanderAjoutCours_A()" class="bg-amber-600 text-white px-4 py-2.5 rounded-xl text-xs">+ Envoyer demande a Admin [Enter]</button>
  </div>
  <div id="prof-mes-demandes-liste-A" class="space-y-2 text-xs max-h-[120px] overflow-y-auto"></div>
</div>
<div class="bg-slate-900 border border-blue-700/40 p-4 rounded-2xl space-y-3">
  <h4 class="font-bold text-blue-300 text-xs uppercase">📄 AJOUT A - Envoyer Devoir PDF/Image par classe</h4>
  <div class="grid grid-cols-1 gap-2">
    <input id="devoir-titre-A" placeholder="Titre devoir [Enter]" class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-xs">
    <div class="grid grid-cols-2 gap-2">
      <select id="devoir-classe-A" class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-xs"><option value="">Choisir classe</option><option>7eme</option><option>8eme</option><option>9eme</option><option>10eme</option><option>11eme</option><option>12eme</option></select>
      <input id="devoir-fichier-A" type="file" accept=".pdf,image/*" class="bg-slate-800 border border-slate-700 text-white p-2 rounded-xl text-[10px]">
    </div>
    <textarea id="devoir-description-A" placeholder="Consignes" class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-xs h-16"></textarea>
    <button onclick="profEnvoyerDevoir_A()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-xs">+ Envoyer devoir [Enter]</button>
  </div>
  <div id="prof-liste-devoirs-envoyes-A" class="space-y-2 text-xs max-h-[150px] overflow-y-auto border-t border-slate-800 pt-2"></div>
</div>
<p class="text-[10px] text-slate-500">Classes: <span id="liste-classes-dynamiques-A" class="text-white"></span></p>
`;
    let header = profDash.querySelector('.flex.justify-between');
    if(header && header.nextSibling) profDash.insertBefore(div, header.nextSibling);
    else profDash.appendChild(div);
  }catch(e){}

let classesDynamiques_A = JSON.parse(localStorage.getItem('classes_dynamiques')||'["7eme","8eme","9eme","10eme","11eme","12eme"]');
function ajouterNouvelleClasseDynamique_A(){
  let nom=prompt("Nom nouvelle classe? Ex: Bobokoli 9eme");
  if(!nom) return; nom=nom.trim();
  if(classesDynamiques_A.includes(nom)){alert("Existe deja");return;}
  classesDynamiques_A.push(nom);
  localStorage.setItem('classes_dynamiques', JSON.stringify(classesDynamiques_A));
  try{ db.ref('config/classes/'+nom.replace(/\s+/g,'_')).set({nom:nom,date:Date.now()}); }catch(e){}
  actualiserSelectClasses_A(); alert("Classe '"+nom+"' ajoutee");
}
function actualiserSelectClasses_A(){
  let dc=document.getElementById('devoir-classe-A');
  if(dc){ let v=dc.value; dc.innerHTML='<option value="">Choisir classe</option>'; classesDynamiques_A.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;dc.appendChild(o);}); if(v) dc.value=v; }
  let le=document.getElementById('liste-classes-dynamiques-A'); if(le) le.innerText=classesDynamiques_A.join(', ');
}
function profDemanderAjoutCours_A(){
  let nom=document.getElementById('prof-demande-cours-nom-A').value.trim();
  let classe=document.getElementById('prof-demande-cours-classe-A').value.trim();
  if(!nom){alert("Entre nom cours");return;}
  let ecole=sessionActive.ecole||'Lycee Don Bosco';
  let k=db.ref('demandesCours').push().key;
  db.ref('demandesCours/'+k).set({cours:nom,classe:classe||"Toutes",profId:sessionActive.id,profNom:sessionActive.nom,ecole:ecole,statut:'en_attente',date:Date.now()}).then(()=>{
    document.getElementById('prof-demande-cours-nom-A').value='';
    document.getElementById('prof-demande-cours-classe-A').value='';
    alert("Demande envoyee a Admin "+ecole);
    chargerMesDemandesProf_A();
  });
}
function chargerMesDemandesProf_A(){
  let cont=document.getElementById('prof-mes-demandes-liste-A'); if(!cont) return;
  let html="";
  for(let k in (donneesGlobales.demandesCours||{})){
    let d=donneesGlobales.demandesCours[k];
    if(d.profId===sessionActive.id){
      let col=d.statut==='autorise'?'text-emerald-400':d.statut==='refuse'?'text-red-400':'text-amber-300';
      html+=`<div class="bg-slate-800 border p-2 rounded"><b>${d.cours}</b> (${d.classe}) - ${d.ecole} <span class="text-[10px] ${col}">${d.statut}</span></div>`;
    }
  }
  cont.innerHTML=html||"<p class='text-slate-500 text-[11px]'>Aucune demande</p>";
}
function profEnvoyerDevoir_A(){
  let titre=document.getElementById('devoir-titre-A').value.trim();
  let classe=document.getElementById('devoir-classe-A').value;
  let desc=document.getElementById('devoir-description-A').value.trim();
  let fileInput=document.getElementById('devoir-fichier-A');
  if(!titre ||!classe){ alert("Titre et classe obligatoires"); return; }
  let ecole=sessionActive.ecole||'Lycee Don Bosco';
  let k=db.ref('devoirs').push().key;
  if(fileInput.files && fileInput.files[0]){
    let f=fileInput.files[0];
    let reader=new FileReader();
    reader.onload=function(ev){
      db.ref('devoirs/'+k).set({titre:titre,classe:classe,description:desc,ecole:ecole,profId:sessionActive.id,profNom:sessionActive.nom,fichierNom:f.name,fichierBase64:ev.target.result,fichierType:f.type,date:Date.now()}).then(()=>{
        alert("Devoir envoye a classe "+classe+" - "+ecole);
        chargerDevoirsProf_A(); chargerDevoirsEleve_A();
        document.getElementById('devoir-titre-A').value='';document.getElementById('devoir-description-A').value='';fileInput.value='';
      });
    };
    reader.readAsDataURL(f);
  }else{
    db.ref('devoirs/'+k).set({titre:titre,classe:classe,description:desc,ecole:ecole,profId:sessionActive.id,profNom:sessionActive.nom,fichierNom:"",fichierBase64:"",fichierType:"",date:Date.now()}).then(()=>{chargerDevoirsProf_A();});
  }
}
function chargerDevoirsProf_A(){
  let cont=document.getElementById('prof-liste-devoirs-envoyes-A'); if(!cont) return;
  let html=""; let ecole=sessionActive.ecole||'Lycee Don Bosco';
  for(let k in (donneesGlobales.devoirs||{})){
    let d=donneesGlobales.devoirs[k];
    if(d.ecole===ecole && d.profId===sessionActive.id){
      html+=`<div class="bg-slate-800 border p-2 rounded flex justify-between"><div><b>${d.titre}</b> - ${d.classe}<br><span class="text-[10px]">${d.fichierNom||'Sans fichier'}</span></div><button onclick="db.ref('devoirs/${k}').remove()" class="text-red-400 text-[10px]">Suppr</button></div>`;
    }
  }
  cont.innerHTML=html||"<p class='text-slate-500'>Aucun devoir</p>";
}
function chargerDevoirsEleve_A(){
  try{
    let eleveDash=document.getElementById('vue-eleve-dashboard');
    if(!eleveDash) return;
    let existing=document.getElementById('eleve-devoirs-injecte-A');
    if(!existing){
      let sec=document.createElement('div');
      sec.id='eleve-devoirs-injecte-A';
      sec.className='bg-slate-800 border border-blue-700/40 rounded-2xl p-5 mt-4';
      sec.innerHTML=`<h3 class="font-bold text-blue-300 text-sm mb-3">📚 AJOUT A - Devoirs PDF/Image par classe - Telechargeable</h3><div id="eleve-liste-devoirs-A" class="space-y-2"></div>`;
      eleveDash.appendChild(sec);
    }
    let cont=document.getElementById('eleve-liste-devoirs-A'); if(!cont) return;
    let eleveId=sessionActive.enfantIdActif||sessionActive.id;
    let eleve=donneesGlobales.eleves[eleveId];
    if(!eleve) { cont.innerHTML="<p class='text-slate-500 text-xs'>Connecte-toi</p>"; return; }
    let classe=eleve.classe; let ecole=eleve.ecole||'Lycee Don Bosco';
    let html="";
    for(let k in (donneesGlobales.devoirs||{})){
      let d=donneesGlobales.devoirs[k];
      if(d.ecole===ecole && d.classe===classe){
        let dl = d.fichierBase64? `<a href="${d.fichierBase64}" download="${d.fichierNom}" class="bg-blue-600 text-white px-3 py-1.5 rounded text-[10px]">📥 Telecharger ${d.fichierNom}</a>` : '<span class="text-[10px]">Pas de fichier</span>';
        html+=`<div class="bg-slate-900 border p-3 rounded"><b class="text-white text-xs">${d.titre}</b> - ${d.classe} - Par ${d.profNom}<br><span class="text-[11px]">${d.description||''}</span><div class="mt-2">${dl}</div></div>`;
      }
    }
    cont.innerHTML=html||`<p class='text-slate-500 text-xs'>Aucun devoir pour ${classe} - ${ecole}</p>`;
  }catch(e){}
}

(function(){
  let origRaf = window.rafraichirDonneesPage;
  window.rafraichirDonneesPage = function(){
    if(origRaf) origRaf();
    try{
      actualiserSelectClasses_A();

      chargerDevoirsProf_A();
      chargerDevoirsEleve_A();
      mettreAJourTitresEcole_A(sessionActive.ecole||'Lycee Don Bosco');
    }catch(e){}
  };
})();

  let origEleve = window.chargerTableauDeBordEleveOuParent;
  window.chargerTableauDeBordEleveOuParent = function(){
    if(origEleve) origEleve();
    try{ chargerDevoirsEleve_A(); mettreAJourTitresEcole_A(sessionActive.ecole||'Lycee Don Bosco'); }catch(e){}

window.addEventListener('load', ()=>{
  setTimeout(()=>{
    try{ injecterUIProf_A(); actualiserSelectClasses_A(); mettreAJourTitresEcole_A(sessionActive.ecole||'Lycee Don Bosco'); chargerDevoirsEleve_A(); }catch(e){}
  }, 1200);
});
