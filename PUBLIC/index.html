<script>
function ouvrirLoginFlottant(role){
currentLoginRole=role;
if(role==='eleve' || role==='parent'){
document.getElementById('modal-login-flottant-pe').classList.remove('hidden');
document.getElementById('flottant-code-pe').focus();
}else{
document.getElementById('flottant-titre').innerText = role==='admin'? 'ADMIN - Code: PR123' : 'PROF - Code prof';
document.getElementById('modal-login-flottant').classList.remove('hidden');
document.getElementById('flottant-code').focus();
}
}
function fermerLoginFlottant(){document.getElementById('modal-login-flottant').classList.add('hidden');}
function fermerLoginFlottantPE(){document.getElementById('modal-login-flottant-pe').classList.add('hidden');}
function validerLoginFlottant(){
const code=document.getElementById('flottant-code').value.trim();
const err=document.getElementById('flottant-erreur');
if(currentLoginRole==='admin'){
if(code===MDP_ADMIN_DON_BOSCO){sessionActive={role:'admin',id:'admin',nom:'Admin Don Bosco',ecole:ECOLE_PRINCIPALE};fermerLoginFlottant();afficherVue('admin');chargerAdmin();}
else{err.innerText='Code incorrect. Utilise PR123';err.classList.remove('hidden');}
}else if(currentLoginRole==='prof'){
const profs=Object.entries(donneesGlobales.professeurs||{}).find(([k,p])=>p.code===code);
if(profs){sessionActive={role:'prof',id:profs[0],nom:profs[1].nom,ecole:profs[1].ecole};fermerLoginFlottant();afficherVue('prof');chargerTableauDeBordProf();}
else{err.innerText='Code prof introuvable';err.classList.remove('hidden');}
}
}
function validerLoginFlottantPE(){
const code=document.getElementById('flottant-code-pe').value.trim().toUpperCase();
const eleve=Object.entries(donneesGlobales.eleves||{}).find(([k,e])=> (e.code||'').toUpperCase()===code);
if(eleve){sessionActive={role:'eleve',id:eleve[0],nom:eleve[1].nom,ecole:eleve[1].ecole};fermerLoginFlottantPE();afficherVue('eleve');chargerEleve();return;}
const tuteur=Object.entries(donneesGlobales.tuteurs||{}).find(([k,t])=> (t.code||'').toUpperCase()===code);
if(tuteur){sessionActive={role:'parent',id:tuteur[0],nom:tuteur[1].nom,ecole:tuteur[1].ecole};fermerLoginFlottantPE();afficherVue('parent');chargerParent();return;}
alert('Code non trouvé');
}
function afficherVue(vue){
['accueil','admin-dashboard','prof-dashboard','eleve-dashboard','parent-dashboard'].forEach(v=>{const el=document.getElementById('vue-'+v);if(el) el.classList.add('hidden');});
const cible=document.getElementById('vue-'+vue+'-dashboard')||document.getElementById('vue-'+vue);if(cible) cible.classList.remove('hidden');
}
function deconnexion(){sessionActive={role:null,id:null,nom:null,ecole:ECOLE_PRINCIPALE};afficherVue('accueil');}
</script></body></html>
