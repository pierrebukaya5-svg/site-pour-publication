<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Don Bosco Multi-Ecoles V2 Final</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script><style>.hidden{display:none!important}</style></head><body class="bg-slate-950 text-white min-h-screen">
<script>
const firebaseConfig={apiKey:"AIzaSyC3Rz47_bWObG0M3w4S9o9eQy2l4t5u6v7w8",authDomain:"site-publication.firebaseapp.com",databaseURL:"https://site-publication-default-rtdb.firebaseio.com",projectId:"site-publication",storageBucket:"site-publication.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abcdef"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let donneesGlobales={eleves:{},tuteurs:{},professeurs:{},notes:{},presences:{},messages:{},prix:{},frais:{},ecoles:{},demandesCours:{},deliberations:{}};
let sessionActive={role:null,id:null,ecole:null,nom:'',classe:'',cours:'',enfantIdActif:null};
db.ref().on('value',snap=>{donneesGlobales=snap.val()||{};donneesGlobales.eleves=donneesGlobales.eleves||{};donneesGlobales.tuteurs=donneesGlobales.tuteurs||{};donneesGlobales.professeurs=donneesGlobales.professeurs||{};donneesGlobales.notes=donneesGlobales.notes||{};donneesGlobales.presences=donneesGlobales.presences||{};donneesGlobales.messages=donneesGlobales.messages||{};donneesGlobales.ecoles=donneesGlobales.ecoles||{};donneesGlobales.demandesCours=donneesGlobales.demandesCours||{};donneesGlobales.deliberations=donneesGlobales.deliberations||{};if(sessionActive.role) actualiserInterface();});
function getEcolesList(){let l=Object.values(donneesGlobales.ecoles||{});if(l.length===0) return ['DON BOSCO DURBA','COMPLEXE ARUA'];return l.map(e=>e.nom);}
function actualiserInterface(){if(sessionActive.role==='admin') chargerTableauDeBordAdmin();if(sessionActive.role==='prof') chargerTableauDeBordProf();if(sessionActive.role==='eleve') chargerTableauDeBordEleve();if(sessionActive.role==='parent') chargerTableauDeBordParent();}
function envoyerMessage(texte){if(!texte||!texte.trim()) return;const msg={id:Date.now(),emetteur:sessionActive.id,emetteurNom:sessionActive.nom,emetteurRole:sessionActive.role,ecole:sessionActive.ecole,texte:texte.trim(),date:new Date().toLocaleString('fr-CD'),destinataire:sessionActive.role==='parent'?'admin':'parent'};db.ref('messages/'+msg.id).set(msg);const inp=document.getElementById('input-msg')||document.getElementById('input-msg-parent');if(inp) inp.value='';}
function chargerMessages(){const cont=document.getElementById('cont-messages')||document.getElementById('cont-messages-parent');if(!cont) return;cont.innerHTML='';Object.values(donneesGlobales.messages||{}).filter(m=>m.ecole===sessionActive.ecole).sort((a,b)=>a.id-b.id).forEach(m=>{const moi=m.emetteur===sessionActive.id;cont.innerHTML+=`<div class="p-2 my-1 rounded-xl max-w-[85%] text-[13px] ${moi?'bg-violet-600 ml-auto':'bg-slate-800'}"><div class="text-[9px] opacity-60">${m.emetteurNom} - ${m.date}</div>${m.texte}</div>`;});cont.scrollTop=cont.scrollHeight;}
function validerPresence(eleveId,statut){const now=new Date();const key=now.toISOString().slice(0,10)+'_'+eleveId;db.ref('presences/'+key).set({eleveId:eleveId,date:now.toISOString().slice(0,10),heure:now.toLocaleTimeString('fr-CD',{hour:'2-digit',minute:'2-digit'}),statut:statut,ecole:sessionActive.ecole,validePar:sessionActive.nom,timestamp:Date.now()});}
function getPresenceJour(eleveId){const today=new Date().toISOString().slice(0,10);return Object.values(donneesGlobales.presences||{}).find(p=>p.eleveId===eleveId && p.date===today);}
function getStatutFraisAuto(eleveId,classe){const el=donneesGlobales.eleves[eleveId];if(!el) return{paye:0,reste:0};const prix=donneesGlobales.prix&&donneesGlobales.prix[classe];const frais=donneesGlobales.frais&&donneesGlobales.frais[eleveId]?Object.values(donneesGlobales.frais[eleveId]):[];let paye=0;frais.forEach(f=>paye+=parseFloat(f.montant)||0);if(!prix) return{paye,reste:0,prix:null,statut:'non_defini'};const total=prix.minerval||0;const reste=total-paye;let statut='non_paye';if(paye>=(prix.acompte||0)) statut='acompte';if(paye>=total) statut='en_ordre';return{prix,paye,reste,statut};}
function connecter(){const ecole=document.getElementById('select-ecole-login').value;if(!ecole){alert('Choisis ecole');return;}sessionActive.ecole=ecole;const role=document.getElementById('select-role').value;const code=document.getElementById('input-code').value.trim();if(role==='admin'){if(code==='DONBOSCO2026'||code==='admin2026'){sessionActive.role='admin';sessionActive.id='admin';sessionActive.nom='Admin '+ecole;afficherPage('admin');chargerTableauDeBordAdmin();return;}alert('Code faux');return;}if(role==='prof'){for(let k in donneesGlobales.professeurs){const p=donneesGlobales.professeurs[k];if(p.codeProf===code && (p.ecole===ecole||!p.ecole)){sessionActive.role='prof';sessionActive.id=k;sessionActive.nom=p.nom;sessionActive.cours=p.cours;afficherPage('prof');chargerTableauDeBordProf();return;}}alert('Prof non trouve');return;}if(role==='eleve'){for(let k in donneesGlobales.eleves){const el=donneesGlobales.eleves[k];if(el.codeEleve===code && (el.ecole===ecole||!el.ecole)){sessionActive.role='eleve';sessionActive.id=k;sessionActive.nom=el.nom+' '+el.prenom;sessionActive.classe=el.classe;afficherPage('eleve');chargerTableauDeBordEleve();return;}}alert('Eleve non trouve');return;}if(role==='parent'){for(let k in donneesGlobales.tuteurs){const t=donneesGlobales.tuteurs[k];if(t.codeTuteur===code && (t.ecole===ecole||!t.ecole)){sessionActive.role='parent';sessionActive.id=k;sessionActive.nom=t.nom;sessionActive.enfantIdActif=t.enfants&&t.enfants[0]?t.enfants[0]:null;afficherPage('parent');chargerTableauDeBordParent();return;}}alert('Parent non trouve');return;}}
function afficherPage(role){document.getElementById('page-login').classList.add('hidden');['admin','prof','eleve','parent','admin-config'].forEach(r=>{const d=document.getElementById('page-'+r);if(d) d.classList.add('hidden');});document.getElementById('page-'+role).classList.remove('hidden');document.querySelectorAll('[id^=label-ecole-active]').forEach(l=>l.innerText=sessionActive.ecole||'');}
function deconnecter(){sessionActive={role:null,id:null,ecole:null};document.getElementById('page-login').classList.remove('hidden');['admin','prof','eleve','parent','admin-config'].forEach(r=>{const d=document.getElementById('page-'+r);if(d) d.classList.add('hidden');});chargerEcolesAuLogin();}
function chargerEcolesAuLogin(){const sel=document.getElementById('select-ecole-login');if(!sel) return;sel.innerHTML='<option value="">-- Choisis ton ecole --</option>';getEcolesList().forEach(n=>{sel.innerHTML+=`<option value="${n}">${n}</option>`;});}
</script>
<div id="page-login" class="min-h-screen flex items-center justify-center p-4"><div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm space-y-3"><h1 class="font-bold text-center">Don Bosco V2 Final</h1><select id="select-ecole-login" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl"></select><select id="select-role" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl"><option value="eleve">Eleve</option><option value="parent">Parent</option><option value="prof">Prof</option><option value="admin">Admin</option></select><input id="input-code" placeholder="Code" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl"><button onclick="connecter()" class="w-full bg-violet-600 py-3 rounded-xl font-bold">Entrer</button></div></div>

<div id="page-admin" class="hidden min-h-screen p-2"><div class="max-w-7xl mx-auto space-y-3">
<div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl flex justify-between"><div><h1 class="font-bold text-sm">Admin <span id="label-ecole-active" class="text-violet-400"></span></h1></div><div class="flex gap-2"><button onclick="document.getElementById('modal-ecoles').classList.remove('hidden')" class="bg-slate-800 px-3 py-2 rounded-xl text-[11px]">Ecoles</button><button onclick="document.getElementById('page-admin-config').classList.remove('hidden')" class="bg-slate-800 px-3 py-2 rounded-xl text-[11px]">Config</button><button onclick="deconnecter()" class="bg-red-600 px-3 py-2 rounded-xl text-[11px]">Sortir</button></div></div>
<div class="grid grid-cols-3 md:grid-cols-6 gap-2"><button onclick="showTabAdmin('eleves')" class="bg-violet-600 py-2 rounded-xl text-[11px]">% Place</button><button onclick="showTabAdmin('presence')" class="bg-slate-800 py-2 rounded-xl text-[11px]">Presence PRO</button><button onclick="showTabAdmin('frais')" class="bg-slate-800 py-2 rounded-xl text-[11px]">Frais</button><button onclick="showTabAdmin('cours')" class="bg-slate-800 py-2 rounded-xl text-[11px]">Cours</button><button onclick="showTabAdmin('delib')" class="bg-slate-800 py-2 rounded-xl text-[11px]">Delib</button><button onclick="showTabAdmin('msg')" class="bg-slate-800 py-2 rounded-xl text-[11px]">Messages</button></div>
<div id="tab-admin-eleves" class="bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="liste-eleves-admin" class="space-y-2 max-h-[500px] overflow-y-auto"></div></div>
<div id="tab-admin-presence" class="hidden bg-slate-900 border border-slate-700 p-3 rounded-2xl"><input id="search-presence" placeholder="Chercher..." oninput="chargerTableauDeBordAdmin()" class="w-full bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs mb-2"><div id="liste-presence-admin" class="space-y-1 max-h-[600px] overflow-y-auto"></div></div>
<div id="tab-admin-frais" class="hidden bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="liste-frais-admin"></div></div>
<div id="tab-admin-cours" class="hidden bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="liste-demandes-cours"></div></div>
<div id="tab-admin-delib" class="hidden bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="liste-delib-admin"></div></div>
<div id="tab-admin-msg" class="hidden bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="cont-messages" class="bg-slate-950 border border-slate-700 rounded-xl h-[350px] overflow-y-auto p-2 mb-2"></div><div class="flex gap-2"><input id="input-msg" placeholder="Repondre..." class="flex-1 bg-slate-800 border border-slate-600 p-3 rounded-xl"><button onclick="envoyerMessage(document.getElementById('input-msg').value)" class="bg-violet-600 px-4 rounded-xl">Envoyer</button></div></div>
</div></div>
<div id="page-prof" class="hidden min-h-screen p-2"><div class="max-w-5xl mx-auto space-y-3"><div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl flex justify-between"><div><h1 class="font-bold text-sm">Prof <span id="label-ecole-active-prof" class="text-violet-400"></span> - <span id="prof-nom-label"></span></h1></div><button onclick="deconnecter()" class="bg-red-600 px-3 py-1 rounded-xl text-xs">Sortir</button></div><div class="grid grid-cols-3 gap-2"><button onclick="showTabProf('notes')" class="bg-violet-600 py-2 rounded-xl text-[11px]">Notes</button><button onclick="showTabProf('cours')" class="bg-slate-800 py-2 rounded-xl text-[11px]">Demander Cours</button><button onclick="showTabProf('delib')" class="bg-slate-800 py-2 rounded-xl text-[11px]">Delib</button></div><div id="tab-prof-notes" class="bg-slate-900 border border-slate-700 p-3 rounded-2xl"><select id="prof-classe-select" onchange="chargerTableauDeBordProf()" class="w-full bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs mb-2"></select><div id="liste-notes-prof" class="space-y-2 max-h-[600px] overflow-y-auto"></div></div><div id="tab-prof-cours" class="hidden bg-slate-900 border border-slate-700 p-3 rounded-2xl"><input id="prof-cours-nom" placeholder="Cours" class="w-full bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs mb-1"><input id="prof-cours-classe" placeholder="Classe" class="w-full bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs mb-1"><textarea id="prof-cours-desc" placeholder="Description" class="w-full bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs mb-2"></textarea><button onclick="demanderCoursProf()" class="w-full bg-violet-600 py-2 rounded-xl text-xs">Envoyer a Admin</button><div id="liste-mes-demandes-prof" class="mt-3 space-y-1"></div></div><div id="tab-prof-delib" class="hidden bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="liste-delib-prof"></div></div></div></div>
<div id="page-eleve" class="hidden min-h-screen p-2"><div class="max-w-3xl mx-auto space-y-3"><div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl flex justify-between"><div><h1 class="font-bold text-sm">Eleve <span id="label-ecole-active-eleve" class="text-violet-400"></span> - <span id="eleve-nom-label"></span></h1></div><button onclick="deconnecter()" class="bg-red-600 px-3 py-1 rounded-xl text-xs">Sortir</button></div><div class="bg-green-900 border border-green-700 p-3 rounded-2xl"><div id="eleve-presence-view" class="text-xs"></div></div><div class="bg-violet-900 border border-violet-700 p-3 rounded-2xl"><div id="eleve-delib-view" class="text-xs"></div></div><div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="liste-notes-eleve"></div></div></div></div>
<div id="page-parent" class="hidden min-h-screen p-2"><div class="max-w-3xl mx-auto space-y-3"><div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl flex justify-between"><div><h1 class="font-bold text-sm">Parent <span id="label-ecole-active-parent" class="text-violet-400"></span></h1><p id="parent-enfant-label" class="text-[10px]"></p></div><button onclick="deconnecter()" class="bg-red-600 px-3 py-1 rounded-xl text-xs">Sortir</button></div><div class="bg-blue-900 border border-blue-700 p-3 rounded-2xl"><div id="parent-presence-view" class="text-xs"></div></div><div class="bg-violet-900 border border-violet-700 p-3 rounded-2xl"><div id="parent-delib-view" class="text-xs"></div></div><div id="parent-frais-view" class="bg-slate-900 border border-slate-700 p-3 rounded-2xl text-xs"></div><div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="cont-messages-parent" class="bg-slate-950 border border-slate-700 rounded-xl h-[300px] overflow-y-auto p-2 mb-2"></div><div class="flex gap-2"><input id="input-msg-parent" placeholder="Ecrire..." class="flex-1 bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs"><button onclick="envoyerMessage(document.getElementById('input-msg-parent').value)" class="bg-violet-600 px-3 rounded-xl text-xs">Envoyer</button></div></div><div class="bg-slate-900 border border-slate-700 p-3 rounded-2xl"><div id="liste-notes-parent"></div></div></div></div>
<div id="page-admin-config" class="hidden fixed inset-0 bg-black/80 overflow-y-auto p-4 z-50"><div class="max-w-4xl mx-auto space-y-3 bg-slate-950 p-4 rounded-2xl"><h2 class="font-bold">Config</h2><div class="grid grid-cols-4 gap-2"><input id="cfg-classe" placeholder="Classe" class="bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs"><input id="cfg-minerval" type="number" placeholder="Minerval" class="bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs"><input id="cfg-acompte" type="number" placeholder="Acompte" class="bg-slate-800 border border-slate-600 p-2 rounded-xl text-xs"><button onclick="savePrix()" class="bg-violet-600 rounded-xl text-xs">Save</button></div><div id="liste-prix-config" class="text-[11px]"></div><div class="grid md:grid-cols-3 gap-3"><div class="bg-slate-900 border p-3 rounded-2xl"><input id="cr-el-nom" placeholder="Nom" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><input id="cr-el-prenom" placeholder="Prenom" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><input id="cr-el-classe" placeholder="Classe" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><input id="cr-el-code" placeholder="Code EL" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><button onclick="createEleve()" class="w-full bg-green-600 py-2 rounded-xl text-xs">Creer Eleve</button></div><div class="bg-slate-900 border p-3 rounded-2xl"><input id="cr-pr-nom" placeholder="Nom prof" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><input id="cr-pr-cours" placeholder="Cours" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><input id="cr-pr-code" placeholder="Code PR" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><button onclick="createProf()" class="w-full bg-blue-600 py-2 rounded-xl text-xs">Creer Prof</button></div><div class="bg-slate-900 border p-3 rounded-2xl"><input id="cr-pa-nom" placeholder="Nom parent" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><input id="cr-pa-code" placeholder="Code PA" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><input id="cr-pa-enfant-code" placeholder="Code EL" class="w-full bg-slate-800 border p-2 rounded-xl text-xs mb-1"><button onclick="createParent()" class="w-full bg-orange-600 py-2 rounded-xl text-xs">Creer Parent</button></div></div><div class="bg-slate-900 border p-3 rounded-2xl flex gap-2"><input id="pay-eleve-code" placeholder="Code EL" class="bg-slate-800 border p-2 rounded-xl text-xs"><input id="pay-montant" type="number" placeholder="$" class="bg-slate-800 border p-2 rounded-xl text-xs"><button onclick="payerFrais()" class="bg-green-600 rounded-xl text-xs px-3">Payer</button><input id="pdf-eleve-code" placeholder="Code EL PDF" class="bg-slate-800 border p-2 rounded-xl text-xs"><button onclick="genererBulletinPDF()" class="bg-violet-600 px-3 rounded-xl text-xs">PDF</button></div><button onclick="document.getElementById('page-admin-config').classList.add('hidden')" class="w-full bg-slate-800 py-2 rounded-xl">Fermer</button></div></div>
<div id="modal-ecoles" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50"><div class="bg-slate-900 p-4 rounded-2xl w-full max-w-sm space-y-3"><input id="input-nouvelle-ecole" placeholder="Nom ecole" class="w-full bg-slate-800 border p-2 rounded-xl"><button onclick="ajouterEcole()" class="w-full bg-violet-600 py-2 rounded-xl">Ajouter</button><div id="liste-ecoles-modal" class="text-xs"></div><button onclick="document.getElementById('modal-ecoles').classList.add('hidden')" class="w-full bg-slate-800 py-2 rounded-xl">Fermer</button></div></div>
<script>
function showTabAdmin(n){document.querySelectorAll('[id^=tab-admin-]').forEach(e=>e.classList.add('hidden'));document.getElementById('tab-admin-'+n).classList.remove('hidden');if(n==='msg') chargerMessages();}
function ajouterEcole(){const nom=document.getElementById('input-nouvelle-ecole').value.trim().toUpperCase();if(!nom) return;db.ref('ecoles/'+Date.now()).set({nom:nom});document.getElementById('input-nouvelle-ecole').value='';}
function publierDelib(eleveId){const pct=document.getElementById('pct-'+eleveId)?.value||'';const place=document.getElementById('place-'+eleveId)?.value||'';const mention=document.getElementById('mention-'+eleveId)?.value||'';const old=donneesGlobales.deliberations[eleveId]||{};db.ref('deliberations/'+eleveId).set({...old,pourcentage:pct,place:place,mention:mention,eleveId:eleveId,ecole:sessionActive.ecole,date:new Date().toISOString(),publiePar:sessionActive.nom});}
function proposerRepechage(eleveId){const txt=document.getElementById('repe-'+eleveId)?.value;if(!txt) return;const cours=txt.split(',').map(s=>s.trim()).filter(Boolean);const old=donneesGlobales.deliberations[eleveId]||{};db.ref('deliberations/'+eleveId).set({...old,coursRepechage:cours,decision:cours.length>0?'repechage':'passe_sans_repechage',eleveId:eleveId,ecole:sessionActive.ecole});}
function validerDemandeCours(id,val){db.ref('demandesCours/'+id+'/statut').set(val?'valide':'refuse');db.ref('demandesCours/'+id+'/validePar').set(sessionActive.nom);}
function chargerTableauDeBordAdmin(){if(!sessionActive.ecole) return;const eleves=Object.entries(donneesGlobales.eleves||{}).filter(([k,v])=>(v.ecole||'DON BOSCO DURBA')===sessionActive.ecole);const c1=document.getElementById('liste-eleves-admin');if(c1){c1.innerHTML='';eleves.forEach(([id,el])=>{const delib=donneesGlobales.deliberations?.[id]||{};c1.innerHTML+=`<div class="bg-slate-800 p-2 rounded-xl"><div class="flex justify-between text-xs"><b>${el.nom} ${el.prenom}</b><span>${el.classe}</span></div><div class="grid grid-cols-4 gap-1 mt-1"><input id="pct-${id}" value="${delib.pourcentage||''}" placeholder="%" class="bg-slate-900 border border-slate-600 p-1 rounded text-[11px]"><input id="place-${id}" value="${delib.place||''}" placeholder="Place" class="bg-slate-900 border border-slate-600 p-1 rounded text-[11px]"><input id="mention-${id}" value="${delib.mention||''}" placeholder="Mention" class="bg-slate-900 border border-slate-600 p-1 rounded text-[11px]"><button onclick="publierDelib('${id}')" class="bg-green-600 rounded text-[10px]">Publier</button></div></div>`;});}
const c2=document.getElementById('liste-presence-admin');if(c2){c2.innerHTML='';eleves.forEach(([id,el])=>{const p=getPresenceJour(id);const s=p?.statut||'non';c2.innerHTML+=`<div class="bg-slate-800 p-2 rounded-xl flex justify-between items-center"><div><div class="text-xs font-bold">${el.nom}</div><div class="text-[10px] ${p?'text-green-300':'text-slate-500'}">${p?`Arrive ${p.heure} - Valide par ${p.validePar} - Parent notifie`: 'Non marque'}</div></div><div class="flex gap-1"><button onclick="validerPresence('${id}','present')" class="px-2 py-1 rounded text-[10px] ${s==='present'?'bg-green-600':'bg-slate-700'}">Present</button><button onclick="validerPresence('${id}','absent')" class="px-2 py-1 rounded text-[10px] ${s==='absent'?'bg-red-600':'bg-slate-700'}">Absent</button></div></div>`;});}
const c3=document.getElementById('liste-frais-admin');if(c3){c3.innerHTML='';eleves.forEach(([id,el])=>{const f=getStatutFraisAuto(id,el.classe);c3.innerHTML+=`<div class="bg-slate-800 p-2 rounded-xl flex justify-between text-[11px]"><span>${el.nom}</span><span>${f.paye}$/${f.prix?.minerval||'?'} Reste ${f.reste}</span></div>`;});}
const c4=document.getElementById('liste-demandes-cours');if(c4){c4.innerHTML='';Object.entries(donneesGlobales.demandesCours||{}).filter(([k,v])=>v.ecole===sessionActive.ecole).forEach(([id,d])=>{c4.innerHTML+=`<div class="bg-slate-800 p-2 rounded-xl text-xs"><b>${d.cours}</b> - ${d.classe} par ${d.profNom} - ${d.statut||'en_attente'}<div class="flex gap-1 mt-1"><button onclick="validerDemandeCours('${id}',true)" class="bg-green-600 px-2 py-1 rounded text-[10px]">Valider</button><button onclick="validerDemandeCours('${id}',false)" class="bg-red-600 px-2 py-1 rounded text-[10px]">Refuser</button></div></div>`;});}
const c5=document.getElementById('liste-delib-admin');if(c5){c5.innerHTML='';eleves.forEach(([id,el])=>{const delib=donneesGlobales.deliberations?.[id]||{};c5.innerHTML+=`<div class="bg-slate-800 p-2 rounded-xl text-[11px]"><b>${el.nom}</b><div class="flex gap-1 mt-1"><input id="repe-${id}" value="${(delib.coursRepechage||[]).join(', ')}" placeholder="Cours repechage" class="flex-1 bg-slate-900 border p-1 rounded"><button onclick="proposerRepechage('${id}')" class="bg-violet-600 px-2 rounded">Annoncer</button></div></div>`;});}
}
function showTabProf(n){document.getElementById('tab-prof-notes').classList.add('hidden');document.getElementById('tab-prof-cours').classList.add('hidden');document.getElementById('tab-prof-delib').classList.add('hidden');document.getElementById('tab-prof-'+n).classList.remove('hidden');}
function demanderCoursProf(){const nom=document.getElementById('prof-cours-nom').value.trim();const classe=document.getElementById('prof-cours-classe').value.trim();const desc=document.getElementById('prof-cours-desc').value.trim();if(!nom||!classe) return;db.ref('demandesCours/'+Date.now()).set({cours:nom,classe:classe,description:desc,profNom:sessionActive.nom,profId:sessionActive.id,ecole:sessionActive.ecole,date:new Date().toLocaleString(),statut:'en_attente'});}
function chargerTableauDeBordProf(){if(!sessionActive.ecole) return;document.getElementById('prof-nom-label').innerText=sessionActive.nom;const classes=[...new Set(Object.values(donneesGlobales.eleves||{}).filter(e=>(e.ecole||'DON BOSCO DURBA')===sessionActive.ecole).map(e=>e.classe))];const sel=document.getElementById('prof-classe-select');if(sel){sel.innerHTML='<option value="">-- Classe --</option>';classes.forEach(c=>{sel.innerHTML+=`<option value="${c}">${c}</option>`;});}const classeChoisie=sel?.value||classes[0];const cont=document.getElementById('liste-notes-prof');if(cont){cont.innerHTML='';Object.entries(donneesGlobales.eleves||{}).filter(([k,v])=>v.classe===classeChoisie && (v.ecole||'DON BOSCO DURBA')===sessionActive.ecole).forEach(([id,el])=>{const notes=donneesGlobales.notes?.[id]?.[sessionActive.cours]||{};cont.innerHTML+=`<div class="bg-slate-800 p-2 rounded-xl text-[11px]"><b>${el.nom}</b><div class="grid grid-cols-5 gap-1 mt-1"><input id="n-${id}-int1" value="${notes.int1||''}" placeholder="Int1" class="bg-slate-900 border p-1 rounded"><input id="n-${id}-int2" value="${notes.int2||''}" placeholder="Int2" class="bg-slate-900 border p-1 rounded"><input id="n-${id}-dev1" value="${notes.dev1||''}" placeholder="Dev" class="bg-slate-900 border p-1 rounded"><input id="n-${id}-ex" value="${notes.examen||''}" placeholder="Ex" class="bg-slate-900 border p-1 rounded"><button onclick="saveNoteProf('${id}')" class="bg-violet-600 rounded">Save</button></div></div>`;});}}
function saveNoteProf(eleveId){const int1=document.getElementById('n-'+eleveId+'-int1').value;const int2=document.getElementById('n-'+eleveId+'-int2').value;const dev1=document.getElementById('n-'+eleveId+'-dev1').value;const examen=document.getElementById('n-'+eleveId+'-ex').value;const total=(parseFloat(int1||0)+parseFloat(int2||0)+parseFloat(dev1||0)+parseFloat(examen||0));db.ref('notes/'+eleveId+'/'+sessionActive.cours).set({int1,int2,dev1,examen,total,eleveId,cours:sessionActive.cours});}
function chargerTableauDeBordEleve(){const el=donneesGlobales.eleves[sessionActive.id];if(!el) return;document.getElementById('eleve-nom-label').innerText=el.nom+' '+el.prenom;const p=getPresenceJour(sessionActive.id);document.getElementById('eleve-presence-view').innerHTML=p?`Present a ${p.heure} valide par ${p.validePar}`:'Non marque';const d=donneesGlobales.deliberations?.[sessionActive.id];document.getElementById('eleve-delib-view').innerHTML=d?`${d.pourcentage||0}% - Place ${d.place||'-'} - ${d.mention||''}<br>${d.coursRepechage?.length?'Repechage: '+d.coursRepechage.join(', '):d.decision==='passe_sans_repechage'?'PASSE SANS REPECHAGE':'Passe'}`:'Pas publie';}
function chargerTableauDeBordParent(){const t=donneesGlobales.tuteurs[sessionActive.id];if(!t) return;const enfantId=sessionActive.enfantIdActif||(t.enfants&&t.enfants[0]);const el=donneesGlobales.eleves[enfantId];document.getElementById('parent-enfant-label').innerText=el?el.nom+' '+el.prenom+' - '+el.classe:'';const p=getPresenceJour(enfantId);document.getElementById('parent-presence-view').innerHTML=p?`Votre enfant est arrive a ${p.heure} - ${p.statut} - Valide par ${p.validePar} - Notifie`:'Pas encore marque - vous serez notifie quand Admin valide';const d=donneesGlobales.deliberations?.[enfantId];document.getElementById('parent-delib-view').innerHTML=d?`${d.pourcentage||0}% - Place ${d.place} - ${d.mention}<br>${d.coursRepechage?.length?'Doit repecher: '+d.coursRepechage.join(', '):d.decision==='passe_sans_repechage'?'A valide sans repechage':'Passe'}`:'Pas publie';const f=getStatutFraisAuto(enfantId,el?.classe);document.getElementById('parent-frais-view').innerHTML=`Frais: ${f.paye}$/${f.prix?.minerval||0}$ Reste ${f.reste}$`;chargerMessages();}
function savePrix(){const classe=document.getElementById('cfg-classe').value.trim();const minerval=parseFloat(document.getElementById('cfg-minerval').value)||0;const acompte=parseFloat(document.getElementById('cfg-acompte').value)||0;if(!classe) return;db.ref('prix/'+classe).set({classe,minerval,acompte,ecole:sessionActive.ecole});}
function createEleve(){const nom=document.getElementById('cr-el-nom').value.trim();const prenom=document.getElementById('cr-el-prenom').value.trim();const classe=document.getElementById('cr-el-classe').value.trim();const code=document.getElementById('cr-el-code').value.trim();if(!nom||!code||!classe) return;db.ref('eleves/'+Date.now()).set({nom,prenom,classe,codeEleve:code,ecole:sessionActive.ecole});}
function createProf(){const nom=document.getElementById('cr-pr-nom').value.trim();const cours=document.getElementById('cr-pr-cours').value.trim();const code=document.getElementById('cr-pr-code').value.trim();if(!nom||!code) return;db.ref('professeurs/'+Date.now()).set({nom,cours,codeProf:code,ecole:sessionActive.ecole});}
function createParent(){const nom=document.getElementById('cr-pa-nom').value.trim();const code=document.getElementById('cr-pa-code').value.trim();const codeEl=document.getElementById('cr-pa-enfant-code').value.trim();let enfantId=null;for(let k in donneesGlobales.eleves){if(donneesGlobales.eleves[k].codeEleve===codeEl) enfantId=k;}db.ref('tuteurs/'+Date.now()).set({nom,codeTuteur:code,enfants:enfantId?[enfantId]:[],ecole:sessionActive.ecole});}
function payerFrais(){const codeEl=document.getElementById('pay-eleve-code').value.trim();const montant=parseFloat(document.getElementById('pay-montant').value)||0;let enfantId=null;for(let k in donneesGlobales.eleves){if(donneesGlobales.eleves[k].codeEleve===codeEl) enfantId=k;}if(!enfantId) return;db.ref('frais/'+enfantId+'/'+Date.now()).set({montant,date:new Date().toLocaleString(),ecole:sessionActive.ecole});}
function genererBulletinPDF(){const code=document.getElementById('pdf-eleve-code').value.trim();let eid=null,el=null;for(let k in donneesGlobales.eleves){if(donneesGlobales.eleves[k].codeEleve===code){eid=k;el=donneesGlobales.eleves[k];}}if(!eid) return;const notes=donneesGlobales.notes?.[eid]||{};const delib=donneesGlobales.deliberations?.[eid]||{};const frais=getStatutFraisAuto(eid,el.classe);const presence=getPresenceJour(eid);const zone=document.getElementById('zone-impression-pdf');zone.classList.remove('hidden');zone.innerHTML=`<div style="padding:20px;font-family:Arial"><h1 style="text-align:center">${el.ecole} - BULLETIN</h1><p><b>${el.nom} ${el.prenom} - ${el.classe}</b></p><p>Presence: ${presence?presence.statut+' '+presence.heure+' valide '+presence.validePar:'Non marque'}</p><p>Frais: ${frais.paye}/${frais.prix?.minerval||0} Reste ${frais.reste}</p><table border="1" cellpadding="6" width="100%" style="border-collapse:collapse;font-size:12px"><tr><th>Cours</th><th>Total</th></tr>${Object.entries(notes).map(([c,n])=>`<tr><td>${c}</td><td>${n.total||0}</td></tr>`).join('')}</table><div style="margin-top:15px;background:#eee;padding:10px"><b>Deliberation:</b> ${delib.pourcentage||0}% - Place ${delib.place||'-'} - ${delib.mention||''}<br>${delib.coursRepechage?.length?'Repechage: '+delib.coursRepechage.join(', '):delib.decision==='passe_sans_repechage'?'PASSE SANS REPECHAGE':''}</div></div>`;html2pdf().from(zone).save(`Bulletin_${el.nom}.pdf`).then(()=>zone.classList.add('hidden'));}
window.onload=()=>{chargerEcolesAuLogin();};
</script>
</body></html>
