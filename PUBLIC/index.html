<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let donneesGlobales = {eleves:{},tuteurs:{},professeurs:{},notes:{},frais:{},communiques:{},demandesCours:{},messages:{},presences:{},documents:{},baremes:{},config:{fraisParClasse:{}},admin:{mdp:"admin2026"}};
let sessionActive = {role:null,id:null,nom:null,classe:null,cours:null,enfantIdActif:null};
let adminContactActif = null;
let parentContactActif = null;
let moisCourantEleve = new Date().getMonth();
let anneeCouranteEleve = new Date().getFullYear();

function togglePasswordVisibility(){
  const input=document.getElementById('input-code');
  const icon=document.getElementById('eye-icon');
  if(input.type==='password'){input.type='text'; icon.setAttribute('data-lucide','eye-off');}
  else {input.type='password'; icon.setAttribute('data-lucide','eye');}
  if(window.lucide) lucide.createIcons();
}
function toggleAdminMdp(id){
  const input=document.getElementById(id);
  if(input.type==='password') input.type='text'; else input.type='password';
}
function rafraichirDonneesPage(){
  chargerCommuniquesAccueil();
  if(sessionActive.role==='admin'){chargerListeAdminEleves();chargerListeFraisParClasse();chargerListePrixClasses();chargerListeAdminTuteurs();chargerListeAdminProfs();chargerTableauPresencesAdmin();chargerContactsMessagerieAdmin();chargerAdminCommuniques();}
  else if(sessionActive.role==='prof'){chargerTableauDeBordProf();chargerBaremesProfActuels();}
  else if(sessionActive.role==='eleve'){chargerTableauDeBordEleve();chargerCalendrierEleve();chargerBaremesEleve();}
  else if(sessionActive.role==='parent'){chargerTableauDeBordParent();chargerCalendrierEleve();chargerBaremesEleve();chargerMessagesParent();}
  if(window.lucide) lucide.createIcons();
}
db.ref().on('value',(snap)=>{
  const val=snap.val();
  if(val){
    donneesGlobales = val;
    if(!donneesGlobales.eleves) donneesGlobales.eleves={};
    if(!donneesGlobales.tuteurs) donneesGlobales.tuteurs={};
    if(!donneesGlobales.professeurs) donneesGlobales.professeurs={};
    if(!donneesGlobales.frais) donneesGlobales.frais={};
    if(!donneesGlobales.communiques) donneesGlobales.communiques={};
    if(!donneesGlobales.presences) donneesGlobales.presences={};
    if(!donneesGlobales.messages) donneesGlobales.messages={};
    if(!donneesGlobales.baremes) donneesGlobales.baremes={};
    if(!donneesGlobales.config) donneesGlobales.config={fraisParClasse:{}};
    if(!donneesGlobales.config.fraisParClasse) donneesGlobales.config.fraisParClasse={};
    if(!donneesGlobales.admin) donneesGlobales.admin={mdp:"admin2026"};
    const elStats = document.getElementById('admin-stats-eleves');
    if(elStats) elStats.innerText = Object.keys(donneesGlobales.eleves).length+" eleves / "+Object.keys(donneesGlobales.tuteurs).length+" tuteurs";
  } else {
    db.ref('admin').set({mdp:"admin2026"});
  }
  rafraichirDonneesPage();
});
function changerVue(vue, reset=false){
  document.getElementById('vue-accueil').classList.add('hidden');
  const vConnex = document.getElementById('vue-connexion');
  const vAdmin = document.getElementById('vue-admin-dashboard');
  const vEleve = document.getElementById('vue-eleve-dashboard');
  const vProf = document.getElementById('vue-prof-dashboard');
  if(vConnex) vConnex.classList.add('hidden');
  if(vAdmin) vAdmin.classList.add('hidden');
  if(vEleve) vEleve.classList.add('hidden');
  if(vProf) vProf.classList.add('hidden');

  if(vue==='accueil'){
    document.getElementById('vue-accueil').classList.remove('hidden');
    if(reset){
      localStorage.removeItem('donbosco_vue'); localStorage.removeItem('donbosco_session'); localStorage.removeItem('donbosco_admin_onglet');
      window.location.hash=''; sessionActive={role:null,id:null,nom:null,classe:null,cours:null,enfantIdActif:null};
    }
  } else if(vue.includes('login')){
    if(vConnex) vConnex.classList.remove('hidden');
    const role=vue.split('-')[0]; sessionActive.role=role;
    const titres={'admin':"Connexion Admin",'prof':"Connexion Prof",'eleve':"Connexion Eleve",'parent':"Connexion Parent"};
    const tElem = document.getElementById('titre-connexion');
    if(tElem) tElem.innerText=titres[role];
    const errElem = document.getElementById('erreur-connexion');
    if(errElem) errElem.classList.add('hidden');
    const inputCode = document.getElementById('input-code');
    if(inputCode){inputCode.value=''; inputCode.type='password';}
    if(window.lucide) lucide.createIcons();
  } else {
    const t=document.getElementById('vue-'+vue) || document.getElementById('vue-'+vue+'-dashboard');
    if(t) t.classList.remove('hidden');
  }
  if(!reset && vue!=='accueil'){
    try{localStorage.setItem('donbosco_vue', vue); localStorage.setItem('donbosco_session', JSON.stringify(sessionActive)); window.location.hash=vue;}catch(e){}
  }
  if(window.lucide) lucide.createIcons();
}
function validerConnexion(){
  const code=document.getElementById('input-code').value.trim();
  const err=document.getElementById('erreur-connexion'); err.classList.add('hidden');
  if(sessionActive.role==='admin'){
    const mdpAdmin = (donneesGlobales.admin && donneesGlobales.admin.mdp)? donneesGlobales.admin.mdp : "admin2026";
    if(code===mdpAdmin || code==="admin2026"){
      document.getElementById('vue-connexion').classList.add('hidden'); document.getElementById('vue-admin-dashboard').classList.remove('hidden'); changerOngletAdmin('eleves');
    } else {
      err.innerText="Code incorrect. Veuillez reessayer.";
      err.classList.remove('hidden');
    }
  } else if(sessionActive.role==='prof'){
    let p=null,k=null; for(let kk in donneesGlobales.professeurs){if(donneesGlobales.professeurs[kk].code===code){p=donneesGlobales.professeurs[kk];k=kk;break;}}
    if(p){sessionActive.id=k;sessionActive.nom=p.nom;sessionActive.cours=p.cours;document.getElementById('vue-connexion').classList.add('hidden');document.getElementById('vue-prof-dashboard').classList.remove('hidden');initialiserEspaceProf();} else {err.innerText="Code prof incorrect.";err.classList.remove('hidden');}
  } else if(sessionActive.role==='eleve'){
    let e=null,kk=null; for(let k in donneesGlobales.eleves){if(donneesGlobales.eleves[k].codeEleve===code){e=donneesGlobales.eleves[k];kk=k;break;}}
    if(e){
      if(e.statut==='vire'){err.innerText="Acces refuse: Eleve vire de l'ecole.";err.classList.remove('hidden');return;}
      if(e.statut==='bloque'){err.innerText="Acces bloque par l'administration.";err.classList.remove('hidden');return;}
      if(e.statutFrais && e.statutFrais!=='en_ordre'){err.innerText="Acces bloque: Frais non en ordre.";err.classList.remove('hidden');return;}
      sessionActive.id=kk;sessionActive.nom=(e.nom||'')+' '+(e.postnom||'')+' '+(e.prenom||'');sessionActive.classe=e.classe;
      document.getElementById('vue-connexion').classList.add('hidden');document.getElementById('vue-eleve-dashboard').classList.remove('hidden');
      document.getElementById('titre-espace-eleve-parent').innerText="Espace Eleve - "+sessionActive.nom;
      document.getElementById('selecteur-enfant-parent-container').classList.add('hidden');document.getElementById('parent-section-messagerie').classList.add('hidden');
      chargerTableauDeBordEleve(); chargerCalendrierEleve(); chargerBaremesEleve();
    } else {err.innerText="Code eleve incorrect.";err.classList.remove('hidden');}
  } else if(sessionActive.role==='parent'){
    let t=null,tk=null; for(let k in donneesGlobales.tuteurs){if(donneesGlobales.tuteurs[k].codeTuteur===code){t=donneesGlobales.tuteurs[k];tk=k;break;}}
    if(t){
      if(t.statut==='bloque'){err.innerText="Acces parent bloque.";err.classList.remove('hidden');return;}
      sessionActive.id=tk;sessionActive.nom=(t.nom||'')+' '+(t.prenom||'');
      document.getElementById('vue-connexion').classList.add('hidden');document.getElementById('vue-eleve-dashboard').classList.remove('hidden');
      document.getElementById('titre-espace-eleve-parent').innerText="Espace Parent - "+sessionActive.nom;
      document.getElementById('parent-section-messagerie').classList.remove('hidden');
      const sel=document.getElementById('select-enfant-parent');sel.innerHTML='';
      (t.enfants||[]).forEach(idEl=>{const el=donneesGlobales.eleves[idEl];if(el){const opt=document.createElement('option');opt.value=idEl;opt.innerText=(el.nom||'')+' '+(el.postnom||'')+' ('+el.classe+')';sel.appendChild(opt);}});
      document.getElementById('selecteur-enfant-parent-container').classList.remove('hidden');
      if((t.enfants||[]).length>0){sessionActive.enfantIdActif=t.enfants[0];sel.value=t.enfants[0];}
      chargerTableauDeBordParent(); chargerCalendrierEleve(); chargerBaremesEleve(); chargerMessagesParent();
    } else {err.innerText="Code parent incorrect.";err.classList.remove('hidden');}
  }
  if(window.lucide) lucide.createIcons();
}
function changerOngletAdmin(onglet){
  const secs=['eleves','frais-config','frais','tuteurs','professeurs','presences','messages','communiques','parametres'];
  secs.forEach(s=>{
    const el=document.getElementById('admin-sec-'+s); if(el) el.classList.add('hidden');
    const bid=s==='professeurs'?'profs':s==='presences'?'presences':s==='frais-config'?'frais-config':s==='messages'?'msgs':s;
    const btn=document.getElementById('tab-btn-'+bid); if(btn) btn.className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 border border-slate-700/50";
  });
  const act=document.getElementById('admin-sec-'+onglet); if(act) act.classList.remove('hidden');
  const bid2=onglet==='professeurs'?'profs':onglet==='presences'?'presences':onglet==='frais-config'?'frais-config':onglet==='messages'?'msgs':onglet;
  const ab=document.getElementById('tab-btn-'+bid2); if(ab) ab.className="px-3.5 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold whitespace-nowrap shadow-xs transition flex items-center gap-1.5";
  try{localStorage.setItem('donbosco_admin_onglet', onglet);}catch(e){}
  if(window.lucide) lucide.createIcons();
}
function chargerCommuniquesAccueil(){const c=document.getElementById('communiques-accueil-liste');if(!c) return;c.innerHTML='';const comms=donneesGlobales.communiques||{};if(Object.keys(comms).length===0){c.innerHTML='<p class="text-xs text-slate-500 italic">Aucun communique</p>';return;}for(let k in comms){const com=comms[k];c.innerHTML+=`<div class='bg-slate-900 border border-slate-700 p-3 rounded-xl'><h4 class='font-bold text-white text-xs'>${com.titre||''}</h4><p class='text-xs text-slate-400 mt-1'>${com.contenu||''}</p></div>`;}}
function chargerListeAdminEleves(){
  const tb=document.getElementById('admin-liste-eleves'); const datalist=document.getElementById('frais-liste-eleves-suggestions'); if(!tb) return; tb.innerHTML=''; if(datalist) datalist.innerHTML='';
  const eleves=donneesGlobales.eleves||{}; if(Object.keys(eleves).length===0){tb.innerHTML='<tr><td colspan="6" class="p-4 text-center text-slate-500 text-xs">Aucun eleve</td></tr>';return;}
  for(let k in eleves){
    const el=eleves[k];
    const statutColor = el.statut==='vire'?'bg-red-900/50 text-red-300':el.statut==='bloque'?'bg-amber-900/50 text-amber-300':'bg-emerald-900/30 text-emerald-300';
    tb.innerHTML+=`<tr class="border-b border-slate-700/50"><td class='p-3 font-semibold text-white'>${el.nom||''} ${el.postnom||''}</td><td class='p-3'>${el.classe||''}</td><td class='p-3'><span class="px-2 py-1 rounded-full text-[10px] ${el.statutFrais==='en_ordre'?'bg-emerald-900/50 text-emerald-300':'bg-red-900/50 text-red-300'}">${el.statutFrais||'non_paye'}</span></td><td class='p-3'><span class="px-2 py-1 rounded-full text-[10px] ${statutColor}">${el.statut||'actif'}</span></td><td class='p-3 font-mono text-[10px]'>${el.codeEleve||''}</td><td class='p-3 text-center'><button onclick="editerEleve('${k}')" class='text-blue-400 text-xs mr-1'>Editer</button><button onclick="bloquerEleve('${k}')" class='text-amber-400 text-xs mr-1'>Bloq</button><button onclick="supprimerEleve('${k}')" class='text-red-400 text-xs'>Suppr</button></td></tr>`;
    if(datalist){const opt=document.createElement('option');opt.value=(el.nom||'')+' '+(el.postnom||'');datalist.appendChild(opt);}
  }
}
function enregistrerOuModifierEleve(){
  const nom=document.getElementById('el-nom').value.trim(); const classe=document.getElementById('el-classe').value;
  if(!nom||!classe){alert('Nom et classe');return;}
  const editKey=document.getElementById('edit-eleve-key').value;
  const key=editKey||db.ref('eleves').push().key;
  const codeEleve=editKey&&donneesGlobales.eleves[editKey]?donneesGlobales.eleves[editKey].codeEleve:'ELEVE-'+Math.floor(100000+Math.random()*900000);
  const tuteurKey=editKey&&donneesGlobales.eleves[editKey]?.tuteurId?donneesGlobales.eleves[editKey].tuteurId:db.ref('tuteurs').push().key;
  const codeTuteur=editKey&&donneesGlobales.tuteurs[tuteurKey]?donneesGlobales.tuteurs[tuteurKey].codeTuteur:'TUT-'+Math.floor(100000+Math.random()*900000);
  const elData={nom,postnom:document.getElementById('el-postnom').value,prenom:document.getElementById('el-prenom').value,classe,adresse:document.getElementById('el-adresse').value,statutFrais:document.getElementById('el-frais').value,statut:document.getElementById('el-statut').value,codeEleve,tuteurId:tuteurKey};
  const tutData={nom:document.getElementById('tut-nom').value||nom,postnom:document.getElementById('tut-postnom').value,prenom:document.getElementById('tut-prenom').value,telephone:document.getElementById('tut-tel').value,codeTuteur,enfants:donneesGlobales.tuteurs[tuteurKey]?.enfants||[key],statut:'actif'};
  if(!tutData.enfants.includes(key)) tutData.enfants.push(key);
  db.ref('eleves/'+key).set(elData); db.ref('tuteurs/'+tuteurKey).set(tutData);
  alert('Eleve enregistre: '+codeEleve);
  annulerEditionEleve();
}
function annulerEditionEleve(){document.getElementById('edit-eleve-key').value='';document.getElementById('el-nom').value='';}
</script>
