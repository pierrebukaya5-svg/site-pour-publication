<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>École de la RDC</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">
<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-6">
<h1 class="text-3xl font-bold text-center text-blue-700">École de la RDC 🇨🇩</h1>
<p class="text-center text-green-600 mt-2" id="status">Connexion à Firebase...</p>

<div class="mt-6 bg-slate-50 p-4 rounded-xl">
<h2 class="font-bold mb-2">Ajouter un élève (Test temps réel PC -> Téléphone)</h2>
<div class="flex gap-2">
<input id="nom" placeholder="Nom de l'élève" class="flex-1 border p-2 rounded">
<button onclick="ajouter()" class="bg-blue-600 text-white px-4 py-2 rounded">Ajouter</button>
</div>
</div>

<div class="mt-6">
<h2 class="font-bold text-lg">Liste des élèves en direct :</h2>
<ul id="liste" class="mt-3 space-y-2"></ul>
</div>

<p class="text-xs text-center mt-8 text-gray-400">Base connectée : site-publication-default-rtdb</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// TA VRAIE CONFIG - Tirée de ta capture
const firebaseConfig = {
  apiKey: "AIzaSyDpzKhm93AJnwGsqptCBNfmWG8E4m0uJNM",
  authDomain: "site-publication.firebaseapp.com",
  databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
  projectId: "site-publication",
  storageBucket: "site-publication.firebasestorage.app",
  messagingSenderId: "934019778891",
  appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const elevesRef = ref(db, 'ecole6/eleves');

document.getElementById('status').innerText = "✅ Connecté à Firebase - Temps réel actif";
document.getElementById('status').className = "text-center text-green-600 font-bold mt-2";

window.ajouter = function() {
  const nom = document.getElementById('nom').value;
  if(!nom) return;
  push(elevesRef, { nom: nom, date: new Date().toLocaleString() });
  document.getElementById('nom').value = "";
}

onValue(elevesRef, (snapshot) => {
  const data = snapshot.val();
  const liste = document.getElementById('liste');
  liste.innerHTML = "";
  if(!data){ liste.innerHTML = "<li class='text-gray-400'>Aucun élève - Ajoute pour tester PC/Téléphone</li>"; return; }
  Object.keys(data).reverse().forEach(key => {
    const el = data[key];
    const li = document.createElement('li');
    li.className = "bg-white border p-3 rounded flex justify-between";
    li.innerHTML = `<span>${el.nom} <small class='text-gray-400'>${el.date}</small></span> <button onclick="supp('${key}')" class='text-red-500'>X</button>`;
    liste.appendChild(li);
  });
});

window.supp = function(key){
  remove(ref(db, 'ecole6/eleves/'+key));
}
</script>
</body>
</html>
