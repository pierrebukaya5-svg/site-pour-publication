<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Intégré</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        :root {
            --md-sys-color-primary: #1a73e8;
            --md-sys-color-primary-container: #d2e3fc;
            --md-sys-color-on-primary-container: #042759;
            --md-sys-color-surface: #ffffff;
            --md-sys-color-surface-variant: #f8f9fa;
            --md-sys-color-on-surface: #202124;
            --md-sys-color-on-surface-variant: #5f6368;
            --md-sys-color-outline: #dadce0;
            --md-sys-color-success: #188038;
            --md-sys-color-error: #d93025;
        }

        body {
            font-family: 'Google Sans', 'Roboto', sans-serif;
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
            margin: 0;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
            padding: 20px 28px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        header h1 { margin: 0; font-size: 20px; font-weight: 500; }
        header p { margin: 2px 0 0 0; color: var(--md-sys-color-on-surface-variant); font-size: 13px; }

        .card {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
            margin-bottom: 20px;
        }

        h2 { 
            margin-top: 0; 
            font-size: 16px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        h2 .material-icons-outlined { color: var(--md-sys-color-primary); font-size: 20px; }
        
        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin-top: 4px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid var(--md-sys-color-outline);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            box-sizing: border-box;
            font-family: 'Google Sans', sans-serif;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 24px;
            border-radius: 20px;
            background: var(--md-sys-color-primary);
            color: white;
            border: none;
            font-family: 'Google Sans', sans-serif;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        button:hover { background: #1557b0; }

        .user-pill {
            background: var(--md-sys-color-surface-variant);
            border: 1px solid var(--md-sys-color-outline);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        .grid-evaluations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .eval-box {
            background: var(--md-sys-color-surface-variant);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 10px;
            padding: 12px;
        }

        .eval-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 4px;
        }

        .eval-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--md-sys-color-primary);
        }

        .convocation-banner {
            background: #fce8e6;
            border: 1px solid #fad2cf;
            color: var(--md-sys-color-error);
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            font-weight: 500;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .communique-box {
            background: #e6f4ea;
            border: 1px solid #ceead6;
            color: var(--md-sys-color-success);
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            font-size: 13px;
        }

        .admin-action-box {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--md-sys-color-outline);
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <header>
            <div class="header-brand">
                <div class="header-logo">
                    <span class="material-icons-outlined">school</span>
                </div>
                <div>
                    <h1>Portail Académique RDC</h1>
                    <p>Espace Élève & Gestion Intégrée</p>
                </div>
            </div>
            <div id="auth-status" class="user-pill">Visiteur / Élève</div>
        </header>

        <!-- AUTHENTIFICATION ADMIN DISCRÈTE -->
        <div class="card" style="padding: 16px;">
            <div id="login-section" style="display: flex; gap: 10px; align-items: center;">
                <input type="email" id="admin-email" placeholder="Email admin" style="margin:0; flex:1;">
                <input type="password" id="admin-password" placeholder="Mot de passe" style="margin:0; flex:1;">
                <button onclick="connecterAdmin()" style="width: auto; margin:0;">Connexion Admin</button>
            </div>
            <div id="admin-info-connecte" style="display: none; display: flex; justify-content: space-between; align-items: center;">
                <span style="color: var(--md-sys-color-success); font-weight: 500; font-size: 13px;">Mode Administrateur Actif (Gestion intégrée dans les dossiers élèves)</span>
                <button onclick="deconnecterAdmin()" style="background: transparent; border: 1px solid var(--md-sys-color-outline); color: var(--md-sys-color-on-surface); width: auto; padding: 4px 12px; font-size: 12px;">Déconnexion</button>
            </div>
        </div>

        <!-- ESPACE CONSULTATION ET GESTION INTERNE DE L'ÉLÈVE -->
        <div class="card">
            <h2><span class="material-icons-outlined">person_search</span> Espace de Consultation & Dossier Élève</h2>
            <label for="recherche-matricule">Entrez le Matricule de l'élève</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="recherche-matricule" placeholder="Ex: BUKAP6AB7HJL" style="margin: 0; text-transform: uppercase;">
                <button onclick="rechercherEleve()" style="width: 140px; margin: 0;">Consulter</button>
            </div>
            
            <div id="resultat-eleve" style="margin-top: 20px;"></div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDpzKHm93AJnwGsqptCBNfmWG0E4m0uJNM",
            authDomain: "site-publication.firebaseapp.com",
            databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
            projectId: "site-publication",
            storageBucket: "site-publication.firebasestorage.app",
            messagingSenderId: "934019778891",
            appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let estAdmin = false;

        auth.onAuthStateChanged((user) => {
            const loginSection = document.getElementById('login-section');
            const infoConnecte = document.getElementById('admin-info-connecte');
            const status = document.getElementById('auth-status');

            if (user) {
                estAdmin = true;
                status.innerText = "Mode : Admin / Gestion";
                loginSection.style.display = 'none';
                infoConnecte.style.display = 'flex';
            } else {
                estAdmin = false;
                status.innerText = "Visiteur / Élève";
                loginSection.style.display = 'flex';
                infoConnecte.style.display = 'none';
            }
            
            // Relancer la recherche si un matricule était déjà affiché pour basculer les droits d'administration internes
            const matriculeActuel = document.getElementById('recherche-matricule').value.trim();
            if(matriculeActuel) rechercherEleve();
        });

        function connecterAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value.trim();
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Erreur : " + err.message));
        }

        function deconnecterAdmin() {
            auth.signOut();
        }

        function rechercherEleve() {
            const matriculeRecherche = document.getElementById('recherche-matricule').value.trim().toUpperCase();
            const resultatDiv = document.getElementById('resultat-eleve');

            if (!matriculeRecherche) {
                resultatDiv.innerHTML = '<span style="color: var(--md-sys-color-error); font-size: 13px;">Veuillez entrer un matricule.</span>';
                return;
            }

            resultatDiv.innerHTML = '<p style="font-size: 13px; color: var(--md-sys-color-on-surface-variant);">Recherche en cours...</p>';

            db.ref('eleves').once('value', (snapshot) => {
                let eleveData = null;
                snapshot.forEach((child) => {
                    const e = child.val();
                    if (e.matricule === matriculeRecherche) {
                        eleveData = e;
                    }
                });

                if (!eleveData) {
                    resultatDiv.innerHTML = '<span style="color: var(--md-sys-color-error); font-size: 13px;">Aucun élève trouvé avec ce matricule.</span>';
                    return;
                }

                // Charger les cotations et infos propres à cet élève
                db.ref('cotations').orderByChild('matricule').equalTo(matriculeRecherche).once('value', (cotSnapshot) => {
                    let evaluationsHTML = '';
                    let convocationMsg = '';
                    
                    if (cotSnapshot.exists()) {
                        cotSnapshot.forEach((cotChild) => {
                            const c = cotChild.val();
                            evaluationsHTML += `
                                <div class="eval-box">
                                    <div class="eval-title">${c.cours} (${c.type})</div>
                                    <div class="eval-value">${c.note}</div>
                                </div>
                            `;
                            if (c.convocation && c.convocation !== "Aucune") {
                                convocationMsg = `
                                    <div class="convocation-banner">
                                        <span class="material-icons-outlined">warning</span>
                                        <strong>Convocation :</strong> ${c.convocation}
                                    </div>
                                `;
                            }
                        });
                    } else {
                        evaluationsHTML = '<p style="color: var(--md-sys-color-on-surface-variant); font-size: 13px; grid-column: span 2;">Aucune cotation enregistrée pour le moment.</p>';
                    }

                    // Section de gestion interne si l'administrateur est connecté
                    let adminSectionHTML = '';
                    if (estAdmin) {
                        adminSectionHTML = `
                            <div class="admin-action-box">
                                <h3 style="margin: 0 0 12px 0; font-size: 14px; color: var(--md-sys-color-primary); display:flex; align-items:center; gap:6px;">
                                    <span class="material-icons-outlined">edit</span> Ajouter une note ou convocation pour cet élève
                                </h3>
                                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;">
                                    <div>
                                        <label>Cours / Matière</label>
                                        <input type="text" id="input-cours-${matriculeRecherche}" placeholder="Ex: Mathématiques" style="margin-bottom:10px;">
                                    </div>
                                    <div>
                                        <label>Type</label>
                                        <select id="input-type-${matriculeRecherche}" style="margin-bottom:10px;">
                                            <option value="Interrogation">Interrogation (/20)</option>
                                            <option value="Devoir">Devoir (/20)</option>
                                            <option value="Examen">Examen (/100)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label>Note</label>
                                        <input type="text" id="input-note-${matriculeRecherche}" placeholder="Ex: 16.5" style="margin-bottom:10px;">
                                    </div>
                                </div>
                                <div style="display: flex; gap: 10px; align-items: flex-end;">
                                    <div style="flex: 1;">
                                        <label>Convocation (Optionnel)</label>
                                        <select id="input-conv-${matriculeRecherche}" style="margin-bottom:0;">
                                            <option value="Aucune">Aucune</option>
                                            <option value="Présence requise à la Direction">Présence requise à la Direction</option>
                                        </select>
                                    </div>
                                    <button onclick="enregistrerCotationInterne('${matriculeRecherche}')" style="width: auto; height: 44px; margin:0;">Enregistrer</button>
                                </div>
                            </div>
                        `;
                    }

                    resultatDiv.innerHTML = `
                        <div style="background: var(--md-sys-color-surface-variant); padding: 18px; border-radius: 12px; border: 1px solid var(--md-sys-color-outline); font-size: 13px;">
                            <p style="margin: 0 0 4px 0; color: var(--md-sys-color-success); font-weight: 500;">✓ Dossier élève actif</p>
                            <h3 style="margin: 6px 0; font-size: 16px;">${eleveData.nom} ${eleveData.postnom} ${eleveData.prenom}</h3>
                            <p style="margin: 4px 0; color: var(--md-sys-color-on-surface-variant);">Classe : ${eleveData.classe} | Matricule : <strong>${eleveData.matricule}</strong></p>
                            
                            ${convocationMsg}

                            <h4 style="margin: 16px 0 8px 0; font-size: 14px; font-weight: 500;">Cotations & Évaluations :</h4>
                            <div class="grid-evaluations">
                                ${evaluationsHTML}
                            </div>

                            <div class="communique-box">
                                <strong>Communiqué de l'école :</strong> Pensez à vérifier vos notes régulièrement avant la fin de la session.
                            </div>

                            ${adminSectionHTML}
                        </div>
                    `;
                });
            });
        }

        function enregistrerCotationInterne(matricule) {
            const cours = document.getElementById(`input-cours-${matricule}`).value.trim();
            const type = document.getElementById(`input-type-${matricule}`).value;
            const note = document.getElementById(`input-note-${matricule}`).value.trim();
            const convocation = document.getElementById(`input-conv-${matricule}`).value;

            if (!cours || !note) {
                alert("Veuillez remplir le nom du cours et la note.");
                return;
            }

            db.ref('cotations').push({
                matricule,
                cours,
                type,
                note,
                convocation
            }).then(() => {
                alert("Cotation enregistrée avec succès !");
                rechercherEleve(); // Actualiser l'affichage du dossier
            }).catch(err => {
                alert("Erreur : " + err.message);
            });
        }
    </script>
</body>
</html>
