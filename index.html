<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Administration Totale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.92)), 
                        url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
        }
        /* Protection anti-débordement mobile */
        *, *::before, *::after {
            box-sizing: border-box;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between antialiased p-3 sm:p-6">

    <!-- En-tête -->
    <header class="w-full py-4 px-2">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Portail Scolaire RDC</h1>
                    <p class="text-xs text-indigo-300 font-medium">Contrôle Gérant & Accès Direct</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteneur Principal -->
    <main id="main-container" class="max-w-3xl w-full mx-auto px-2 py-4 flex-grow flex flex-col justify-center">

        <!-- Écran d'accueil : Choix du rôle -->
        <div id="welcome-section" class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/20 text-center w-full max-w-full">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Bienvenue sur le Portail Scolaire</h2>
            <p class="text-sm text-slate-500 mb-6">Veuillez sélectionner votre profil pour accéder à votre espace :</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button type="button" class="role-card p-5 rounded-2xl border-2 border-slate-100 hover:border-indigo-600 bg-slate-50 hover:bg-indigo-50/30 transition text-left group w-full" data-role="Élève">
                    <div class="font-bold text-slate-800 group-hover:text-indigo-600 text-base mb-1">👨‍🎓 Élève</div>
                    <div class="text-xs text-slate-500">Consultez vos notes et résultats scolaires avec votre matricule.</div>
                </button>

                <button type="button" class="role-card p-5 rounded-2xl border-2 border-slate-100 hover:border-indigo-600 bg-slate-50 hover:bg-indigo-50/30 transition text-left group w-full" data-role="Parent">
                    <div class="font-bold text-slate-800 group-hover:text-indigo-600 text-base mb-1">👪 Parent</div>
                    <div class="text-xs text-slate-500">Suivez le parcours de votre enfant grâce à son matricule.</div>
                </button>

                <button type="button" class="role-card p-5 rounded-2xl border-2 border-slate-100 hover:border-emerald-600 bg-slate-50 hover:bg-emerald-50/30 transition text-left group w-full" data-role="Enseignant">
                    <div class="font-bold text-slate-800 group-hover:text-emerald-600 text-base mb-1">👨‍🏫 Enseignant</div>
                    <div class="text-xs text-slate-500">Gérez les notes de votre cours par classe.</div>
                </button>

                <button type="button" class="role-card p-5 rounded-2xl border-2 border-slate-100 hover:border-purple-600 bg-slate-50 hover:bg-purple-50/30 transition text-left group w-full" data-role="Gérant">
                    <div class="font-bold text-slate-800 group-hover:text-purple-600 text-base mb-1">🔐 Gérant (Administration)</div>
                    <div class="text-xs text-slate-500">Gérez les élèves, enseignants et comptes du système.</div>
                </button>
            </div>
        </div>

    </main>

    <!-- Pied de page -->
    <footer class="text-center py-6 text-xs text-slate-300 border-t border-slate-800/50">
        Portail Scolaire RDC &copy; 2026 — Tous droits réservés
    </footer>

    <!-- Logique Firebase & Application -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getDatabase, ref, set, get, push, update, remove } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpzKHm93AJnwGsqptCBNfmWG0E4m0uJNM",
            authDomain: "site-publication.firebaseapp.com",
            databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
            projectId: "site-publication",
            storageBucket: "site-publication.firebasestorage.app",
            messagingSenderId: "934019778891",
            appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const container = document.getElementById('main-container');

        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('click', () => {
                const role = card.getAttribute('data-role');
                if (role === "Élève" || role === "Parent") {
                    afficherInterfaceConsultationDirecte(role);
                } else if (role === "Enseignant") {
                    afficherInterfaceEnseignantLogin();
                } else if (role === "Gérant") {
                    afficherInterfaceGerantLogin();
                }
            });
        });

        // 1. Consultation Élève / Parent
        function afficherInterfaceConsultationDirecte(role) {
            container.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/20 w-full max-w-full">
                    <div class="flex justify-between items-center mb-6 border-b pb-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Espace ${role}</h2>
                            <p class="text-xs text-slate-500">Entrez le matricule de l'élève pour voir les notes.</p>
                        </div>
                        <button onclick="location.reload()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 py-1.5 rounded-xl transition text-xs">Retour</button>
                    </div>

                    <div class="space-y-4">
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input type="text" id="consult-matricule" placeholder="Entrez le matricule (ex: KAN-MAT-5TH-1234)" class="flex-grow px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50 font-mono w-full">
                            <button id="btn-chercher-notes" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition text-sm shadow w-full sm:w-auto">Rechercher</button>
                        </div>
                        <div id="resultats-affichage" class="p-5 bg-slate-50 rounded-2xl border border-slate-200 text-xs text-slate-700 min-h-[120px] flex items-center justify-center text-slate-400 italic">
                            En attente de la saisie d'un matricule...
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('btn-chercher-notes').addEventListener('click', async () => {
                const matricule = document.getElementById('consult-matricule').value.trim();
                const resultatDiv = document.getElementById('resultats-affichage');

                if (!matricule) {
                    resultatDiv.innerHTML = `<span class="text-rose-500 not-italic">Veuillez entrer un matricule valide.</span>`;
                    return;
                }

                try {
                    const snap = await get(ref(db, 'resultats/' + matricule));
                    if (snap.exists()) {
                        const data = snap.val();
                        let htmlCours = "";
                        if (data.cours) {
                            for (let [coursNom, info] of Object.entries(data.cours)) {
                                htmlCours += `<div class="p-3 mb-2 bg-white rounded-xl border shadow-sm"><strong>📚 ${coursNom}</strong> : <span class="text-indigo-600 font-bold">${info.note}</span> <span class="text-[10px] text-slate-400 block mt-1">Mise à jour : ${info.dateMiseAJour}</span></div>`;
                            }
                        }
                        resultatDiv.className = "p-5 bg-white rounded-2xl border border-slate-200 text-xs text-slate-700";
                        resultatDiv.innerHTML = `<p class="font-bold text-indigo-600 text-sm mb-3">Matricule : ${matricule}</p><div class="space-y-1">${htmlCours}</div>`;
                    } else {
                        resultatDiv.className = "p-5 bg-slate-50 rounded-2xl border border-slate-200 text-xs text-slate-700 flex items-center justify-center text-amber-600 italic";
                        resultatDiv.innerHTML = `Aucun résultat trouvé pour le matricule : ${matricule}`;
                    }
                } catch (err) {
                    resultatDiv.innerHTML = `<span class="text-rose-500 not-italic">Erreur lors de la recherche.</span>`;
                }
            });
        }

        // 2. Connexion Enseignant
        function afficherInterfaceEnseignantLogin() {
            container.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/20 w-full max-w-full">
                    <div class="flex justify-between items-center mb-6 border-b pb-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Espace Enseignant - Connexion</h2>
                            <p class="text-xs text-slate-500">Connectez-vous pour accéder à vos classes et saisir les notes.</p>
                        </div>
                        <button onclick="location.reload()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 py-1.5 rounded-xl transition text-xs">Retour</button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Votre Cours Affilié (ex: Mathématiques)</label>
                            <input type="text" id="ens-cours" placeholder="Nom de votre cours" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email</label>
                            <input type="email" id="ens-email" placeholder="prof@ecole.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mot de passe</label>
                            <input type="password" id="ens-pass" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                        </div>
                        <div id="ens-error" class="text-xs text-rose-600 font-bold bg-rose-50 p-3 rounded-xl border border-rose-200 hidden"></div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            <button id="btn-ens-signup" class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold py-3 rounded-xl transition text-xs">Créer mon compte</button>
                            <button id="btn-ens-login" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow text-xs">Se connecter</button>
                        </div>
                    </div>
                </div>
            `;

            const errBox = document.getElementById('ens-error');

            document.getElementById('btn-ens-signup').addEventListener('click', async () => {
                const cours = document.getElementById('ens-cours').value.trim();
                const email = document.getElementById('ens-email').value.trim();
                const pass = document.getElementById('ens-pass').value;

                if (!cours || !email || !pass) {
                    errBox.innerText = "Veuillez remplir tous les champs.";
                    errBox.classList.remove('hidden');
                    return;
                }

                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    await set(ref(db, 'comptes/' + cred.user.uid), { role: 'Enseignant', cours, email });
                    alert("Compte enseignant créé avec succès !");
                    chargerTableauDeBordEnseignant(cred.user, cours);
                } catch (err) {
                    errBox.innerText = "Erreur : " + err.message;
                    errBox.classList.remove('hidden');
                }
            });

            document.getElementById('btn-ens-login').addEventListener('click', async () => {
                const email = document.getElementById('ens-email').value.trim();
                const pass = document.getElementById('ens-pass').value;

                if (!email || !pass) {
                    errBox.innerText = "Veuillez remplir l'email et le mot de passe.";
                    errBox.classList.remove('hidden');
                    return;
                }

                try {
                    const cred = await signInWithEmailAndPassword(auth, email, pass);
                    const snap = await get(ref(db, 'comptes/' + cred.user.uid));
                    if (snap.exists() && snap.val().cours) {
                        chargerTableauDeBordEnseignant(cred.user, snap.val().cours);
                    } else {
                        const coursRemplacement = document.getElementById('ens-cours').value.trim() || "Mon Cours";
                        await update(ref(db, 'comptes/' + cred.user.uid), { role: 'Enseignant', cours: coursRemplacement });
                        chargerTableauDeBordEnseignant(cred.user, coursRemplacement);
                    }
                } catch (err) {
                    errBox.innerText = "Erreur de connexion : " + err.message;
                    errBox.classList.remove('hidden');
                }
            });
        }

        async function chargerTableauDeBordEnseignant(user, coursProf) {
            container.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/20 w-full max-w-full">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Espace Enseignant</h2>
                            <p class="text-xs text-slate-500">Cours affilié : <span class="font-bold text-emerald-600">${coursProf}</span></p>
                        </div>
                        <button onclick="location.reload()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-3 py-2 rounded-xl transition text-xs">Déconnexion</button>
                    </div>

                    <div class="space-y-4">
                        <p class="text-xs font-semibold uppercase tracking-wider text-slate-600">Sélectionnez une classe :</p>
                        <div id="onglets-classes" class="flex flex-wrap gap-2 pb-2 border-b border-slate-100">
                            <span class="text-xs text-slate-400 italic">Chargement des classes...</span>
                        </div>

                        <div id="zone-eleves-classe" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 max-h-50 overflow-y-auto space-y-2">
                            <p class="text-xs text-slate-400 italic">Veuillez sélectionner une classe ci-dessus.</p>
                        </div>

                        <div id="form-saisie-note" class="bg-emerald-50/50 p-4 rounded-2xl border border-emerald-200 hidden space-y-3">
                            <div class="text-xs font-bold text-emerald-900 break-words" id="selection-eleve-info">Élève sélectionné : Aucun</div>
                            <input type="hidden" id="selected-matricule">
                            <input type="text" id="note-valeur" placeholder="Saisir la note (ex: 16/20 - Interro 1)" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                            <button id="btn-publier-note" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition shadow text-xs">Enregistrer la note</button>
                        </div>
                    </div>
                </div>
            `;

            const snapEleves = await get(ref(db, 'eleves'));
            const ongletsContainer = document.getElementById('onglets-classes');
            const zoneEleves = document.getElementById('zone-eleves-classe');
            const formSaisie = document.getElementById('form-saisie-note');
            const infoSelection = document.getElementById('selection-eleve-info');
            const inputMatriculeCache = document.getElementById('selected-matricule');

            let elevesParClasse = {};
            if (snapEleves.exists()) {
                snapEleves.forEach(child => {
                    const e = child.val();
                    const cls = e.classe || "Non classé";
                    if (!elevesParClasse[cls]) elevesParClasse[cls] = [];
                    elevesParClasse[cls].push({ id: child.key, ...e });
                });

                const classes = Object.keys(elevesParClasse);
                if (classes.length > 0) {
                    let htmlOnglets = "";
                    classes.forEach(cls => {
                        htmlOnglets += `<button type="button" class="tab-classe px-3 py-1.5 rounded-xl font-semibold text-xs transition bg-white text-emerald-700 border border-emerald-200 hover:bg-emerald-600 hover:text-white shadow-sm" data-classe="${cls}">${cls}</button>`;
                    });
                    ongletsContainer.innerHTML = htmlOnglets;

                    document.querySelectorAll('.tab-classe').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.tab-classe').forEach(b => b.classList.remove('bg-emerald-600', 'text-white'));
                            btn.classList.add('bg-emerald-600', 'text-white');

                            const classeChoisie = btn.getAttribute('data-classe');
                            const liste = elevesParClasse[classeChoisie];

                            let htmlEleves = `<p class="text-xs font-bold text-slate-700 mb-2">Liste des élèves (${classeChoisie}) :</p><div class="space-y-1.5">`;
                            liste.forEach(el => {
                                htmlEleves += `
                                    <div class="p-2.5 bg-white hover:bg-emerald-50 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 cursor-pointer transition select-eleve" data-matricule="${el.matricule}" data-nom="${el.nom} ${el.postnom}">
                                        <div><strong>${el.nom} ${el.postnom}</strong></div>
                                        <div class="text-[11px] text-indigo-600 font-mono font-bold bg-slate-50 px-2 py-0.5 rounded border break-all">${el.matricule}</div>
                                    </div>
                                `;
                            });
                            htmlEleves += `</div>`;
                            zoneEleves.innerHTML = htmlEleves;
                            formSaisie.classList.add('hidden');

                            document.querySelectorAll('.select-eleve').forEach(item => {
                                item.addEventListener('click', () => {
                                    document.querySelectorAll('.select-eleve').forEach(i => i.classList.remove('border-emerald-600', 'bg-emerald-50'));
                                    item.classList.add('border-emerald-600', 'bg-emerald-50');

                                    inputMatriculeCache.value = item.getAttribute('data-matricule');
                                    infoSelection.innerText = `Élève sélectionné : ${item.getAttribute('data-nom')} (Matricule : ${item.getAttribute('data-matricule')})`;
                                    formSaisie.classList.remove('hidden');
                                });
                            });
                        });
                    });
                } else {
                    ongletsContainer.innerHTML = `<span class="text-slate-400 italic">Aucune classe enregistrée.</span>`;
                }
            } else {
                ongletsContainer.innerHTML = `<span class="text-slate-400 italic">Aucun élève dans la base de données.</span>`;
            }

            document.getElementById('btn-publier-note').addEventListener('click', async () => {
                const matricule = inputMatriculeCache.value;
                const valeurNote = document.getElementById('note-valeur').value.trim();

                if (!matricule || !valeurNote) {
                    alert("Veuillez sélectionner un élève et saisir une note.");
                    return;
                }

                try {
                    await set(ref(db, `resultats/${matricule}/cours/${coursProf}`), {
                        note: valeurNote,
                        dateMiseAJour: new Date().toLocaleString()
                    });
                    alert("Note enregistrée avec succès !");
                    document.getElementById('note-valeur').value = "";
                } catch (err) {
                    alert("Erreur : " + err.message);
                }
            });
        }

        // 3. Connexion Gérant
        function afficherInterfaceGerantLogin() {
            container.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/20 w-full max-w-full">
                    <div class="flex justify-between items-center mb-6 border-b pb-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Espace Gérant - Connexion</h2>
                            <p class="text-xs text-slate-500">Réservé à l'administration de l'école.</p>
                        </div>
                        <button onclick="location.reload()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-3 py-1.5 rounded-xl transition text-xs">Retour</button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email Administrateur</label>
                            <input type="email" id="gerant-email" placeholder="gerant@ecole.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Mot de passe</label>
                            <input type="password" id="gerant-pass" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-slate-50">
                        </div>
                        <div id="gerant-error" class="text-xs text-rose-600 font-bold bg-rose-50 p-3 rounded-xl border border-rose-200 hidden"></div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            <button id="btn-gerant-signup" class="w-full bg-purple-50 hover:bg-purple-100 text-purple-700 font-semibold py-3 rounded-xl transition text-xs">Créer compte gérant</button>
                            <button id="btn-gerant-login" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition shadow text-xs">Se connecter</button>
                        </div>
                    </div>
                </div>
            `;

            const errBox = document.getElementById('gerant-error');

            document.getElementById('btn-gerant-signup').addEventListener('click', async () => {
                const email = document.getElementById('gerant-email').value.trim();
                const pass = document.getElementById('gerant-pass').value;

                if (!email || !pass) {
                    errBox.innerText = "Veuillez remplir tous les champs.";
                    errBox.classList.remove('hidden');
                    return;
                }

                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    await set(ref(db, 'comptes/' + cred.user.uid), { role: 'Gérant', email });
                    alert("Compte gérant créé avec succès !");
                    chargerTableauDeBordGerant(cred.user);
                } catch (err) {
                    errBox.innerText = "Erreur : " + err.message;
                    errBox.classList.remove('hidden');
                }
            });

            document.getElementById('btn-gerant-login').addEventListener('click', async () => {
                const email = document.getElementById('gerant-email').value.trim();
                const pass = document.getElementById('gerant-pass').value;

                if (!email || !pass) {
                    errBox.innerText = "Veuillez remplir tous les champs.";
                    errBox.classList.remove('hidden');
                    return;
                }

                try {
                    const cred = await signInWithEmailAndPassword(auth, email, pass);
                    chargerTableauDeBordGerant(cred.user);
                } catch (err) {
                    errBox.innerText = "Erreur de connexion : " + err.message;
                    errBox.classList.remove('hidden');
                }
            });
        }

        // Tableau de bord Gérant avec option de suppression d'élèves et d'enseignants
        async function chargerTableauDeBordGerant(user) {
            container.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-6 sm:p-8 border border-white/20 w-full max-w-full">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Espace Gérant - Administration Totale</h2>
                            <p class="text-xs text-slate-500">Contrôlez les élèves et les enseignants de l'école.</p>
                        </div>
                        <button onclick="location.reload()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-3 py-2 rounded-xl transition text-xs">Déconnexion</button>
                    </div>

                    <div class="space-y-6">
                        <!-- Enregistrement Élève -->
                        <div class="bg-purple-50/50 p-4 sm:p-5 rounded-2xl border border-purple-100">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-purple-900 mb-3">Enregistrer un nouvel élève</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                                <input type="text" id="eleve-nom" placeholder="Nom" class="px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white w-full">
                                <input type="text" id="eleve-postnom" placeholder="Post-nom" class="px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white w-full">
                                <input type="text" id="eleve-classe" placeholder="Classe & Option (ex: 5ème Math)" class="px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white w-full">
                            </div>
                            <button id="btn-creer-eleve" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition shadow text-sm">Générer le Matricule & Enregistrer</button>
                        </div>

                        <!-- Liste des Élèves avec Suppression -->
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700 mb-3">Gestion des Élèves</h3>
                            <div id="liste-eleves" class="bg-slate-50 rounded-2xl p-4 border border-slate-200 max-h-48 overflow-y-auto space-y-2 text-xs">
                                Chargement...
                            </div>
                        </div>

                        <!-- Liste des Enseignants avec Suppression -->
                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700 mb-3">Gestion des Enseignants</h3>
                            <div id="liste-enseignants" class="bg-slate-50 rounded-2xl p-4 border border-slate-200 max-h-48 overflow-y-auto space-y-2 text-xs">
                                Chargement...
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const chargerDonneesAdmin = async () => {
                // Charger les élèves
                const snapEleves = await get(ref(db, 'eleves'));
                const listeElevesDiv = document.getElementById('liste-eleves');
                if (snapEleves.exists()) {
                    let htmlEleves = "";
                    snapEleves.forEach(child => {
                        const key = child.key;
                        const e = child.val();
                        htmlEleves += `
                            <div class="p-2.5 bg-white rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <div class="break-words"><strong>${e.nom} ${e.postnom}</strong> - <span class="text-purple-600">${e.classe}</span> <br><span class="font-mono text-indigo-600 break-all">${e.matricule}</span></div>
                                <button class="btn-supprimer-eleve bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white px-3 py-1.5 rounded-lg transition font-semibold w-full sm:w-auto text-center" data-key="${key}" data-matricule="${e.matricule}">Supprimer</button>
                            </div>`;
                    });
                    listeElevesDiv.innerHTML = htmlEleves;
                } else {
                    listeElevesDiv.innerHTML = `<p class="text-slate-400 italic">Aucun élève enregistré.</p>`;
                }

                // Charger les enseignants (comptes)
                const snapComptes = await get(ref(db, 'comptes'));
                const listeEnsDiv = document.getElementById('liste-enseignants');
                if (snapComptes.exists()) {
                    let htmlEns = "";
                    snapComptes.forEach(child => {
                        const key = child.key;
                        const compte = child.val();
                        if (compte.role === 'Enseignant') {
                            htmlEns += `
                                <div class="p-2.5 bg-white rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <div class="break-words"><strong>${compte.email}</strong> - <span class="text-emerald-600 font-bold">Cours : ${compte.cours || 'Non défini'}</span></div>
                                    <button class="btn-supprimer-ens bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white px-3 py-1.5 rounded-lg transition font-semibold w-full sm:w-auto text-center" data-key="${key}">Supprimer</button>
                                </div>`;
                        }
                    });
                    listeEnsDiv.innerHTML = htmlEns || `<p class="text-slate-400 italic">Aucun enseignant enregistré.</p>`;
                } else {
                    listeEnsDiv.innerHTML = `<p class="text-slate-400 italic">Aucun compte enseignant trouvé.</p>`;
                }

                // Écouteurs de suppression d'élèves
                document.querySelectorAll('.btn-supprimer-eleve').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const key = btn.getAttribute('data-key');
                        const matricule = btn.getAttribute('data-matricule');
                        if (confirm(`Voulez-vous vraiment supprimer cet élève et ses résultats ?`)) {
                            try {
                                await remove(ref(db, 'eleves/' + key));
                                await remove(ref(db, 'resultats/' + matricule));
                                alert("Élève supprimé avec succès !");
                                chargerDonneesAdmin();
                            } catch (err) {
                                alert("Erreur lors de la suppression : " + err.message);
                            }
                        }
                    });
                });

                // Écouteurs de suppression d'enseignants
                document.querySelectorAll('.btn-supprimer-ens').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const key = btn.getAttribute('data-key');
                        if (confirm(`Voulez-vous vraiment supprimer cet enseignant du système ?`)) {
                            try {
                                await remove(ref(db, 'comptes/' + key));
                                alert("Enseignant supprimé avec succès !");
                                chargerDonneesAdmin();
                            } catch (err) {
                                alert("Erreur lors de la suppression : " + err.message);
                            }
                        }
                    });
                });
            };

            chargerDonneesAdmin();

            document.getElementById('btn-creer-eleve').addEventListener('click', async () => {
                const nom = document.getElementById('eleve-nom').value.trim();
                const postnom = document.getElementById('eleve-postnom').value.trim();
                const classe = document.getElementById('eleve-classe').value.trim();

                if (!nom || !postnom || !classe) {
                    alert("Veuillez remplir tous les champs.");
                    return;
                }

                const randomCode = Math.floor(1000 + Math.random() * 9000);
                const matriculeNettoye = `${nom.substring(0,3).toUpperCase()}-${postnom.substring(0,3).toUpperCase()}-${classe.substring(0,3).toUpperCase()}-${randomCode}`;

                try {
                    await set(push(ref(db, 'eleves')), { nom, postnom, classe, matricule: matriculeNettoye });
                    alert("Élève enregistré avec succès ! Matricule : " + matriculeNettoye);
                    document.getElementById('eleve-nom').value = "";
                    document.getElementById('eleve-postnom').value = "";
                    document.getElementById('eleve-classe').value = "";
                    chargerDonneesAdmin();
                } catch (err) {
                    alert("Erreur : " + err.message);
                }
            });
        }
    </script>
</body>
</html>
