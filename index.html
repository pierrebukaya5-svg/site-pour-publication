<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Gestion Académique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
            }
            .no-print {
                display: none !important;
            }
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- En-tête Global -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">Portail Scolaire RDC</h1>
                    <p class="text-xs text-slate-400">Système Intégré de Gestion des Notes</p>
                </div>
            </div>
            <div id="user-session-info" class="flex items-center space-x-4">
                <!-- Dynamique selon la connexion -->
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main id="app-container" class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">
        <!-- Vues injectées dynamiquement -->
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Portail Scolaire RDC - République Démocratique du Congo. Tous droits réservés.
    </footer>

    <!-- Script Application -->
    <script>
        // --- BASE DE DONNÉES LOCALE & ÉTAT ---
        let state = {
            view: 'login', // login, admin_dash, prof_dash, parent_dash
            user: null,
            history: [],
            // Données simulées
            coursProf: [
                { id: 1, nom: "Mathématiques", classe: "6e Secondaire A" },
                { id: 2, nom: "Physique", classe: "6e Secondaire A" }
            ],
            eleves: [
                { id: 101, matricule: "2026-A-001", nom: "Kabamba Paul", cotes: { 1: 14, 2: 12 } },
                { id: 102, matricule: "2026-A-002", nom: "Tshisekedi Marie", cotes: { 1: 17, 2: 16 } },
                { id: 103, matricule: "2026-A-003", nom: "Mukendi Junior", cotes: { 1: 10, 2: 11 } }
            ],
            messages: [
                { id: 1, emetteur: "Prof. Martin", role: "prof", texte: "Demande de validation des notes de Physique.", reponse: "" }
            ]
        };

        // --- GESTION DE L'HISTORIQUE & NAVIGATION ANTI-BLANC ---
        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.view) {
                state.view = event.state.view;
                render(false); // Rendu sans réempiler l'historique
            } else {
                // Empêche la sortie de l'application, recharge/actualise proprement l'état actuel
                render(false);
            }
        });

        function navigateTo(newView, push = true) {
            state.view = newView;
            if (push) {
                history.pushState({ view: newView }, "", `#${newView}`);
            }
            render(false);
        }

        // --- GESTION DU CLAVIER DE LA MACHINE ---
        window.addEventListener('keydown', (e) => {
            // Raccourcis clavier personnalisés (Ex: Touche Echap pour retour arrière actualisé, Entrée pour valider)
            if (e.key === "Escape") {
                if (state.view !== 'login') {
                    navigateTo('login');
                }
            }
        });

        // --- MOTEUR DE RENDU ---
        function render(push = true) {
            const container = document.getElementById('app-container');
            const sessionInfo = document.getElementById('user-session-info');
            
            // Gestion de l'affichage header
            if (!state.user) {
                sessionInfo.innerHTML = `<span class="text-xs text-slate-400">Veuillez vous identifier</span>`;
            } else {
                sessionInfo.innerHTML = `
                    <span class="text-xs text-blue-400 font-semibold"><i class="fa-solid fa-user mr-1"></i>${state.user.nom} (${state.user.role})</span>
                    <button onclick="logout()" class="bg-red-600/80 hover:bg-red-600 text-white text-xs px-3 py-1.5 rounded transition"><i class="fa-solid fa-power-off"></i></button>
                `;
            }

            // Aiguillage des vues
            switch (state.view) {
                case 'login':
                    container.innerHTML = renderLogin();
                    break;
                case 'admin_dash':
                    container.innerHTML = renderAdminDashboard();
                    break;
                case 'prof_dash':
                    container.innerHTML = renderProfDashboard();
                    break;
                default:
                    container.innerHTML = renderLogin();
            }
        }

        // --- VUE CONNEXION ---
        function renderLogin() {
            return `
                <div class="max-w-md mx-auto mt-16 bg-slate-900 border border-slate-800 p-8 rounded-xl shadow-2xl">
                    <h2 class="text-xl font-bold text-white mb-6 text-center"><i class="fa-solid fa-lock text-blue-500 mr-2"></i>Connexion au Portail</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Sélectionner un profil d'accès</label>
                            <select id="login-role" class="w-full bg-slate-800 border border-slate-750 rounded p-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                                <option value="prof">Enseignant (Professeur)</option>
                                <option value="admin">Administration</option>
                            </select>
                        </div>
                        <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded transition shadow-lg">
                            Se connecter
                        </button>
                    </div>
                </div>
            `;
        }

        function handleLogin() {
            const role = document.getElementById('login-role').value;
            if (role === 'prof') {
                state.user = { nom: "Prof. Jean K.", role: "Enseignant" };
                navigateTo('prof_dash');
            } else {
                state.user = { nom: "Directeur Pierre", role: "Administration" };
                navigateTo('admin_dash');
            }
        }

        function logout() {
            state.user = null;
            navigateTo('login');
        }

        // --- VUE PROFESSEUR (Fiche de cotation, Multi-cours, Vérification) ---
        let selectedCoursId = 1; // Cours actif par défaut

        function renderProfDashboard() {
            const coursActif = state.coursProf.find(c => c.id === selectedCoursId);
            
            let optionsCoursHtml = state.coursProf.map(c => `
                <option value="${c.id}" ${c.id === selectedCoursId ? 'selected' : ''}>${c.nom} (${c.classe})</option>
            `).join('');

            let lignesElevesHtml = state.eleves.map(el => `
                <tr class="border-b border-slate-800 hover:bg-slate-850">
                    <td class="p-3 text-sm font-mono text-slate-300">${el.matricule}</td>
                    <td class="p-3 text-sm text-white">${el.nom}</td>
                    <td class="p-3 text-sm text-center font-bold text-blue-400">${el.cotes[selectedCoursId] || 0} / 20</td>
                </tr>
            `).join('');

            return `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-850 p-4 rounded-xl border border-slate-800 gap-4 no-print">
                        <div>
                            <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-chalkboard-user text-blue-400 mr-2"></i>Espace Enseignant</h2>
                            <p class="text-xs text-slate-400">Vérification des enregistrements et génération de la fiche de cotation.</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <label class="text-xs text-slate-300">Balancer vers le cours :</label>
                            <select onchange="changerCours(this.value)" class="bg-slate-800 border border-slate-700 rounded p-2 text-xs text-white focus:outline-none">
                                ${optionsCoursHtml}
                            </select>
                            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-4 py-2 rounded transition flex items-center shadow">
                                <i class="fa-solid fa-print mr-2"></i> Imprimer la fiche
                            </button>
                        </div>
                    </div>

                    <!-- Zone Imprimable de la Fiche de Cotation -->
                    <div id="printable-area" class="bg-white text-slate-900 p-8 rounded-xl shadow-xl space-y-6">
                        <div class="flex justify-between items-border border-b pb-4 border-slate-300">
                            <div>
                                <h3 class="font-extrabold text-xl text-slate-900 uppercase">République Démocratique du Congo</h3>
                                <p class="text-xs text-slate-600">Ministère de l'Enseignement Primaires, Secondaire et Technique</p>
                            </div>
                            <div class="text-right">
                                <p class="font-bold text-blue-700 text-sm">FICHE DE COTATION OFFICIELLE</p>
                                <p class="text-xs text-slate-500">Année Scolaire : 2025-2026</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 text-sm bg-slate-50 p-4 rounded border border-slate-200">
                            <div><strong class="text-slate-700">Cours :</strong> ${coursActif.nom}</div>
                            <div><strong class="text-slate-700">Classe :</strong> ${coursActif.classe}</div>
                            <div><strong class="text-slate-700">Enseignant :</strong> ${state.user.nom}</div>
                            <div><strong class="text-slate-700">Date d'édition :</strong> 12/09/2026</div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse border border-slate-300">
                                <thead>
                                    <tr class="bg-slate-200 text-slate-800 text-xs uppercase">
                                        <th class="border border-slate-300 p-2.5">Matricule</th>
                                        <th class="border border-slate-300 p-2.5">Nom et Prénom de l'élève</th>
                                        <th class="border border-slate-300 p-2.5 text-center">Cote / 20</th>
                                        <th class="border border-slate-300 p-2.5">Observations</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.eleves.map(el => `
                                        <tr>
                                            <td class="border border-slate-300 p-2 text-xs font-mono">${el.matricule}</td>
                                            <td class="border border-slate-300 p-2 text-xs">${el.nom}</td>
                                            <td class="border border-slate-300 p-2 text-xs text-center font-bold">${el.cotes[selectedCoursId] || 0}</td>
                                            <td class="border border-slate-300 p-2 text-xs text-slate-400">Validé</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <div class="flex justify-between pt-8 text-xs text-slate-700">
                            <div>Signature de l'Enseignant :</div>
                            <div>Signature du Directeur / Préfet :</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function changerCours(val) {
            selectedCoursId = parseInt(val);
            render(false);
        }

        // --- VUE ADMINISTRATION (Gestion des réponses aux messages) ---
        function renderAdminDashboard() {
            let messagesHtml = state.messages.map(m => `
                <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-3">
                    <div class="flex justify-between items-center text-xs text-slate-400">
                        <span>De : <strong class="text-white">${m.emetteur}</strong> (${m.role})</span>
                        <span class="bg-blue-900/50 text-blue-300 px-2 py-0.5 rounded">En attente de réponse</span>
                    </div>
                    <p class="text-sm text-slate-200">${m.texte}</p>
                    
                    <div class="mt-2 pt-3 border-t border-slate-700">
                        ${m.reponse ? `
                            <div class="bg-slate-900 p-3 rounded text-xs text-emerald-400 border border-emerald-900/50">
                                <strong>Réponse de l'Administration :</strong> ${m.reponse}
                            </div>
                        ` : `
                            <div class="flex gap-2">
                                <input type="text" id="rep-${m.id}" placeholder="Écrire une réponse..." class="flex-grow bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-blue-500">
                                <button onclick="envoyerReponse(${m.id})" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-1.5 rounded transition">Répondre</button>
                            </div>
                        `}
                    </div>
                </div>
            `).join('');

            return `
                <div class="space-y-6">
                    <div class="bg-slate-850 p-4 rounded-xl border border-slate-800">
                        <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-shield-halved text-blue-400 mr-2"></i>Espace Administration</h2>
                        <p class="text-xs text-slate-400">Gestion globale et messagerie interactive avec les enseignants.</p>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Messages & Requêtes reçus</h3>
                        ${messagesHtml}
                    </div>
                </div>
            `;
        }

        function envoyerReponse(id) {
            const input = document.getElementById(`rep-${id}`);
            const texteReponse = input.value.trim();
            if (texteReponse) {
                const msg = state.messages.find(m => m.id === id);
                if (msg) {
                    msg.reponse = texteReponse;
                    render(false);
                }
            }
        }

        // Initialisation au chargement
        render(false);
    </script>
</body>
</html>
