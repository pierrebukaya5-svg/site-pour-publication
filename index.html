<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Administration</title>
    <style>
        :root {
            --bg-main: #0f172a;        /* Fond général très sombre */
            --bg-card: #1e293b;        /* Fond des blocs / cartes */
            --border-color: #334155;   /* Bordures discrètes */
            --text-main: #f8fafc;      /* Texte principal très clair */
            --text-muted: #94a3b8;     /* Texte secondaire */
            --accent-blue: #3b82f6;    /* Bleu professionnel */
            --accent-hover: #2563eb;   /* Bleu survol */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            margin: 0;
            color: var(--text-main);
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-blue);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2.section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        /* Grille du Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Style des Cartes */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            margin-top: 0;
            font-size: 1.1rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* Formulaires */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select, textarea {
            background-color: #0b1120;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button, .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            font-size: 0.95rem;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Tableaux de données propres */
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.01);
        }
    </style>
</head>
<body>

    <header>
        <h1>Portail Scolaire RDC</h1>
        <nav>
            <a href="#">Accueil</a>
            <a href="#">Espace Parent</a>
            <a href="#">Espace Prof</a>
            <a href="#" class="active">Administration</a>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">Panneau d'Administration</h2>

        <div class="dashboard-grid">
            <!-- Formulaire d'enregistrement -->
            <div class="card">
                <h3>Enregistrement</h3>
                <div class="form-group">
                    <label>Type d'enregistrement</label>
                    <select>
                        <option>Élève</option>
                        <option>Professeur</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nom *</label>
                    <input type="text" placeholder="Nom de famille">
                </div>
                <div class="form-group">
                    <label>Prénom *</label>
                    <input type="text" placeholder="Prénom">
                </div>
                <div class="form-group">
                    <label>Classe *</label>
                    <select>
                        <option>6ème Scientifique</option>
                        <option>5ème Commerciale</option>
                    </select>
                </div>
                <button>Enregistrer dans Firebase</button>
            </div>

            <!-- Publication de communiqué -->
            <div class="card">
                <h3>Publier un Communiqué</h3>
                <div class="form-group">
                    <label>Message (Visible à l'accueil)</label>
                    <textarea placeholder="Écrivez votre communiqué ici..."></textarea>
                </div>
                <button>Publier</button>
            </div>
        </div>

        <!-- Section Listes -->
        <div class="card">
            <h3>Liste des Élèves Enregistrés</h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Matricule</th>
                            <th>Nom & Prénom</th>
                            <th>Sexe</th>
                            <th>Classe</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1000001</td>
                            <td>Kabuya Paul</td>
                            <td>M</td>
                            <td>6ème Scientifique</td>
                            <td><a href="#" style="color: var(--accent-blue); text-decoration: none;">Modifier</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
