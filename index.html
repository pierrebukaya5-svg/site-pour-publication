<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDpzKhm93AJnwGsqptCBNfmWG8E4m0uJNM",
    authDomain: "site-publication.firebaseapp.com",
    databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
    projectId: "site-publication",
    storageBucket: "site-publication.firebasestorage.app",
    messagingSenderId: "934019778891",
    appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = ref(db, 'ecole_rdc_complet');

let modeActif = '';
let utilisateurConnecte = null;
const statusEl = document.getElementById('status-connexion');

onValue(dbRef, (snapshot) => {
    statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500"></span> Connecté en temps réel actif';
    const data = snapshot.val() || { eleves: {}, profs: {}, messages: {} };
    actualiserInterfaceAdmin(data);
    
    if(modeActif === 'eleve' && utilisateurConnecte) mettreAJourDashboardEleve(data);
    if(modeActif === 'prof' && utilisateurConnecte) mettreAJourDashboardProf(data);
    if(modeActif === 'parent' && utilisateurConnecte) mettreAJourDashboardParent(data);
});

window.changerVue = function(vue) {
    ['accueil', 'connexion', 'admin-dashboard', 'eleve-dashboard', 'prof-dashboard', 'parent-dashboard'].forEach(v => {
        document.getElementById(`vue-${v}`).classList.add('hidden');
    });

    if(vue === 'accueil') {
        document.getElementById('vue-accueil').classList.remove('hidden');
        modeActif = '';
        utilisateurConnecte = null;
    } else if(vue === 'admin-login') {
        modeActif = 'admin';
        document.getElementById('vue-connexion').classList.remove('hidden');
        document.getElementById('titre-connexion').innerText = "Connexion Administration";
        document.getElementById('label-code').innerText = "Code administrateur privé";
        document.getElementById('input-code').value = '';
        document.getElementById('erreur-connexion').classList.add('hidden');
    } else if(vue.includes('-login')) {
        modeActif = vue.replace('-login', '');
        document.getElementById('vue-connexion').classList.remove('hidden');
        document.getElementById('titre-connexion').innerText = `Connexion ${modeActif.charAt(0).toUpperCase() + modeActif.slice(1)}`;
        document.getElementById('label-code').innerText = "Code d'accès unique";
        document.getElementById('input-code').value = '';
        document.getElementById('erreur-connexion').classList.add('hidden');
    }
}

window.changerOngletAdmin = function(onglet) {
    ['eleves', 'professeurs', 'messages'].forEach(o => {
        document.getElementById(`admin-sec-${o}`).classList.add('hidden');
        document.getElementById(`tab-btn-${o === 'eleves' ? 'eleves' : o === 'professeurs' ? 'profs' : 'msgs'}`).className = "px-4 py-2 bg-slate-200 text-slate-700 rounded-lg text-sm font-medium";
    });
    document.getElementById(`admin-sec-${onglet}`).classList.remove('hidden');
    document.getElementById(`tab-btn-${onglet === 'eleves' ? 'eleves' : onglet === 'professeurs' ? 'profs' : 'msgs'}`).className = "px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium";
}

window.validerConnexion = function() {
    const code = document.getElementById('input-code').value.trim().toUpperCase();
    if(!code) return;

    if(modeActif === 'admin') {
        if(code === 'PR1999') {
            document.getElementById('vue-connexion').classList.add('hidden');
            document.getElementById('vue-admin-dashboard').classList.remove('hidden');
        } else {
            document.getElementById('erreur-connexion').classList.remove('hidden');
        }
        return;
    }

    onValue(dbRef, (snapshot) => {
        const data = snapshot.val() || {};
        let trouve = null;

        if(modeActif === 'eleve') {
            Object.values(data.eleves || {}).forEach(el => {
                if(el.codeEleve === code) {
                    if(el.frais === 'non_ordre') {
                        alert("Accès refusé : Frais scolaires non réglés.");
                        return;
                    }
                    trouve = el;
                }
            });
        } else if(modeActif === 'prof') {
            Object.values(data.profs || {}).forEach(p => {
                if(p.codeProf === code) trouve = p;
            });
        } else if(modeActif === 'parent') {
            Object.values(data.eleves || {}).forEach(el => {
                if(el.codeParent === code) trouve = { tuteur: el.tuteur, codeParent: code };
            });
        }

        if(trouve) {
            utilisateurConnecte = trouve;
            document.getElementById('vue-connexion').classList.add('hidden');
            if(modeActif === 'eleve') {
                document.getElementById('vue-eleve-dashboard').classList.remove('hidden');
                document.getElementById('welcome-eleve').innerText = `Bienvenue, ${trouve.prenom} ${trouve.nom} (${trouve.classe})`;
                peuplerSelectCours(data, 'select-cours-eleve');
                mettreAJourDashboardEleve(data);
            } else if(modeActif === 'prof') {
                document.getElementById('vue-prof-dashboard').classList.remove('hidden');
                document.getElementById('welcome-prof').innerText = `Prof. ${trouve.nom} - Cours : ${trouve.cours}`;
                document.getElementById('print-prof-nom').innerText = trouve.nom;
                document.getElementById('print-prof-cours').innerText = trouve.cours;
                
                if(trouve.baremes) {
                    document.getElementById('cfg-nb-interros').value = trouve.baremes.nbInterros || 4;
                    document.getElementById('cfg-max-interro').value = trouve.baremes.maxInterro || 10;
                    document.getElementById('cfg-actif-devoir').value = trouve.baremes.actifDevoir || 'oui';
                    document.getElementById('cfg-max-devoir').value = trouve.baremes.maxDevoir || 10;
                    document.getElementById('cfg-actif-examen').value = trouve.baremes.actifExamen || 'oui';
                    document.getElementById('cfg-max-examen').value = trouve.baremes.maxExamen || 50;
                }
                mettreAJourDashboardProf(data);
            } else if(modeActif === 'parent') {
                document.getElementById('vue-parent-dashboard').classList.remove('hidden');
                document.getElementById('welcome-parent').innerText = `Tuteur : ${trouve.tuteur}`;
                peuplerSelectCours(data, 'select-cours-parent');
                mettreAJourDashboardParent(data);
            }
        } else {
            document.getElementById('erreur-connexion').classList.remove('hidden');
        }
    }, { onlyOnce: true });
}

function peuplerSelectCours(data, selectId) {
    const select = document.getElementById(selectId);
    if(!select) return;
    const coursDisponibles = new Set();
    Object.values(data.profs || {}).forEach(p => { if(p.cours) coursDisponibles.add(p.cours); });
    
    const valeurActuelle = select.value;
    select.innerHTML = `<option value="">Tous les cours</option>`;
    coursDisponibles.forEach(c => {
        select.innerHTML += `<option value="${c}">${c}</option>`;
    });
    select.value = valeurActuelle;
}

window.basculerAffichageCode = function(idElement) {
    const el = document.getElementById(idElement);
    el.classList.toggle('blur-sm');
}

window.imprimerListeEleves = function() {
    document.getElementById('date-impression').innerText = new Date().toLocaleDateString();
    window.print();
}

window.imprimerFicheProf = function() {
    document.getElementById('print-prof-trim').innerText = document.getElementById('prof-select-trimestre').value;
    const classeVal = document.getElementById('prof-select-classe').value;
    document.getElementById('print-prof-classe').innerText = classeVal ? classeVal : "Toutes les classes";
    window.print();
}

window.sauvegarderBaremesProf = function() {
    if(!utilisateurConnecte || modeActif !== 'prof') return;
    
    onValue(dbRef, (snapshot) => {
        const data = snapshot.val() || {};
        let profKey = null;
        Object.keys(data.profs || {}).forEach(k => {
            if(data.profs[k].codeProf === utilisateurConnecte.codeProf) profKey = k;
        });

        if(profKey) {
            const baremes = {
                nbInterros: parseInt(document.getElementById('cfg-nb-interros').value),
                maxInterro: parseFloat(document.getElementById('cfg-max-interro').value) || 10,
                actifDevoir: document.getElementById('cfg-actif-devoir').value,
                maxDevoir: parseFloat(document.getElementById('cfg-max-devoir').value) || 10,
                actifExamen: document.getElementById('cfg-actif-examen').value,
                maxExamen: parseFloat(document.getElementById('cfg-max-examen').value) || 50
            };
            update(ref(db, `ecole_rdc_complet/profs/${profKey}`), { baremes });
            utilisateurConnecte.baremes = baremes;
            mettreAJourDashboardProf(data);
        }
    }, { onlyOnce: true });
}

window.enregistrerOuModifierEleve = function() {
    const editKey = document.getElementById('edit-eleve-key').value;
    const nom = document.getElementById('el-nom').value.trim();
    const postnom = document.getElementById('el-postnom').value.trim();
    const prenom = document.getElementById('el-prenom').value.trim();
    const classe = document.getElementById('el-classe').value.trim();
    const adresse = document.getElementById('el-adresse').value.trim();
    const datenais = document.getElementById('el-datenais').value;
    const tuteur = document.getElementById('el-tuteur').value.trim();
    const frais = document.getElementById('el-frais').value;

    if(!nom || !prenom || !classe || !tuteur) return alert("Veuillez remplir les champs obligatoires.");

    if(editKey) {
        update(ref(db, `ecole_rdc_complet/eleves/${editKey}`), {
            nom, postnom, prenom, classe, adresse, datenais, tuteur, frais
        });
        annulerModificationEleve();
        alert("Informations de l'élève mises à jour avec succès !");
    } else {
        const codeEleve = `ELV-${Math.floor(1000 + Math.random() * 9000)}`;
        const codeParent = `PAR-${Math.floor(1000 + Math.random() * 9000)}`;

        push(ref(db, 'ecole_rdc_complet/eleves'), {
            nom, postnom, prenom, classe, adresse, datenais, tuteur, frais,
            codeEleve, codeParent,
            cotations: { T1: {}, T2: {}, T3: {} },
            presences: { T1: 'Présent', T2: 'Présent', T3: 'Présent' }
        });
        viderFormulaireEleve();
    }
}

window.preparerModificationEleve = function(key, elStr) {
    const el = JSON.parse(decodeURIComponent(elStr));
    document.getElementById('edit-eleve-key').value = key;
    document.getElementById('el-nom').value = el.nom || '';
    document.getElementById('el-postnom').value = el.postnom || '';
    document.getElementById('el-prenom').value = el.prenom || '';
    document.getElementById('el-classe').value = el.classe || '';
    document.getElementById('el-adresse').value = el.adresse || '';
    document.getElementById('el-datenais').value = el.datenais || '';
    document.getElementById('el-tuteur').value = el.tuteur || '';
    document.getElementById('el-frais').value = el.frais || 'en_ordre';

    document.getElementById('titre-form-eleve').innerText = "Modifier les informations de l'élève";
    document.getElementById('btn-valider-eleve').innerText = "Mettre à jour";
    document.getElementById('btn-annuler-eleve').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.annulerModificationEleve = function() {
    document.getElementById('edit-eleve-key').value = '';
    viderFormulaireEleve();
    document.getElementById('titre-form-eleve').innerText = "Enregistrer un nouvel élève";
    document.getElementById('btn-valider-eleve').innerText = "Enregistrer";
    document.getElementById('btn-annuler-eleve').classList.add('hidden');
}

function viderFormulaireEleve() {
    ['el-nom', 'el-postnom', 'el-prenom', 'el-classe', 'el-adresse', 'el-datenais', 'el-tuteur'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('el-frais').value = 'en_ordre';
}

window.supprimerEleve = function(key) {
    if(confirm("Voulez-vous vraiment supprimer cet élève ?")) {
        remove(ref(db, `ecole_rdc_complet/eleves/${key}`));
    }
}

window.enregistrerProfesseur = function() {
    const nom = document.getElementById('prf-nom').value.trim();
    const cours = document.getElementById('prf-cours').value.trim();
    if(!nom || !cours) return;
    push(ref(db, 'ecole_rdc_complet/profs'), { 
        nom, 
        cours, 
        codeProf: `PRF-${Math.floor(1000 + Math.random() * 9000)}`,
        baremes: { nbInterros: 4, maxInterro: 10, actifDevoir: 'oui', maxDevoir: 10, actifExamen: 'oui', maxExamen: 50 }
    });
    document.getElementById('prf-nom').value = '';
    document.getElementById('prf-cours').value = '';
}

function actualiserInterfaceAdmin(data) {
    const eleves = data.eleves || {};
    const tbody = document.getElementById('liste-admin-eleves');
    tbody.innerHTML = "";

    if(Object.keys(eleves).length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Aucun élève enregistré</td></tr>`;
    }

    Object.keys(eleves).reverse().forEach((key, index) => {
        const el = eleves[key];
        const idCode = `code-sec-${index}`;
        const elJson = encodeURIComponent(JSON.stringify(el));
        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-slate-50";
        tr.innerHTML = `
            <td class="p-2 font-medium">${el.nom} ${el.postnom || ''} ${el.prenom}</td>
            <td class="p-2">${el.classe}</td>
            <td class="p-2 text-xs"><strong>Tuteur :</strong> ${el.tuteur}<br><span class="text-slate-500">Adr. : ${el.adresse || 'Non renseignée'}</span></td>
            <td class="p-2 font-mono text-xs cursor-pointer" title="Cliquer pour voir/masquer" onclick="basculerAffichageCode('${idCode}')">
                <span id="${idCode}" class="blur-sm bg-slate-200 px-1 rounded select-none">Élève : ${el.codeEleve} | Parent : ${el.codeParent}</span>
            </td>
            <td class="p-2"><span class="px-2 py-1 rounded text-xs font-semibold ${el.frais === 'en_ordre' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${el.frais === 'en_ordre' ? 'En ordre' : 'Non payé'}</span></td>
            <td class="p-2 text-center space-x-1 no-print">
                <button onclick="preparerModificationEleve('${key}', '${elJson}')" class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded font-medium">Modifier</button>
                <button onclick="supprimerEleve('${key}')" class="text-red-500 font-bold px-1 text-sm" title="Supprimer">✕</button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    const profs = data.profs || {};
    const profsContainer = document.getElementById('liste-admin-profs');
    profsContainer.innerHTML = "";
    Object.values(profs).forEach((p, idx) => {
        const idProfCode = `prof-code-${idx}`;
        profsContainer.innerHTML += `
            <div class="border p-3 rounded-lg bg-slate-50 text-sm">
                <strong>Prof. ${p.nom}</strong> - Cours : ${p.cours} <br>
                <span class="font-mono text-xs cursor-pointer blur-sm bg-slate-200 px-1 rounded select-none" id="${idProfCode}" onclick="basculerAffichageCode('${idProfCode}')">Code : ${p.codeProf}</span>
            </div>`;
    });

    const messages = data.messages || {};
    const boxMsgs = document.getElementById('admin-box-messages');
    boxMsgs.innerHTML = "";
    if(Object.keys(messages).length === 0) {
        boxMsgs.innerHTML = `<p class="text-slate-400 text-xs p-2">Aucun message de tuteur pour le moment.</p>`;
    }
    Object.keys(messages).forEach(mKey => {
        const m = messages[mKey];
        let reponsesHtml = '';
        if(m.reponses) {
            Object.values(m.reponses).forEach(rep => {
                reponsesHtml += `<div class="ml-4 mt-2 p-2 rounded bg-blue-50 border-l-2 border-blue-600 text-xs"><strong>Administration :</strong> ${rep.texte} <div class="text-[10px] text-slate-400">${rep.date}</div></div>`;
            });
        }
        boxMsgs.innerHTML += `
            <div class="border p-3 rounded bg-white text-sm space-y-2">
                <div><strong>Tuteur (${m.tuteur}) :</strong> ${m.texte} <div class="text-xs text-slate-400">${m.date}</div></div>
                ${reponsesHtml}
                <div class="mt-2 flex gap-2">
                    <input id="admin-rep-${mKey}" placeholder="Répondre au tuteur..." class="border p-1.5 rounded flex-1 text-xs">
                    <button onclick="repondreMessageAdmin('${mKey}')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-medium">Répondre</button>
                </div>
            </div>`;
    });
}

window.changerTrimestreEleve = function() {
    onValue(dbRef, (snapshot) => { mettreAJourDashboardEleve(snapshot.val()); }, { onlyOnce: true });
}

function calculerTotauxEtPourcentageCours(cData, baremes) {
    let obtenu = 0;
    let maximum = 0;

    const nbInterros = baremes?.nbInterros || 4;
    const maxInt = baremes?.maxInterro || 10;
    for(let i=1; i<=nbInterros; i++) {
        const val = parseFloat(cData[`interro${i}`]);
        if(!isNaN(val)) obtenu += val;
        maximum += maxInt;
    }

    if(baremes?.actifDevoir !== 'non') {
        const valDev = parseFloat(cData.devoir);
        if(!isNaN(valDev)) obtenu += valDev;
        maximum += (baremes?.maxDevoir || 10);
    }

    if(baremes?.actifExamen !== 'non') {
        const valEx = parseFloat(cData.examen);
        if(!isNaN(valEx)) obtenu += valEx;
        maximum += (baremes?.maxExamen || 50);
    }

    const pourcentage = maximum > 0 ? ((obtenu / maximum) * 100).toFixed(2) : "0.00";
    return { obtenu, maximum, pourcentage };
}

// FONCTION DE CALCUL DU CLASSEMENT DANS LA CLASSE
function calculerClassementClasse(elevesData, classeCible, trimestre, profsData) {
    let tableauElevesClasse = [];

    Object.values(elevesData).forEach(el => {
        if(el.classe === classeCible) {
            let totalObtenuEl = 0;
            const cotationsTrim = el.cotations?.[trimestre] || {};
            
            Object.keys(cotationsTrim).forEach(cours => {
                const cData = cotationsTrim[cours] || {};
                let baremesCours = { nbInterros: 4, maxInterro: 10, actifDevoir: 'oui', maxDevoir: 10, actifExamen: 'oui', maxExamen: 50 };
                Object.values(profsData).forEach(p => {
                    if(p.cours === cours && p.baremes) baremesCours = p.baremes;
                });
                const res = calculerTotauxEtPourcentageCours(cData, baremesCours);
                totalObtenuEl += res.obtenu;
            });

            tableauElevesClasse.push({
                codeEleve: el.codeEleve,
                nomComplet: `${el.nom} ${el.postnom || ''} ${el.prenom}`,
                total: totalObtenuEl
            });
        }
    });

    // Tri décroissant : celui qui a le plus de points est premier
    tableauElevesClasse.sort((a, b) => b.total - a.total);

    return tableauElevesClasse;
}

function mettreAJourDashboardEleve(data) {
    if(!utilisateurConnecte) return;
    const trimestre = document.getElementById('select-trimestre-eleve').value;
    const coursFiltre = document.getElementById('select-cours-eleve').value;
    let eleveActuel = null;
    Object.values(data.eleves || {}).forEach(el => { if(el.codeEleve === utilisateurConnecte.codeEleve) eleveActuel = el; });
    if(!eleveActuel) return;

    // Calcul du classement dans la classe
    const classementClasse = calculerClassementClasse(data.eleves || {}, eleveActuel.classe, trimestre, data.profs || {});
    const positionEleve = classementClasse.findIndex(e => e.codeEleve === eleveActuel.codeEleve) + 1;
    const totalEffectifClasse = classementClasse.length;

    const cotationsDiv = document.getElementById('contenu-cotations');
    const cotationsTrimestre = eleveActuel.cotations?.[trimestre] || {};
    cotationsDiv.innerHTML = "";

    let totalObtenuGlobal = 0;
    let totalMaximumGlobal = 0;
    let coursTrouves = 0;
    const profs = data.profs || {};

    Object.keys(cotationsTrimestre).forEach(cours => {
        if(coursFiltre && cours !== coursFiltre) return;
        coursTrouves++;
        const cData = cotationsTrimestre[cours] || {};
        
        let baremesCours = { nbInterros: 4, maxInterro: 10, actifDevoir: 'oui', maxDevoir: 10, actifExamen: 'oui', maxExamen: 50 };
        Object.values(profs).forEach(p => {
            if(p.cours === cours && p.baremes) baremesCours = p.baremes;
        });

        const resCalcul = calculerTotauxEtPourcentageCours(cData, baremesCours);
        totalObtenuGlobal += resCalcul.obtenu;
        totalMaximumGlobal += resCalcul.maximum;

        let interrosHtml = '';
        for(let i=1; i<=baremesCours.nbInterros; i++) {
            interrosHtml += `<div>Interro ${i} (/${baremesCours.maxInterro}) : <strong>${cData['interro'+i] !== undefined && cData['interro'+i] !== '' ? cData['interro'+i] : '-'}</strong></div>`;
        }

        let devoirHtml = '';
        if(baremesCours.actifDevoir !== 'non') {
            devoirHtml = `<div>Devoir (/${baremesCours.maxDevoir}) : <strong>${cData.devoir !== undefined && cData.devoir !== '' ? cData.devoir : '-'}</strong></div>`;
        }

        let examenHtml = '';
        if(baremesCours.actifExamen !== 'non') {
            examenHtml = `<div>Examen (/${baremesCours.maxExamen}) : <strong>${cData.examen !== undefined && cData.examen !== '' ? cData.examen : '-'}</strong></div>`;
        }

        cotationsDiv.innerHTML += `
            <div class="border p-3 rounded-lg bg-white space-y-1 shadow-sm">
                <div class="flex justify-between items-center border-b pb-1 mb-1">
                    <span class="font-bold text-blue-900">${cours}</span>
                    <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-semibold">Total : ${resCalcul.obtenu} / ${resCalcul.maximum} (${resCalcul.pourcentage}%)</span>
                </div>
                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-700">
                    ${interrosHtml}
                    ${devoirHtml}
                    ${examenHtml}
                </div>
            </div>`;
    });

    const pourcentageGlobal = totalMaximumGlobal > 0 ? ((totalObtenuGlobal / totalMaximumGlobal) * 100).toFixed(2) : "0.00";
    
    // Affichage du pourcentage et du classement mis à jour dynamiquement
    document.getElementById('eleve-pourcentage-global').innerHTML = `
        <div>${pourcentageGlobal} % <span class="text-xs font-normal opacity-90">(${totalObtenuGlobal} pts / ${totalMaximumGlobal} pts)</span></div>
        <div class="text-xs bg-white/20 mt-2 px-2.5 py-1 rounded inline-block font-medium">🏆 Classement : <strong>${positionEleve}<sup>ème</sup></strong> sur ${totalEffectifClasse} élèves</div>
    `;

    if(coursTrouves === 0) {
        cotationsDiv.innerHTML = `<p class='text-slate-400 text-xs'>Aucune cotation enregistrée pour cette sélection.</p>`;
    }

    document.getElementById('contenu-presences').innerHTML = `<div class="p-2 rounded bg-green-50 text-green-800">Statut (${trimestre}) : <strong>${eleveActuel.presences?.[trimestre] || 'Présent'}</strong></div>`;
}

window.changerTrimestreProf = function() {

function mettreAJourDashboardProf(data) {
    if(!utilisateurConnecte) return;
    const container = document.getElementById('prof-liste-eleves-action');
    container.innerHTML = "";
    const trimestre = document.getElementById('prof-select-trimestre')?.value || 'T1';
    const classeFiltre = document.getElementById('prof-select-classe')?.value || '';

    const nbInterros = parseInt(document.getElementById('cfg-nb-interros')?.value) || 4;
    const maxInterro = parseFloat(document.getElementById('cfg-max-interro')?.value) || 10;
    const actifDevoir = document.getElementById('cfg-actif-devoir')?.value || 'oui';
    const maxDevoir = parseFloat(document.getElementById('cfg-max-devoir')?.value) || 10;
    const actifExamen = document.getElementById('cfg-actif-examen')?.value || 'oui';
    const maxExamen = parseFloat(document.getElementById('cfg-max-examen')?.value) || 50;

    for(let i=1; i<=4; i++) {
        const th = document.getElementById(`th-int${i}`);
        if(th) {
            if(i <= nbInterros) {
                th.style.display = '';
                th.innerText = `Int. ${i} (/${maxInterro})`;
            } else {
                th.style.display = 'none';
            }
        }
    }
    const thDev = document.getElementById('th-dev');
    if(thDev) {
        if(actifDevoir !== 'non') {
            thDev.style.display = '';
            thDev.innerText = `Devoir (/${maxDevoir})`;
        } else {
            thDev.style.display = 'none';
        }
    }
    const thEx = document.getElementById('th-ex');
    if(thEx) {
        if(actifExamen !== 'non') {
            thEx.style.display = '';
            thEx.innerText = `Examen (/${maxExamen})`;
        } else {
            thEx.style.display = 'none';
        }
    }

    const eleves = data.eleves || {};
    let nbEleves = 0;
    const baremesActuels = { nbInterros, maxInterro, actifDevoir, maxDevoir, actifExamen, maxExamen };

    Object.keys(eleves).forEach(key => {
        const el = eleves[key];
        if(classeFiltre && el.classe !== classeFiltre) return;
        nbEleves++;

        const cData = el.cotations?.[trimestre]?.[utilisateurConnecte.cours] || {};
        const presenceActuelle = el.presences?.[trimestre] || 'Présent';
        const resCalc = calculerTotauxEtPourcentageCours(cData, baremesActuels);

        let inputsInterrosHtml = '';
        for(let i=1; i<=4; i++) {
            const styleDisplay = i <= nbInterros ? '' : 'display:none;';
            inputsInterrosHtml += `<td class="p-1 text-center" style="${styleDisplay}"><input id="int${i}-${key}" type="number" min="0" max="${maxInterro}" step="0.5" value="${cData['interro'+i] !== undefined ? cData['interro'+i] : ''}" class="border p-1 rounded w-14 text-xs text-center"></td>`;
        }

        let inputDevoirHtml = `<td class="p-1 text-center" style="${actifDevoir === 'non' ? 'display:none;' : ''}"><input id="dev-${key}" type="number" min="0" max="${maxDevoir}" step="0.5" value="${cData.devoir !== undefined ? cData.devoir : ''}" class="border p-1 rounded w-14 text-xs text-center"></td>`;
        let inputExamenHtml = `<td class="p-1 text-center" style="${actifExamen === 'non' ? 'display:none;' : ''}"><input id="ex-${key}" type="number" min="0" max="${maxExamen}" step="0.5" value="${cData.examen !== undefined ? cData.examen : ''}" class="border p-1 rounded w-14 text-xs text-center"></td>`;

        container.innerHTML += `
            <tr class="border-b hover:bg-slate-50">
                <td class="p-2 font-medium">${el.nom} ${el.postnom || ''} ${el.prenom}</td>
                <td class="p-2 text-xs text-slate-600">${el.classe}</td>
                ${inputsInterrosHtml}
                ${inputDevoirHtml}
                ${inputExamenHtml}
                <td class="p-2 text-center bg-blue-50 font-bold text-xs text-blue-900">${resCalc.obtenu}/${resCalc.maximum} (${resCalc.pourcentage}%)</td>
                <td class="p-2">
                    <select id="pres-${key}" class="border p-1.5 rounded text-xs">
                        <option value="Présent" ${presenceActuelle === 'Présent' ? 'selected' : ''}>Présent</option>
                        <option value="Absent" ${presenceActuelle === 'Absent' ? 'selected' : ''}>Absent</option>
                    </select>
                </td>
                <td class="p-2 text-center no-print">
                    <button onclick="sauvegarderNoteProf('${key}')" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs font-medium hover:bg-emerald-700">Enregistrer</button>
                </td>
            </tr>`;
    });

    if(nbEleves === 0) {
        container.innerHTML = `<tr><td colspan="12" class="p-4 text-center text-slate-400">Aucun élève trouvé pour cette sélection.</td></tr>`;
    }
}

window.sauvegarderNoteProf = function(eleveKey) {
    const nbInterros = parseInt(document.getElementById('cfg-nb-interros').value) || 4;
    const objetCotation = {};
    for(let i=1; i<=nbInterros; i++) {
        objetCotation[`interro${i}`] = document.getElementById(`int${i}-${eleveKey}`).value;
    }
    if(document.getElementById('cfg-actif-devoir').value !== 'non') {
        objetCotation.devoir = document.getElementById(`dev-${eleveKey}`).value;
    }
    if(document.getElementById('cfg-actif-examen').value !== 'non') {
        objetCotation.examen = document.getElementById(`ex-${eleveKey}`).value;
    }

    const presence = document.getElementById(`pres-${eleveKey}`).value;
    const trimestre = document.getElementById('prof-select-trimestre')?.value || 'T1';

    update(ref(db, `ecole_rdc_complet/eleves/${eleveKey}/cotations/${trimestre}`), { [utilisateurConnecte.cours]: objetCotation });
    update(ref(db, `ecole_rdc_complet/eleves/${eleveKey}/presences`), { [trimestre]: presence });
    alert("Cotations et totaux mis à jour avec succès !");
}

window.envoyerMessageParent = function() {
    const texte = document.getElementById('parent-msg-input').value.trim();
    if(!texte || !utilisateurConnecte) return;
    push(ref(db, 'ecole_rdc_complet/messages'), { tuteur: utilisateurConnecte.tuteur, codeParent: utilisateurConnecte.codeParent, texte, date: new Date().toLocaleString() });
    document.getElementById('parent-msg-input').value = '';
}

window.repondreMessageAdmin = function(msgKey) {
    const texte = document.getElementById(`admin-rep-${msgKey}`).value.trim();
    if(!texte) return alert("Veuillez saisir une réponse.");
    push(ref(db, `ecole_rdc_complet/messages/${msgKey}/reponses`), { texte, date: new Date().toLocaleString() });
    document.getElementById(`admin-rep-${msgKey}`).value = '';
}

window.changerTrimestreParent = function() {
    onValue(dbRef, (snapshot) => { mettreAJourDashboardParent(snapshot.val()); }, { onlyOnce: true });
}

function mettreAJourDashboardParent(data) {
    if(!utilisateurConnecte) return;
    const trimestre = document.getElementById('select-trimestre-parent')?.value || 'T1';
    const coursFiltre = document.getElementById('select-cours-parent')?.value || '';
    const enfantsContainer = document.getElementById('parent-liste-enfants');
    enfantsContainer.innerHTML = "";
    let unEnfantBloque = false;
    const profs = data.profs || {};

    Object.values(data.eleves || {}).forEach(el => {
        if(el.codeParent === utilisateurConnecte.codeParent) {
            if(el.frais === 'non_ordre') unEnfantBloque = true;
            
            // Calcul du classement de l'enfant dans sa classe
            const classementClasse = calculerClassementClasse(data.eleves || {}, el.classe, trimestre, profs);
            const positionEnfant = classementClasse.findIndex(e => e.codeEleve === el.codeEleve) + 1;
            const totalEffectifClasse = classementClasse.length;

            const cotationsTrimestre = el.cotations?.[trimestre] || {};
            let notesHtml = '';
            let coursTrouves = 0;
            let totalObtenuEnfant = 0;
            let totalMaximumEnfant = 0;

            Object.keys(cotationsTrimestre).forEach(cours => {
                if(coursFiltre && cours !== coursFiltre) return;
                coursTrouves++;
                const cData = cotationsTrimestre[cours] || {};

                let baremesCours = { nbInterros: 4, maxInterro: 10, actifDevoir: 'oui', maxDevoir: 10, actifExamen: 'oui', maxExamen: 50 };
                Object.values(profs).forEach(p => {
                    if(p.cours === cours && p.baremes) baremesCours = p.baremes;
                });

                const resCalc = calculerTotauxEtPourcentageCours(cData, baremesCours);
                totalObtenuEnfant += resCalc.obtenu;
                totalMaximumEnfant += resCalc.maximum;

                let detailsLignes = '';
                for(let i=1; i<=baremesCours.nbInterros; i++) {
                    detailsLignes += `<div>Interro ${i} (/${baremesCours.maxInterro}) : <strong>${cData['interro'+i] !== undefined && cData['interro'+i] !== '' ? cData['interro'+i] : '-'}</strong></div>`;
                }
                if(baremesCours.actifDevoir !== 'non') {
                    detailsLignes += `<div>Devoir (/${baremesCours.maxDevoir}) : <strong>${cData.devoir !== undefined && cData.devoir !== '' ? cData.devoir : '-'}</strong></div>`;
                }
                if(baremesCours.actifExamen !== 'non') {
                    detailsLignes += `<div>Examen (/${baremesCours.maxExamen}) : <strong>${cData.examen !== undefined && cData.examen !== '' ? cData.examen : '-'}</strong></div>`;
                }

                notesHtml += `
                    <div class="mt-2 text-xs space-y-1 bg-white p-2.5 rounded border shadow-sm">
                        <div class="flex justify-between font-bold text-slate-800 border-b pb-1 mb-1">
                            <span>${cours}</span>
                            <span class="text-blue-700">Total : ${resCalc.obtenu}/${resCalc.maximum} (${resCalc.pourcentage}%)</span>
                        </div>
                        <div class="grid grid-cols-2 gap-1 text-slate-600">
                            ${detailsLignes}
                        </div>
                    </div>`;
            });

            const pourcentageEnfant = totalMaximumEnfant > 0 ? ((totalObtenuEnfant / totalMaximumEnfant) * 100).toFixed(2) : "0.00";

            if(coursTrouves === 0) {
                notesHtml = `<p class="text-xs text-slate-400 mt-1">Aucune note enregistrée pour ce trimestre.</p>`;
            }

            enfantsContainer.innerHTML += `
                <div class="border p-4 rounded-xl bg-slate-50 text-sm space-y-2 shadow-sm">
                    <div class="flex justify-between items-center border-b pb-2">
                        <div>
                            <strong>${el.nom} ${el.prenom}</strong> (${el.classe})<br>
                            <span class="text-xs">Frais : <span class="${el.frais === 'en_ordre' ? 'text-green-600 font-bold' : 'text-red-600 font-bold'}">${el.frais === 'en_ordre' ? 'En ordre' : 'Bloqué'}</span></span>
                        </div>
                        <div class="text-right bg-blue-600 text-white px-3 py-1.5 rounded-lg">
                            <div class="text-[10px] uppercase opacity-90">Pourcentage Global</div>
                            <div class="font-extrabold text-base">${pourcentageEnfant} %</div>
                            <div class="text-[11px] mt-1 bg-white/20 px-2 py-0.5 rounded font-medium">🏆 ${positionEnfant}<sup>ème</sup> / ${totalEffectifClasse}</div>
                        </div>
                    </div>
                    <div class="mt-2"><strong>Notes par cours (${trimestre}) :</strong></div>
                    ${notesHtml}
                </div>`;
        }
    });

    document.getElementById('alerte-frais-parent').classList.toggle('hidden', !unEnfantBloque);

    const chatBox = document.getElementById('parent-chat-box');
    chatBox.innerHTML = "";
    const messages = data.messages || {};
    Object.keys(messages).forEach(mKey => {
        const m = messages[mKey];
        if(m.codeParent === utilisateurConnecte.codeParent) {
            let reponsesHtml = '';
            if(m.reponses) {
                Object.values(m.reponses).forEach(rep => {
                    reponsesHtml += `<div class="mt-1 p-2 rounded bg-white border text-xs text-slate-800"><strong>Administration :</strong> ${rep.texte} <div class="text-[10px] text-slate-400">${rep.date}</div></div>`;
                });
            }
            chatBox.innerHTML += `
                <div class="p-2.5 rounded bg-blue-50 text-blue-900 space-y-2">
                    <div><strong>Vous :</strong> ${m.texte} <div class="text-[10px] text-slate-400">${m.date}</div></div>
                    ${reponsesHtml}
                </div>`;
        }
    });
}
</script>
