<!-- Formulaire d'Administration - Section Tuteur mise à jour -->
<div class="mb-3">
    <label class="form-label text-primary fw-bold">Identité du Tuteur</label>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <label for="nomTuteur" class="form-label">NOM TUTEUR *</label>
        <input type="text" class="form-control" id="nomTuteur" placeholder="Ex: Mukendi" required>
    </div>
    <div class="col-md-6">
        <label for="postNomTuteur" class="form-label">POST-NOM TUTEUR</label>
        <input type="text" class="form-control" id="postNomTuteur" placeholder="Ex: Tshiamala">
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-12">
        <label for="prenomTuteur" class="form-label">PRÉNOM TUTEUR *</label>
        <input type="text" class="form-control" id="prenomTuteur" placeholder="Ex: Jean" required>
    </div>
</div>

<!-- Nouveaux champs intégrés : Adresse et E-mail du Tuteur -->
<div class="row mb-3">
    <div class="col-md-6">
        <label for="adresseTuteur" class="form-label">ADRESSE TUTEUR *</label>
        <input type="text" class="form-control" id="adresseTuteur" placeholder="Ex: Av. de la Paix, Kinshasa" required>
    </div>
    <div class="col-md-6">
        <label for="emailTuteur" class="form-label">E-MAIL TUTEUR</label>
        <input type="email" class="form-control" id="emailTuteur" placeholder="Ex: tuteur@example.com">
    </div>
</div>
