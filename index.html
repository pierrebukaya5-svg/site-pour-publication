<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site - Connexion et Données</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- En-tête -->
    <header class="w-full py-6 px-6">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Portail Scolaire RDC</h1>
                    <p class="text-xs text-indigo-300 font-medium">Tableau de Bord Cloud & Gestion</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteneur Principal -->
    <main id="main-container" class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">

        <!-- Vue Connexion / Inscription -->
        <div id="auth-section" class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/20">
            <div class="mb-6 text-center">
                <h2 class="text-2xl font-bold text-slate-900">Espace d'authentification</h2>
                <p class="text-sm text-slate-500 mt-1">Connectez-vous pour synchroniser vos données scolaires.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Adresse email</label>
                    <input type="email" id="user-email" required placeholder="nom@exemple.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition text-sm bg-slate-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Mot de passe</label>
                    <input type="password" id="user-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition text-sm bg-slate-50/50">
                </div>
                
                <div id="auth-error" class="text-xs text-rose-600 font-bold bg-rose-50 p-3 rounded-xl border border-rose-200 hidden"></div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button type="button" id="btn-signup" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold py-3.5 rounded-xl transition text-sm">S'inscrire</button>
                    <button type="button" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm">Se connecter</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Pied de page -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-800/50">
        Mon Site - Connexion et Données &copy; 2026 — Tous droits réservés
    </footer>

    <!-- Logique Firebase Module Moderne avec Vrais Onglets -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpzKHm93AJnwGsqptCBNfmWG0E4m0uJNM",
            authDomain: "site-publication.firebaseapp.com",
            databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
            projectId: "site-publication",
            storageBucket: "site-publication.firebasestorage.app",
            messagingSenderId: "934019778891",
            appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const errBox = document.getElementById('auth-error');

        function afficherErreur(message) {
            if (errBox) {
                errBox.innerText = message;
                errBox.classList.remove('hidden');
            }
        }

        onAuthStateChanged(auth, user => {
            if (user) {
                afficherTableauDeBord(user);
            }
        });

        document.getElementById('btn-signup').addEventListener('click', () => {
            const email = document.getElementById('user-email').value.trim();
            const pass = document.getElementById('user-password').value;

            if (!email || !pass) {
                afficherErreur("Veuillez remplir l'email et le mot de passe.");
                return;
            }

            createUserWithEmailAndPassword(auth, email, pass)
                .catch(error => {
                    afficherErreur("Erreur d'inscription : " + error.message);
                });
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('user-email').value.trim();
            const pass = document.getElementById('user-password').value;

            if (!email || !pass) {
                afficherErreur("Veuillez remplir l'email et le mot de passe.");
                return;
            }

            signInWithEmailAndPassword(auth, email, pass)
                .catch(error => {
                    afficherErreur("Erreur de connexion : " + error.message);
                });
        });

        async function afficherTableauDeBord(user) {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/25">
                    <div class="flex justify-between items-center mb-6 border-b pb-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Bienvenue !</h2>
                            <p class="text-xs text-slate-500 mt-0.5">Connecté (Cloud) : <span class="font-semibold text-indigo-600">${user.email}</span></p>
                        </div>
                        <button id="btn-logout" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-4 py-2 rounded-xl transition text-xs">Se déconnecter</button>
                    </div>

                    <div class="space-y-4 mb-6">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700">Choisissez votre profil (Onglets)</h3>
                        
                        <!-- Vrais Onglets Visuels -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-100 p-1.5 rounded-2xl">
                            <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition shadow-sm bg-indigo-600 text-white" data-role="Élève">Élève</button>
                            <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition text-slate-600 hover:bg-white/60" data-role="Enseignant">Enseignant</button>
                            <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition text-slate-600 hover:bg-white/60" data-role="Parent">Parent</button>
                            <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition text-slate-600 hover:bg-white/60" data-role="Gérant">Gérant</button>
                        </div>
                    </div>

                    <div class="space-y-4 mb-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Informations / Notes / Classe</label>
                            <input type="text" id="user-info" placeholder="Ex: 5ème Année Humanités - Mathématiques" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50">
                        </div>
                        <button id="btn-save" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 text-sm">Enregistrer dans le Cloud</button>
                    </div>

                    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Données en ligne actuelles :</h4>
                        <div id="display-data" class="text-xs text-slate-700 space-y-1">Chargement des données...</div>
                    </div>
                </div>
            `;

            let selectedRole = "Élève";
            const infoInput = document.getElementById('user-info');
            const displayDiv = document.getElementById('display-data');
            const tabButtons = document.querySelectorAll('.tab-btn');

            // Gestion du clic sur les onglets
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    tabButtons.forEach(b => {
                        b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                        b.classList.add('text-slate-600', 'hover:bg-white/60');
                    });
                    btn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
                    btn.classList.remove('text-slate-600', 'hover:bg-white/60');
                    selectedRole = btn.getAttribute('data-role');
                });
            });

            // Charger les données existantes
            try {
                const snapshot = await get(ref(db, 'utilisateurs/' + user.uid));
                const data = snapshot.val();
                if (data) {
                    if (data.role) {
                        selectedRole = data.role;
                        // Activer le bon onglet visuellement
                        tabButtons.forEach(btn => {
                            if (btn.getAttribute('data-role') === data.role) {
                                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
                                btn.classList.remove('text-slate-600', 'hover:bg-white/60');
                            } else {
                                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                                btn.classList.add('text-slate-600', 'hover:bg-white/60');
                            }
                        });
                    }
                    if (data.info) infoInput.value = data.info;
                    displayDiv.innerHTML = `
                        <p><strong>Rôle :</strong> ${data.role}</p>
                        <p><strong>Détails :</strong> ${data.info || 'Aucune information saisie'}</p>
                        <p class="text-slate-400 text-[11px] mt-1">Dernière modification : ${data.derniereMiseAJour}</p>
                    `;
                } else {
                    displayDiv.innerHTML = `<p class="italic text-slate-400">Aucune donnée enregistrée pour le moment.</p>`;
                }
            } catch (error) {
                displayDiv.innerHTML = `<p class="text-rose-500">Erreur de chargement des données.</p>`;
            }

            // Enregistrement
            document.getElementById('btn-save').addEventListener('click', async () => {
                const info = infoInput.value;
                const dateStr = new Date().toLocaleString();

                try {
                    await set(ref(db, 'utilisateurs/' + user.uid), {
                        role: selectedRole,
                        info: info,
                        derniereMiseAJour: dateStr
                    });
                    
                    displayDiv.innerHTML = `
                        <p><strong>Rôle :</strong> ${selectedRole}</p>
                        <p><strong>Détails :</strong> ${info || 'Aucune information saisie'}</p>
                        <p class="text-slate-400 text-[11px] mt-1">Dernière modification : ${dateStr}</p>
                    `;
                    alert("Données enregistrées et synchronisées avec succès !");
                } catch (error) {
                    alert("Erreur d'enregistrement : " + error.message);
                }
            });

            document.getElementById('btn-logout').addEventListener('click', () => {
                signOut(auth).then(() => {
                    location.reload();
                });
            });
        }
    </script>
</body>
</html>
