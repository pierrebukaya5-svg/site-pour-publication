<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>École de la RDC</title>
    <!-- Vos styles CSS ici -->
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
        }
        nav {
            display: flex;
            gap: 1rem;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }
        nav a:hover, nav a.active {
            color: #fff;
            background-color: #3b82f6;
        }
    </style>
</head>
<body>

    <header>
        <!-- Logo et Titre cliquables -->
        <a href="https://ecoler.onrender.com/" target="_blank" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem;">
            <!-- Logo Don Bosco (Écu salésien stylisé) -->
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 5C30 5 10 15 10 35C10 65 30 85 50 95C70 85 90 65 90 35C90 15 70 5 50 5Z" fill="url(#grad-db)" stroke="#facc15" stroke-width="4"/>
                <path d="M50 25L57 40H74L60 50L65 67L50 57L35 67L40 50L26 40H43L50 25Z" fill="#facc15"/>
                <path d="M47 55V72C42 74 38 78 38 82C38 86 43 88 50 88C57 88 62 86 62 82C62 78 58 74 53 72V55H47Z" fill="#ffffff"/>
                <circle cx="50" cy="52" r="4" fill="#ffffff"/>
                <defs>
                    <linearGradient id="grad-db" x1="10" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#2563eb"/>
                        <stop offset="100%" stop-color="#1e1b4b"/>
                    </linearGradient>
                </defs>
            </svg>
            <div style="display: flex; flex-direction: column;">
                <span style="font-size: 1.2rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; line-height: 1.1;">Don Bosco</span>
                <span style="font-size: 0.7rem; font-weight: 600; color: #facc15; text-transform: uppercase; letter-spacing: 1px;">École de la RDC</span>
            </div>
        </a>

        <!-- Navigation visible sur le screenshot -->
        <nav>
            <a href="#accueil">Accueil</a>
            <a href="#parent">Parent</a>
            <a href="#eleve">Élève</a>
            <a href="#prof">Prof</a>
            <a href="#admin" class="active">Admin</a>
        </nav>
    </header>

    <!-- Reste de votre application -->
    <main style="padding: 2rem;">

        <p>Gestion des Présences...</p>
