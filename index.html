<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Administration</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 1.5rem; color: #f8fafc; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
        h2 { font-size: 1.1rem; color: #f8fafc; margin-top: 0; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-eleve { background-color: #10b981; }
        .btn-eleve:hover { background-color: #059669; }
        .btn-prof { background-color: #6366f1; }
        .btn-prof:hover { background-color: #4f46e5; }
        .btn-poste { background-color: #f59e0b; }
        .btn-poste:hover { background-color: #d97706; }
        .btn-cours { background-color: #ec4899; }
        .btn-cours:hover { background-color: #db2777; }
        .footer { text-align: center; margin-top: 40px; color: #64748b; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>Panneau d'Administration</h1>
    <div class="subtitle">Gestion globale de l'établissement scolaire (République Démocratique du Congo)</div>

    <div class="grid">
        <!-- Inscrire un élève -->
        <div class="card">
            <h2>Inscrire un nouvel élève</h2>
            <form onsubmit="event.preventDefault(); alert('Élève inscrit avec succès !');">
                <label>Nom complet</label>
                <input type="text" placeholder="Nom et Prénom" required>
                <label>Classe</label>
                <input type="text" placeholder="Ex: 4ème Scientifique" required>
                <button type="submit" class="btn-eleve">Inscrire l'élève</button>
            </form>
        </div>

        <!-- Ajouter un professeur -->
        <div class="card">
            <h2>Ajouter un professeur</h2>
            <form onsubmit="event.preventDefault(); alert('Professeur ajouté avec succès !');">
                <label>Nom du professeur</label>
                <input type="text" placeholder="Ex: Prof. Kabeya" required>
                <label>Code d'accès (4 chiffres)</label>
                <input type="password" maxlength="4" placeholder="1234" required>
                <button type="submit" class="btn-prof">Créer le compte prof</button>
            </form>
        </div>

        <!-- Ajouter un poste -->
        <div class="card">
            <h2>Ajouter un poste</h2>
            <form onsubmit="event.preventDefault(); alert('Poste ajouté avec succès !');">
                <label>Intitulé du poste</label>
                <input type="text" placeholder="Ex: Préfet, Secrétaire, Surveillant" required>
                <label>Description / Rôle</label>
                <input type="text" placeholder="Ex: Gestion administrative de l'école">
                <button type="submit" class="btn-poste">Enregistrer le poste</button>
            </form>
        </div>

        <!-- Ajouter un cours -->
        <div class="card">
            <h2>Ajouter un cours</h2>
            <form onsubmit="event.preventDefault(); alert('Cours ajouté avec succès !');">
                <label>Nom du cours</label>
                <input type="text" placeholder="Ex: Mathématiques, Informatique" required>
                <label>Coefficient</label>
                <input type="number" placeholder="Ex: 3" min="1" required>
                <button type="submit" class="btn-cours">Créer le cours</button>
            </form>
        </div>
    </div>

    <div class="footer">
        Portail Scolaire RDC &copy; 2026 - République Démocratique du Congo
    </div>
</div>

</body>
</html>
