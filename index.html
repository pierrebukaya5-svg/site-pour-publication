<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion et Inscription - Firebase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #1557b0;
        }
        h2 {
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Formulaire d'Inscription -->
    <div class="container">
        <h2>Créer un compte</h2>
        <input type="email" id="signup-email" placeholder="Votre email">
        <input type="password" id="signup-password" placeholder="Votre mot de passe">
        <button id="signup-btn">S'inscrire</button>
    </div>

    <!-- Formulaire de Connexion -->
    <div class="container">
        <h2>Se connecter</h2>
        <input type="email" id="login-email" placeholder="Votre email">
        <input type="password" id="login-password" placeholder="Votre mot de passe">
        <button id="login-btn">Se connecter</button>
    </div>

    <!-- Script Firebase et logique -->
    <script type="module">
        // Importez les fonctions Firebase nécessaires depuis les CDN officiels
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Vos identifiants de configuration Firebase (récupérez-les dans les paramètres de votre projet Firebase)
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "site-publication.firebaseapp.com",
            databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
            projectId: "site-publication",
            storageBucket: "site-publication.appspot.com",
            messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- GESTION DE L'INSCRIPTION ---
        document.getElementById("signup-btn").addEventListener("click", () => {
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    alert("Compte créé avec succès ! Bienvenue " + user.email);
                })
                .catch((error) => {
                    alert("Erreur lors de l'inscription : " + error.message);
                });
        });

        // --- GESTION DE LA CONNEXION ---
        document.getElementById("login-btn").addEventListener("click", () => {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    alert("Connexion réussie ! Bon retour " + user.email);
                })
                .catch((error) => {
                    alert("Erreur de connexion : " + error.message);
                });
        });
    </script>

</body>
</html>
