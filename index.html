<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Espace Élève Amélioré</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">

    <style>
        :root {
            --md-sys-color-primary: #1a73e8;
            --md-sys-color-primary-container: #d2e3fc;
            --md-sys-color-on-primary-container: #042759;
            --md-sys-color-surface: #ffffff;
            --md-sys-color-surface-variant: #f8f9fa;
            --md-sys-color-on-surface: #202124;
            --md-sys-color-on-surface-variant: #5f6368;
            --md-sys-color-outline: #dadce0;
            --md-sys-color-success: #188038;
            --md-sys-color-warn: #e37400;
            --md-sys-color-error: #d93025;
        }

        body {
            font-family: 'Google Sans', 'Roboto', sans-serif;
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface);
            margin: 0;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            max-width: 1040px;
            margin: 0 auto;
        }

        header {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
            padding: 20px 28px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo {
            background: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        header h1 { margin: 0; font-size: 20px; font-weight: 500; }
        header p { margin: 2px 0 0 0; color: var(--md-sys-color-on-surface-variant); font-size: 13px; }

        .card {
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
            margin-bottom: 20px;
        }

        h2 { 
            margin-top: 0; 
            font-size: 16px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        h2 .material-icons-outlined { color: var(--md-sys-color-primary); font-size: 20px; }
        
        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin-top: 4px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid var(--md-sys-color-outline);
            background: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            box-sizing: border-box;
            font-family: 'Google Sans', sans-serif;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
            box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px 24px;
            border-radius: 20px;
            background: var(--md-sys-color-primary);
            color: white;
            border: none;
            font-family: 'Google Sans', sans-serif;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
        }

        button:hover { background: #1557b0; }

        .user-pill {
            background: var(--md-sys-color-surface-variant);
            border: 1px solid var(--md-sys-color-outline);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Styles spécifiques pour le tableau de bord de l'élève connecté */
        .grid-evaluations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .eval-box {
            background: var(--md-sys-color-surface-variant);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 12px;
            padding: 16px;
        }

        .eval-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .eval-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--md-sys-color-primary);
        }

        .convocation-banner {
            background: #fce8e6;
            border: 1px solid #fad2cf;
            color: var(--md-sys-color-error);
            padding: 14px;
            border-radius: 12px;
            margin-top: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .communique-box {
            background: #e6f4ea;
            border: 1px solid #ceead6;
            color: var(--md-sys-color-success);
            padding: 14px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 13px;
        }

        .table-admin {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }
        .table-admin th, .table-admin td {
            border-bottom: 1px solid var(--md-sys-color-outline);
            padding: 12px 8px;
            text-align: left;
        }
        .table-admin th {
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);
            background-color: var(--md-sys-color-surface-variant);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <header>
            <div class="header-brand">
                <div class="header-logo">
                    <span class="material-icons-outlined">school</span>
                </div>
                <div>
                    <h1>Portail Académique RDC</h1>
                    <p>Plateforme institutionnelle sécurisée</p>
                </div>
            </div>
            <div id="auth-status" class="user-pill">Visiteur / Élève</div>
        </header>

        <!-- ESPACE CONSULTATION ÉLÈVE AVEC COTATIONS & CONVOCATION -->
        <div class="card" style="max-width: 800px; margin: 0 auto 20px auto;">
            <h2><span class="material-icons-outlined">person_search</span> Espace Consultation Élève (Notes & Profil)</h2>
            <label for="recherche-matricule">Entrez votre Matricule</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="recherche-matricule" placeholder="Ex: BUKAP6AB7HJL" style="margin: 0; text-transform: uppercase;">
                <button onclick="rechercherEleve()" style="width: 140px; margin: 0;">Consulter</button>
            </div>
            
            <div id="resultat-eleve" style="margin-top: 20px; font-size: 13px;"></div>
        </div>

        <!-- AUTHENTIFICATION ADMIN -->
        <div class="card" style="max-width: 480px; margin: 0 auto 24px auto;">
            <h2><span class="material-icons-outlined">admin_panel_settings</span> Administration</h2>
            <div id="login-section">
                <label for="admin-email">Adresse e-mail</label>
                <input type="email" id="admin-email" placeholder="admin@ecole.cd">
                <label for="admin-password">Mot de passe</label>
                <input type="password" id="admin-password" placeholder="••••••••">
                <button onclick="connecterAdmin()">Se connecter</button>
            </div>
            <div id="admin-info-connecte" style="display: none; text-align: center;">
                <p style="color: var(--md-sys-color-success); font-weight: 500; font-size: 13px; margin-bottom: 16px;">Connecté en tant qu'administrateur</p>
                <button onclick="deconnecterAdmin()" style="background: transparent; border: 1px solid var(--md-sys-color-outline); color: var(--md-sys-color-on-surface); width: auto; padding: 6px 16px;">Fermer la session</button>
            </div>
        </div>

        <!-- TABLEAU DE BORD ADMIN POUR GÉRER LES NOTES & CONVOCATIONS -->
        <div id="admin-dashboard" style="display: none;">
            <div class="card" style="max-width: 700px; margin: 0 auto 20px auto;">
                <h2><span class="material-icons-outlined">edit_note</span> Gestion des Notes, Devoirs & Convocations</h2>
                
                <label>Matricule de l'élève concerné</label>
                <input type="text" id="adm-eleve-matricule" placeholder="Ex: BUKAP6AB7HJL" style="text-transform: uppercase;">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div>
                        <label>Cours / Matière</label>
                        <input type="text" id="adm-cours" placeholder="Ex: Mathématiques">
                    </div>
                    <div>
                        <label>Type de Cotation</label>
                        <select id="adm-type" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--md-sys-color-outline); margin-bottom: 16px; background: white;">
                            <option value="Interrogation">Interrogation (/20)</option>
                            <option value="Devoir">Devoir (/20)</option>
                            <option value="Examen">Examen (/100)</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div>
                        <label>Note / Cotation</label>
                        <input type="text" id="adm-note" placeholder="Ex: 16.5">
                    </div>
                    <div>
                        <label>Statut Convocation (Optionnel)</label>
                        <select id="adm-convocation" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--md-sys-color-outline); margin-bottom: 16px; background: white;">
                            <option value="Aucune">Aucune convocation</option>
                            <option value="Convoqué(e) à la Direction">Convoqué(e) à la Direction</option>
                        </select>
                    </div>
                </div>

                <button onclick="enregistrerCotation()">Enregistrer la Cotation / Suivi</button>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDpzKHm93AJnwGsqptCBNfmWG0E4m0uJNM",
            authDomain: "site-publication.firebaseapp.com",
            databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
            projectId: "site-publication",
            storageBucket: "site-publication.firebasestorage.app",
            messagingSenderId: "934019778891",
            appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            const loginSection = document.getElementById('login-section');
            const infoConnecte = document.getElementById('admin-info-connecte');
            const dashboard = document.getElementById('admin-dashboard');
            const status = document.getElementById('auth-status');

            if (user) {
                status.innerText = "Session : Administrateur";
                loginSection.style.display = 'none';
                infoConnecte.style.display = 'block';
                dashboard.style.display = 'block';
            } else {
                status.innerText = "Visiteur / Élève";
                loginSection.style.display = 'block';
                infoConnecte.style.display = 'none';
                dashboard.style.display = 'none'; 
            }
        });

        function connecterAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value.trim();
            auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Erreur : " + err.message));
        }

        function deconnecterAdmin() {
            auth.signOut();
        }

        function rechercherEleve() {
            const matriculeRecherche = document.getElementById('recherche-matricule').value.trim().toUpperCase();
            const resultatDiv = document.getElementById('resultat-eleve');

            if (!matriculeRecherche) {
                resultatDiv.innerHTML = '<span style="color: var(--md-sys-color-error);">Veuillez entrer un matricule.</span>';
                return;
            }

            resultatDiv.innerHTML = "Recherche du dossier et des cotations...";

            // 1. Chercher l'élève dans la table 'eleves'
            db.ref('eleves').once('value', (snapshot) => {
                let eleveData = null;
                snapshot.forEach((child) => {
                    const e = child.val();
                    if (e.matricule === matriculeRecherche) {
                        eleveData = e;
                    }
                });

                if (!eleveData) {
                    resultatDiv.innerHTML = '<span style="color: var(--md-sys-color-error);">Aucun élève trouvé avec ce matricule.</span>';
                    return;
                }

                // 2. Charger les cotations de cet élève
                db.ref('cotations').orderByChild('matricule').equalTo(matriculeRecherche).once('value', (cotSnapshot) => {
                    let evaluationsHTML = '';
                    let convocationMsg = '';
                    
                    if (cotSnapshot.exists()) {
                        cotSnapshot.forEach((cotChild) => {
                            const c = cotChild.val();
                            evaluationsHTML += `
                                <div class="eval-box">
                                    <div class="eval-title"><span class="material-icons-outlined">menu_book</span> ${c.cours} (${c.type})</div>
                                    <div class="eval-value">${c.note}</div>
                                </div>
                            `;
                            if (c.convocation && c.convocation !== "Aucune") {
                                convocationMsg = `
                                    <div class="convocation-banner">
                                        <span class="material-icons-outlined">warning</span>
                                        <strong>Attention :</strong> ${c.convocation}
                                    </div>
                                `;
                            }
                        });
                    } else {
                        evaluationsHTML = '<p style="color: var(--md-sys-color-on-surface-variant); grid-column: span 2;">Aucune cotation enregistrée pour le moment.</p>';
                    }

                    resultatDiv.innerHTML = `
                        <div style="background: var(--md-sys-color-surface-variant); padding: 18px; border-radius: 12px; border: 1px solid var(--md-sys-color-outline);">
                            <p style="margin: 0 0 4px 0; color: var(--md-sys-color-success); font-weight: 500;">✓ Dossier validé</p>
                            <h3 style="margin: 8px 0; font-size: 18px;">${eleveData.nom} ${eleveData.postnom} ${eleveData.prenom}</h3>
                            <p style="margin: 4px 0; color: var(--md-sys-color-on-surface-variant);">Classe : ${eleveData.classe} | Matricule : <strong>${eleveData.matricule}</strong></p>
                            
                            ${convocationMsg}

                            <h4 style="margin: 20px 0 8px 0; font-size: 14px; font-weight: 500;">Cotations (Interrogations, Devoirs, Examens) :</h4>
                            <div class="grid-evaluations">
                                ${evaluationsHTML}
                            </div>

                            <div class="communique-box" style="margin-top: 16px;">
                                <strong>Communiqué officiel de l'école :</strong> Le paiement des frais scolaires du 2e trimestre se clôture ce vendredi. Veuillez vous mettre en ordre.
                            </div>
                        </div>
                    `;
                });
            });
        }

        function enregistrerCotation() {
            const matricule = document.getElementById('adm-eleve-matricule').value.trim().toUpperCase();
            const cours = document.getElementById('adm-cours').value.trim();
            const type = document.getElementById('adm-type').value;
            const note = document.getElementById('adm-note').value.trim();
            const convocation = document.getElementById('adm-convocation').value;

            if (!matricule || !cours || !note) {
                alert("Veuillez remplir le matricule, le cours et la note.");
                return;
            }

            db.ref('cotations').push({
                matricule,
                cours,
                type,
                note,
                convocation
            }).then(() => {
                alert("Cotation et suivi enregistrés avec succès !");
                document.getElementById('adm-eleve-matricule').value = '';
                document.getElementById('adm-cours').value = '';
                document.getElementById('adm-note').value = '';
            }).catch(err => {
                alert("Erreur : " + err.message);
            });
        }
    </script>
</body>
</html>
