<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Firebase</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin-bottom: 20px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #1a73e8; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1557b0; }
        #app-content { display: none; }
    </style>
</head>
<body>

    <!-- ÉCRAN DE CONNEXION / INSCRIPTION -->
    <div id="auth-screen">
        <div class="box">
            <h2>Créer un compte</h2>
            <input type="email" id="signup-email" placeholder="Votre email">
            <input type="password" id="signup-password" placeholder="Votre mot de passe">
            <button id="signup-btn">S'inscrire</button>
        </div>

        <div class="box">
            <h2>Se connecter</h2>
            <input type="email" id="login-email" placeholder="Votre email">
            <input type="password" id="login-password" placeholder="Votre mot de passe">
            <button id="login-btn">Se connecter</button>
        </div>
    </div>

    <!-- ÉCRAN PRINCIPAL (Une fois connecté) -->
    <div id="app-content" class="box">
        <h2>Bienvenue !</h2>
        <p id="user-info"></p>
        <button id="save-data-btn" style="background-color: #28a745;">Enregistrer mes données</button>
        <button id="logout-btn" style="background-color: #dc3545;">Se déconnecter</button>
    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getDatabase, 
            ref, 
            set 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Vos identifiants officiels Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDpzKHm93AJnwGsqptCBNfmWG0E4m0uJNM",
          authDomain: "site-publication.firebaseapp.com",
          databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
          projectId: "site-publication",
          storageBucket: "site-publication.firebasestorage.app",
          messagingSenderId: "934019778891",
          appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const authScreen = document.getElementById("auth-screen");
        const appContent = document.getElementById("app-content");
        const userInfo = document.getElementById("user-info");

        // Gérer l'affichage selon si l'utilisateur est connecté ou non
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.style.display = "none";
                appContent.style.display = "block";
                userInfo.innerText = "Connecté avec : " + user.email;
            } else {
                authScreen.style.display = "block";
                appContent.style.display = "none";
            }
        });

        // Inscription
        document.getElementById("signup-btn").addEventListener("click", () => {
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;

            createUserWithEmailAndPassword(auth, email, password)
                .then(() => alert("Compte créé avec succès !"))
                .catch((error) => alert("Erreur : " + error.message));
        });

        // Connexion
        document.getElementById("login-btn").addEventListener("click", () => {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => alert("Erreur de connexion : " + error.message));
        });

        // Enregistrer des données dans la base sous l'ID sécurisé de l'utilisateur
        document.getElementById("save-data-btn").addEventListener("click", () => {
            const user = auth.currentUser;
            if (user) {
                const userRef = ref(db, 'users/' + user.uid);
                set(userRef, {
                    email: user.email,
                    derniereConnexion: new Date().toISOString()
                }).then(() => {
                    alert("Données enregistrées dans votre espace !");
                }).catch((error) => {
                    alert("Erreur : " + error.message);
                });
            }
        });

        // Déconnexion
        document.getElementById("logout-btn").addEventListener("click", () => {
            signOut(auth);
        });
    </script>

</body>
</html>
