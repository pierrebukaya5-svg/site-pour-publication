<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Accueil</title>
    <!-- Tailwind CSS pour le design -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- En-tête -->
        <header class="bg-white shadow-sm rounded-2xl p-4 mb-6 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800">Portail Académique RDC</h1>
                    <p class="text-xs text-slate-500">Plateforme institutionnelle</p>
                </div>
            </div>
            <div>
                <button onclick="afficherEspaceAdmin()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-medium transition">
                    Espace Administration
                </button>
            </div>
        </header>

        <!-- Contenu Principal -->
        <main id="main-content" class="bg-white shadow-sm rounded-2xl p-6">
            <div id="vue-accueil">
                <h2 class="text-xl font-semibold mb-4">Bienvenue sur le portail</h2>
                <p class="text-slate-600 mb-6">Veuillez sélectionner votre espace pour continuer :</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button onclick="afficherEspaceEleve()" class="p-6 border border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50/50 transition text-left group">
                        <h3 class="font-bold text-blue-600 group-hover:underline text-lg mb-1">Espace Élève</h3>
                        <p class="text-sm text-slate-500">Consultez vos notes, bulletins et convocations avec votre matricule.</p>
                    </button>
                    <button onclick="afficherEspaceEnseignant()" class="p-6 border border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50/50 transition text-left group">
                        <h3 class="font-bold text-blue-600 group-hover:underline text-lg mb-1">Espace Enseignant</h3>
                        <p class="text-sm text-slate-500">Gérez les évaluations et saisissez les notes des étudiants.</p>
                    </button>
                </div>
            </div>

            <!-- Vue Sécurité Admin (comme sur la capture) -->
            <div id="vue-admin-secu" class="hidden">
                <button onclick="retourAccueil()" class="text-sm text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-6">
                    ← Retour à l'accueil
                </button>
                <div class="border border-slate-200 rounded-xl p-6">
                    <h3 class="font-bold text-lg mb-2 flex items-center gap-2">
                        🔒 Sécurité Administrateur
                    </h3>
                    <p class="text-sm text-slate-500 mb-4">Veuillez entrer le code d'accès maître administrateur pour déverrouiller la gestion :</p>
                    
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Code Maître Admin</label>
                    <input type="password" id="code-maitre-input" class="w-full bg-slate-900 text-white p-3 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••••••">
                    
                    <button onclick="verifierCodeAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition">
                        Déverrouiller la session admin
                    </button>
                    <p id="message-erreur" class="text-red-500 text-sm mt-3 hidden"></p>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts Firebase et Logique -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuration Firebase fournie
        const firebaseConfig = {
          apiKey: "AIzaSyDpzKHm93AJnwGsqptCBNfmWG0E4m0uJNM",
          authDomain: "site-publication.firebaseapp.com",
          databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
          projectId: "site-publication",
          storageBucket: "site-publication.firebasestorage.app",
          messagingSenderId: "934019778891",
          appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        console.log("Firebase initialisé avec succès !");

        // Fonctions de navigation globale rattachées à window pour fonctionner avec les balises onclick HTML
        window.afficherEspaceAdmin = function() {
            document.getElementById('vue-accueil').classList.add('hidden');
            document.getElementById('vue-admin-secu').classList.remove('hidden');
        }

        window.retourAccueil = function() {
            document.getElementById('vue-admin-secu').classList.add('hidden');
            document.getElementById('vue-accueil').classList.remove('hidden');
        }

        window.afficherEspaceEleve = function() {
            alert("Espace Élève en cours de chargement...");
        }

        window.afficherEspaceEnseignant = function() {
            alert("Espace Enseignant en cours de chargement...");
        }

        window.verifierCodeAdmin = async function() {
            const code = document.getElementById('code-maitre-input').value;
            const messageErreur = document.getElementById('message-erreur');
            
            if (!code) {
                if(messageErreur) {
                    messageErreur.textContent = "Veuillez entrer un code.";
                    messageErreur.classList.remove('hidden');
                } else {
                    alert("Veuillez entrer un code.");
                }
                return;
            }

            try {
                // Vous pouvez adapter ici la vérification avec votre base de données Realtime Database
                const codeRef = ref(db, 'config/codeMaitre');
                const snapshot = await get(codeRef);
                
                if (snapshot.exists()) {
                    if (code === snapshot.val()) {
                        alert("Accès administrateur autorisé !");
                        if(messageErreur) messageErreur.classList.add('hidden');
                    } else {
                        if(messageErreur) {
                            messageErreur.textContent = "Code maître incorrect.";
                            messageErreur.classList.remove('hidden');
                        } else {
                            alert("Code incorrect.");
                        }
                    }
                } else {
                    // Si la base est vide, code par défaut de secours
                    if (code === "1234") {
                        alert("Connexion réussie avec le code par défaut.");
                    } else {
                        if(messageErreur) {
                            messageErreur.textContent = "Code incorrect ou non configuré.";
                            messageErreur.classList.remove('hidden');
                        }
                    }
                }
            } catch (error) {
                console.error("Erreur Firebase :", error);
                alert("Erreur de connexion à la base de données.");
            }
        }
    </script>
</body>
</html>
