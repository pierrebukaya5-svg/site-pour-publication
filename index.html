<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Administration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Style unifié pour les fonds d'icônes 2026 */
        .icon-badge-2026 {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.15);
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.08);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-100 w-full max-w-4xl rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- En-tête du Tableau de Bord -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-300 pb-4">
            <div class="flex items-center gap-3">
                <!-- Icône avec le fond unifié 2026 -->
                <div class="icon-badge-2026">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Tableau de Bord – Administration</h1>
                    <p class="text-sm text-gray-500">Gestion complète des élèves et professeurs</p>
                </div>
            </div>
            <button class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium hover:bg-gray-50 shadow-sm transition">
                Déconnexion Admin
            </button>
        </div>

        <!-- Navigation par Onglets -->
        <div class="flex gap-3">
            <!-- Onglet Actif avec style 2026 -->
            <button class="flex items-center gap-2 bg-indigo-600 text-white px-5 py-2.5 rounded-2xl shadow-md font-medium text-sm transition">
                <div class="bg-white/20 p-1.5 rounded-lg">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </div>
                Élèves & Parents
            </button>
            <!-- Onglet Inactif -->
            <button class="flex items-center gap-2 bg-white text-gray-700 border border-gray-300 px-5 py-2.5 rounded-2xl shadow-sm font-medium text-sm hover:bg-gray-50 transition">
                <div class="bg-gray-100 p-1.5 rounded-lg text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                </div>
                Professeurs
            </button>
        </div>

        <!-- Section Formulaire -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 space-y-4">
            <h2 class="text-base font-bold text-gray-800">Enregistrer un Élève & ses Tuteurs</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" placeholder="Nom" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500" value="bukaya">
                <input type="text" placeholder="Post-nom" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500" value="kambondji">
                <input type="text" placeholder="Prénom" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500" value="pierre">
                <input type="text" placeholder="Classe (ex: 6ème)" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500" value="6">
                <input type="text" placeholder="Nom complet du tuteur" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500" value="isabelle">
                <input type="text" placeholder="Téléphone du tuteur" class="bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500" value="08999827637">
            </div>
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-xl shadow-lg shadow-indigo-600/20 text-sm transition">
                Enregistrer l'élève & Générer son matricule
            </button>
        </div>

        <!-- Section Liste -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 space-y-4">
            <h2 class="text-base font-bold text-gray-800">Liste des Élèves & Gestion d'Accès</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="border-b border-gray-200 text-xs uppercase text-gray-400">
                        <tr>
                            <th class="pb-3 font-semibold">Matricule</th>
                            <th class="pb-3 font-semibold">Identité Élève</th>
                            <th class="pb-3 font-semibold">Classe</th>
                            <th class="pb-3 font-semibold">Tuteur Légal</th>
                            <th class="pb-3 font-semibold">Statut Frais</th>
                            <th class="pb-3 font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-100">
                            <td class="py-4 font-semibold text-indigo-600">12345</td>
                            <td class="py-4 font-medium text-gray-800">bukaya kambondji pierre</td>
                            <td class="py-4">6</td>
                            <td class="py-4">isabelle<br><span class="text-xs text-gray-400">08999827637</span></td>
                            <td class="py-4">
                                <span class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-600 border border-emerald-200 px-3 py-1 rounded-full text-xs font-medium">
                                    ✓ En Ordre
                                </span>
                            </td>
                            <td class="py-4">
                                <button class="text-red-500 hover:text-red-700 font-medium text-xs">Supprimer</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
