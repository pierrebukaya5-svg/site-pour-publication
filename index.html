<!-- Formulaire disponible uniquement sur l'Espace Enseignant -->
<div class="card p-3 my-3">
  <h4>Publier une nouvelle leçon</h4>
  <form id="form-cours">
    <input type="text" id="titre-cours" class="form-control mb-2" placeholder="Titre du cours" required>
    <input type="text" id="matiere-cours" class="form-control mb-2" placeholder="Matière (ex: Mathématiques)" required>
    <input type="url" id="url-pdf" class="form-control mb-2" placeholder="Lien du fichier PDF (ex: Google Drive, Cloudinary...)" required>
    <button type="submit" class="btn btn-primary">Publier la leçon</button>
  </form>
</div>

<script>
  // Script pour enregistrer la leçon dans Firebase
  document.getElementById('form-cours').addEventListener('submit', function(e) {
    e.preventDefault();

    const titre = document.getElementById('titre-cours').value;
    const matiere = document.getElementById('matiere-cours').value;
    const urlPdf = document.getElementById('url-pdf').value;

    // Référence vers la collection cours
    const coursRef = firebase.database().ref('cours');
    
    coursRef.push({
      titre: titre,
      matiere: matiere,
      fichier_url: urlPdf,
      date: new Date().toLocaleDateString('fr-FR')
    }).then(() => {
      alert('Leçon publiée avec succès !');
      document.getElementById('form-cours').reset();
    }).catch(error => {
      console.error("Erreur d'enregistrement : ", error);
    });
  });
</script>
