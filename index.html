<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Scolaire RDC - Gestion Multi-Rôles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- En-tête -->
    <header class="w-full py-6 px-6">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Portail Scolaire RDC</h1>
                    <p class="text-xs text-indigo-300 font-medium">Système Multi-Rôles par Matricules</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteneur Principal -->
    <main id="main-container" class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">

        <!-- Étape 1 : Connexion ou Ajout de rôle -->
        <div id="auth-section" class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/20">
            <div class="mb-6 text-center">
                <h2 class="text-2xl font-bold text-slate-900">Connexion au Portail</h2>
                <p class="text-sm text-slate-500 mt-1">Sélectionnez le rôle que vous souhaitez activer pour votre compte.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Rôles souhaités</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 bg-slate-100 p-1.5 rounded-2xl" id="tab-container">
                        <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition shadow-sm bg-indigo-600 text-white" data-role="Gérant">Gérant</button>
                        <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition text-slate-600 hover:bg-white/60" data-role="Enseignant">Enseignant</button>
                        <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition text-slate-600 hover:bg-white/60" data-role="Élève">Élève</button>
                        <button type="button" class="tab-btn py-2.5 px-3 rounded-xl font-semibold text-xs transition text-slate-600 hover:bg-white/60" data-role="Parent">Parent</button>
                    </div>
                </div>

                <!-- Champ dynamique pour le cours de l'enseignant -->
                <div id="cours-field-container" class="hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Votre Cours Affilié (ex: Mathématiques)</label>
                    <input type="text" id="user-cours" placeholder="Nom de votre cours" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition text-sm bg-slate-50/50">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Adresse email</label>
                    <input type="email" id="user-email" required placeholder="nom@exemple.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition text-sm bg-slate-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Mot de passe</label>
                    <input type="password" id="user-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-600 focus:outline-none transition text-sm bg-slate-50/50">
                </div>
                
                <div id="auth-error" class="text-xs text-rose-600 font-bold bg-rose-50 p-3 rounded-xl border border-rose-200 hidden"></div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button type="button" id="btn-signup" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-semibold py-3.5 rounded-xl transition text-sm">Créer / Ajouter ce rôle</button>
                    <button type="button" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 text-sm">Se connecter</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Pied de page -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-800/50">
        Portail Scolaire RDC &copy; 2026 — Tous droits réservés
    </footer>

    <!-- Logique Firebase & Application -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getDatabase, ref, set, get, push, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpzKHm93AJnwGsqptCBNfmWG0E4m0uJNM",
            authDomain: "site-publication.firebaseapp.com",
            databaseURL: "https://site-publication-default-rtdb.firebaseio.com",
            projectId: "site-publication",
            storageBucket: "site-publication.firebasestorage.app",
            messagingSenderId: "934019778891",
            appId: "1:934019778891:web:0a63eab2d542607a2a80ce"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const errBox = document.getElementById('auth-error');
        let selectedRole = "Gérant";

        const tabButtons = document.querySelectorAll('.tab-btn');
        const coursContainer = document.getElementById('cours-field-container');

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    b.classList.add('text-slate-600', 'hover:bg-white/60');
                });
                btn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
                btn.classList.remove('text-slate-600', 'hover:bg-white/60');
                selectedRole = btn.getAttribute('data-role');

                // Afficher le champ "Cours" uniquement si le rôle Enseignant est sélectionné
                if (selectedRole === "Enseignant") {
                    coursContainer.classList.remove('hidden');
                } else {
                    coursContainer.classList.add('hidden');
                }
            });
        });

        function afficherErreur(message) {
            if (errBox) {
                errBox.innerText = message;
                errBox.classList.remove('hidden');
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userSnap = await get(ref(db, 'comptes/' + user.uid));
                if (userSnap.exists()) {
                    const userData = userSnap.val();
                    const rolesAutorises = userData.roles || { [userData.role]: true };
                    choisirOuAfficherEspace(user, rolesAutorises, userData);
                }
            }
        });

        document.getElementById('btn-signup').addEventListener('click', async () => {
            const email = document.getElementById('user-email').value.trim();
            const pass = document.getElementById('user-password').value;
            const cours = document.getElementById('user-cours').value.trim();

            if (!email || !pass) {
                afficherErreur("Veuillez remplir tous les champs obligatoires.");
                return;
            }

            if (selectedRole === "Enseignant" && !cours) {
                afficherErreur("Veuillez indiquer le cours affilié pour votre rôle d'enseignant.");
                return;
            }

            try {
                let user;
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    user = cred.user;
                    let dataCompte = { email, roles: { [selectedRole]: true } };
                    if (selectedRole === "Enseignant") dataCompte.cours = cours;

                    await set(ref(db, 'comptes/' + user.uid), dataCompte);
                    alert("Compte créé avec succès avec le rôle : " + selectedRole);
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') {
                        const cred = await signInWithEmailAndPassword(auth, email, pass);
                        user = cred.user;
                        let updates = { [`roles/${selectedRole}`]: true };
                        if (selectedRole === "Enseignant") updates.cours = cours;

                        await update(ref(db, 'comptes/' + user.uid), updates);
                        alert("Le rôle '" + selectedRole + "' a été ajouté avec succès à votre compte !");
                        location.reload();
                    } else {
                        throw err;
                    }
                }
            } catch (error) {
                afficherErreur("Erreur : " + error.message);
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('user-email').value.trim();
            const pass = document.getElementById('user-password').value;

            if (!email || !pass) {
                afficherErreur("Veuillez remplir tous les champs.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                afficherErreur("Erreur de connexion : " + error.message);
            }
        });

        function choisirOuAfficherEspace(user, rolesObj, userData) {
            const listeRoles = Object.keys(rolesObj);
            
            if (listeRoles.length > 1) {
                let roleActif = localStorage.getItem('role_actif_' + user.uid) || listeRoles[0];
                if (!rolesObj[roleActif]) roleActif = listeRoles[0];
                
                afficherTableauDeBordMulti(user, listeRoles, roleActif, userData);
            } else {
                afficherTableauDeBordMulti(user, listeRoles, listeRoles[0], userData);
            }
        }

        async function afficherTableauDeBordMulti(user, listeRoles, roleActif, userData) {
            const container = document.getElementById('main-container');

            let optionsHtml = "";
            listeRoles.forEach(r => {
                optionsHtml += `<button class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${r === roleActif ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}" onclick="localStorage.setItem('role_actif_${user.uid}', '${r}'); location.reload();">${r}</button>`;
            });

            let contenuHtml = `
                <div class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/25">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 border-b pb-4 gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">Espace ${roleActif}</h2>
                            <p class="text-xs text-slate-500 mt-0.5">Connecté : <span class="font-semibold text-indigo-600">${user.email}</span> ${userData.cours ? `| Cours : <span class="font-semibold text-emerald-600">${userData.cours}</span>` : ''}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex gap-1.5 items-center bg-slate-50 p-1 rounded-xl border">
                                <span class="text-[10px] uppercase font-bold text-slate-400 pl-2">Vos rôles :</span>
                                ${optionsHtml}
                            </div>
                            <button id="btn-logout" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold px-3 py-2 rounded-xl transition text-xs">Déconnexion</button>
                        </div>
                    </div>
            `;

            if (roleActif === "Gérant") {
                contenuHtml += `
                    <div class="space-y-6">
                        <div class="bg-indigo-50/50 p-5 rounded-2xl border border-indigo-100">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-indigo-900 mb-3">Enregistrer un nouvel élève (Générer un matricule)</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                                <input type="text" id="eleve-nom" placeholder="Nom" class="px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                                <input type="text" id="eleve-postnom" placeholder="Post-nom" class="px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                                <input type="text" id="eleve-classe" placeholder="Classe & Option (ex: 5ème Math)" class="px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
                            </div>
                            <button id="btn-creer-eleve" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md text-sm">Générer le Matricule & Enregistrer</button>
                        </div>

                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-700 mb-3">Liste des élèves enregistrés et leurs matricules</h3>
                            <div id="liste-eleves" class="bg-slate-50 rounded-2xl p-4 border border-slate-200 max-h-60 overflow-y-auto space-y-2 text-xs">
                                Chargement des élèves...
                            </div>
                        </div>
                    </div>
                `;
            } else if (roleActif === "Enseignant") {
                const coursProf = userData.cours || "Mon Cours";
                contenuHtml += `
                    <div class="space-y-6">
                        <div class="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-emerald-900 mb-2">Saisie des notes pour votre cours : <span class="underline">${coursProf}</span></h3>
                            <p class="text-xs text-slate-500 mb-4">Sélectionnez la classe par onglet, puis choisissez un élève dans la liste pour lui attribuer une note.</p>

                            <!-- Conteneur des onglets de classes -->
                            <div id="onglets-classes" class="flex flex-wrap gap-2 mb-4 pb-2 border-b border-emerald-200">
                                <span class="text-xs text-slate-400 italic">Chargement des classes...</span>
                            </div>

                            <!-- Zone d'affichage des élèves de la classe sélectionnée -->
                            <div id="zone-eleves-classe" class="bg-white p-4 rounded-2xl border border-emerald-200 mb-4 max-h-60 overflow-y-auto space-y-2">
                                <p class="text-xs text-slate-400 italic">Veuillez sélectionner une classe ci-dessus.</p>
                            </div>

                            <!-- Formulaire de saisie pour l'élève sélectionné -->
                            <div id="form-saisie-note" class="bg-white p-4 rounded-2xl border border-emerald-200 hidden space-y-3">
                                <div class="text-xs font-bold text-emerald-800" id="selection-eleve-info">Élève sélectionné : Aucun</div>
                                <input type="hidden" id="selected-matricule">
                                <input type="text" id="note-valeur" placeholder="Saisir la note ou résultat (ex: 16/20 - Interrogation 1)" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-slate-50">
                                <button id="btn-publier-note" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition shadow text-xs">Enregistrer la note pour ${coursProf}</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                contenuHtml += `
                    <div class="space-y-6">
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-800 mb-3">Consulter les résultats scolaires (${roleActif})</h3>
                            <div class="flex gap-2 mb-4">
                                <input type="text" id="consult-matricule" placeholder="Entrez le matricule de l'enfant" class="flex-grow px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white font-mono">
                                <button id="btn-chercher-notes" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition text-sm">Rechercher</button>
                            </div>
                            <div id="resultats-affichage" class="p-4 bg-white rounded-xl border border-slate-200 text-xs text-slate-700 min-h-[80px]">
                                Entrez un matricule valide pour voir les résultats.
                            </div>
                        </div>
                    </div>
                `;
            }

            contenuHtml += `</div>`;
            container.innerHTML = contenuHtml;

            document.getElementById('btn-logout').addEventListener('click', () => {
                localStorage.removeItem('role_actif_' + user.uid);
                signOut(auth).then(() => { location.reload(); });
            });

            if (roleActif === "Gérant") {
                const chargerEleves = async () => {
                    const snap = await get(ref(db, 'eleves'));
                    const listeDiv = document.getElementById('liste-eleves');
                    if (snap.exists()) {
                        let html = "";
                        snap.forEach(child => {
                            const e = child.val();
                            html += `<div class="p-2.5 bg-white rounded-xl border border-slate-200 flex justify-between items-center">
                                <div><strong>${e.nom} ${e.postnom}</strong> - <span class="text-indigo-600">${e.classe}</span></div>
                                <div class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg font-mono font-bold">${e.matricule}</div>
                            </div>`;
                        });
                        listeDiv.innerHTML = html;
                    } else {
                        listeDiv.innerHTML = `<p class="text-slate-400 italic">Aucun élève enregistré.</p>`;
                    }
                };
                chargerEleves();

                document.getElementById('btn-creer-eleve').addEventListener('click', async () => {
                    const nom = document.getElementById('eleve-nom').value.trim();
                    const postnom = document.getElementById('eleve-postnom').value.trim();
                    const classe = document.getElementById('eleve-classe').value.trim();

                    if (!nom || !postnom || !classe) {
                        alert("Veuillez remplir le nom, post-nom et la classe/option.");
                        return;
                    }

                    const randomCode = Math.floor(1000 + Math.random() * 9000);
                    const matriculeNettoye = `${nom.substring(0,3).toUpperCase()}-${postnom.substring(0,3).toUpperCase()}-${classe.substring(0,3).toUpperCase()}-${randomCode}`;

                    try {
                        const newRef = push(ref(db, 'eleves'));
                        await set(newRef, { nom, postnom, classe, matricule: matriculeNettoye });
                        alert("Élève enregistré avec succès ! Matricule généré : " + matriculeNettoye);
                        document.getElementById('eleve-nom').value = "";
                        document.getElementById('eleve-postnom').value = "";
                        document.getElementById('eleve-classe').value = "";
                        chargerEleves();
                    } catch (err) {
                        alert("Erreur : " + err.message);
                    }
                });
            }

            if (roleActif === "Enseignant") {
                const snapEleves = await get(ref(db, 'eleves'));
                const ongletsContainer = document.getElementById('onglets-classes');
                const zoneEleves = document.getElementById('zone-eleves-classe');
                const formSaisie = document.getElementById('form-saisie-note');
                const infoSelection = document.getElementById('selection-eleve-info');
                const inputMatriculeCache = document.getElementById('selected-matricule');

                let elevesParClasse = {};

                if (snapEleves.exists()) {
                    snapEleves.forEach(child => {
                        const e = child.val();
                        const classeNom = e.classe || "Non classé";
                        if (!elevesParClasse[classeNom]) {
                            elevesParClasse[classeNom] = [];
                        }
                        elevesParClasse[classeNom].push(e);
                    });

                    const classes = Object.keys(elevesParClasse);
                    if (classes.length > 0) {
                        let htmlOnglets = "";
                        classes.forEach((cls, index) => {
                            htmlOnglets += `<button type="button" class="tab-classe px-3 py-1.5 rounded-xl font-semibold text-xs transition bg-white text-emerald-700 border border-emerald-200 hover:bg-emerald-600 hover:text-white shadow-sm" data-classe="${cls}">${cls}</button>`;
                        });
                        ongletsContainer.innerHTML = htmlOnglets;

                        // Gestion des clics sur les onglets de classes
                        document.querySelectorAll('.tab-classe').forEach(btn => {
                            btn.addEventListener('click', (e) => {
                                document.querySelectorAll('.tab-classe').forEach(b => b.classList.remove('bg-emerald-600', 'text-white'));
                                btn.classList.add('bg-emerald-600', 'text-white');

                                const classeChoisie = btn.getAttribute('data-classe');
                                const listeElevesDeClasse = elevesParClasse[classeChoisie];

                                let htmlEleves = `<p class="text-xs font-bold text-slate-700 mb-2">Élèves de la classe : ${classeChoisie}</p><div class="space-y-1.5">`;
                                listeElevesDeClasse.forEach(el => {
                                    htmlEleves += `
                                        <div class="p-2 bg-slate-50 hover:bg-emerald-50 rounded-xl border border-slate-200 flex justify-between items-center cursor-pointer transition select-eleve" data-matricule="${el.matricule}" data-nom="${el.nom} ${el.postnom}">
                                            <div><strong>${el.nom} ${el.postnom}</strong></div>
                                            <div class="text-[11px] text-indigo-600 font-mono font-bold bg-white px-2 py-0.5 rounded border">${el.matricule}</div>
                                        </div>
                                    `;
                                });
                                htmlEleves += `</div>`;
                                zoneEleves.innerHTML = htmlEleves;
                                formSaisie.classList.add('hidden'); // Cacher le formulaire tant qu'on ne clique pas sur un élève

                                // Activer le choix de l'élève
                                document.querySelectorAll('.select-eleve').forEach(item => {
                                    item.addEventListener('click', () => {
                                        document.querySelectorAll('.select-eleve').forEach(i => i.classList.remove('border-emerald-600', 'bg-emerald-50'));
                                        item.classList.add('border-emerald-600', 'bg-emerald-50');

                                        const mat = item.getAttribute('data-matricule');
                                        const nomComplet = item.getAttribute('data-nom');

                                        inputMatriculeCache.value = mat;
                                        infoSelection.innerText = `Élève sélectionné : ${nomComplet} (Matricule : ${mat})`;
                                        formSaisie.classList.remove('hidden');
                                    });
                                });
                            });
                        });
                    } else {
                        ongletsContainer.innerHTML = `<span class="text-slate-400 italic">Aucune classe disponible. Demandez au gérant d'enregistrer des élèves.</span>`;
                    }
                } else {
                    ongletsContainer.innerHTML = `<span class="text-slate-400 italic">Aucun élève enregistré dans la base de données.</span>`;
                }

                document.getElementById('btn-publier-note').addEventListener('click', async () => {
                    const matricule = inputMatriculeCache.value;
                    const valeurNote = document.getElementById('note-valeur').value.trim();
                    const coursProf = userData.cours || "Mon Cours";

                    if (!matricule) {
                        alert("Veuillez sélectionner un élève dans la liste.");
                        return;
                    }
                    if (!valeurNote) {
                        alert("Veuillez saisir une note ou un résultat.");
                        return;
                    }

                    try {
                        // Stocker les notes par cours pour l'élève
                        await set(ref(db, `resultats/${matricule}/cours/${coursProf}`), {
                            note: valeurNote,
                            dateMiseAJour: new Date().toLocaleString()
                        });
                        alert(`Note enregistrée avec succès pour le cours de ${coursProf} !`);
                        document.getElementById('note-valeur').value = "";
                    } catch (err) {
                        alert("Erreur lors de l'enregistrement : " + err.message);
                    }
                });
            }

            if (roleActif === "Élève" || roleActif === "Parent") {
                document.getElementById('btn-chercher-notes').addEventListener('click', async () => {
                    const matricule = document.getElementById('consult-matricule').value.trim();
                    const resultatDiv = document.getElementById('resultats-affichage');

                    if (!matricule) {
                        resultatDiv.innerHTML = `<span class="text-rose-500">Veuillez entrer un matricule.</span>`;
                        return;
                    }

                    try {
                        const snap = await get(ref(db, 'resultats/' + matricule));
                        if (snap.exists()) {
                            const data = snap.val();
                            let htmlCours = "";
                            if (data.cours) {
                                for (let [coursNom, info] of Object.entries(data.cours)) {
                                    htmlCours += `<div class="p-2 mb-2 bg-slate-50 rounded-lg border"><strong>${coursNom}</strong> : ${info.note} <span class="text-[10px] text-slate-400 block">Mise à jour : ${info.dateMiseAJour}</span></div>`;
                                }
                            } else if (data.details) {
                                htmlCours = `<p class="whitespace-pre-line mb-2">${data.details}</p>`;
                            }

                            resultatDiv.innerHTML = `
                                <p class="font-bold text-indigo-600 mb-2">Matricule : ${matricule}</p>
                                <div class="space-y-1">${htmlCours}</div>
                            `;
                        } else {
                            resultatDiv.innerHTML = `<span class="text-amber-600 italic">Aucun résultat trouvé pour ce matricule.</span>`;
                        }
                    } catch (err) {
                        resultatDiv.innerHTML = `<span class="text-rose-500">Erreur lors de la recherche.</span>`;
                    }
                });
            }
        }
    </script>
</body>
</html>
